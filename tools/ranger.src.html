<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<title>Recevoir & ranger — Beauty Empire</title>
<!-- GÉNÉRÉ par tools/build_ranger.py depuis tools/ranger.src.html : ne pas modifier ranger.html à la main. -->
<style>
:root{--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--sunk:#f5f5f4;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif;font-size:17px}
header{position:sticky;top:0;z-index:5;background:var(--ok);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px}
header b{font-size:18px;flex:1}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px}
main{padding:14px;padding-bottom:120px;max-width:640px;margin:0 auto}
.big{display:block;width:100%;border:0;border-radius:16px;padding:18px;font-size:19px;font-weight:800;margin:10px 0;background:var(--ok);color:#fff;text-align:center}
.big.alt{background:var(--sunk);color:var(--ink)}
.big.warn{background:#fef3c7;color:#92400e}
.big small{display:block;font-weight:600;font-size:14px;opacity:.85;margin-top:3px}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row .nm{flex:1;min-width:0}
.row .nm small{display:block;color:var(--muted);font-size:13px}
.row b.q{font-size:20px}
.ph{width:56px;height:56px;border-radius:10px;background:var(--sunk);flex:none;object-fit:contain}
.card{background:var(--sunk);border-radius:18px;padding:12px;margin:10px 0}
.card .top{display:flex;gap:12px;align-items:center}
.card .top img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:12px}
.card h3{margin:0;font-size:18px}
.goto{font-size:20px;font-weight:900;color:var(--ok);margin:8px 0 4px}
.goto.none{color:var(--warn);font-size:17px}
.pz{position:relative;margin-top:8px;border-radius:12px;overflow:hidden;background:#000}
.pz img{display:block;width:100%}
.pz i{position:absolute;border:2px solid rgba(255,255,255,.5);border-radius:6px}
.pz i.hl{border:4px solid #ffd400;background:rgba(255,212,0,.35);animation:bl 1s infinite alternate}
@keyframes bl{to{background:rgba(255,212,0,.1)}}
.dim{color:var(--muted);font-size:14px}
.pill{display:inline-block;background:#dcfce7;color:var(--ok);border-radius:99px;padding:3px 10px;font-weight:800;font-size:14px}
.cnt{display:flex;align-items:center;gap:8px}
.cnt button{width:44px;height:44px;border-radius:12px;border:0;background:#fff;font-size:22px;font-weight:800}
.cnt span{min-width:40px;text-align:center;font-size:24px;font-weight:900}
.toast{position:fixed;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#1c1917;color:#fff;border-radius:14px;padding:14px;font-weight:700;z-index:90;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:6}
.bar .big{margin:0;padding:15px}
.cam{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover}
.cam .frame{position:absolute;left:10%;right:10%;top:28%;height:22%;border:3px solid #4ade80;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.cam .camtop{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;color:#fff;background:linear-gradient(rgba(0,0,0,.75),transparent);font-weight:700}
.cam .camtop .goto{color:#4ade80;margin:4px 0 0}
.cam .camui{position:absolute;left:0;right:0;bottom:0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
.cam .camui span{flex:1;font-weight:700}
.cam .camui button{border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:800}
.flash{position:absolute;inset:0;pointer-events:none;background:rgba(74,222,128,.35);opacity:0;transition:opacity .2s}
.flash.on{opacity:1}
.flash.bad{background:rgba(239,68,68,.45)}
input.t{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px}
</style>
</head>
<body>
<header><b id="ttl">📍 Recevoir & ranger</b><button id="hb" hidden>‹ Retour</button></header>
<main id="app"></main>
<div class="bar" id="bar" hidden></div>
<script>
// ══════════════════════════════════════════════════════════════════
//  📍 RECEVOIR & RANGER (11 Nov 2026) — phone page for the staff, opened
//  from the till's QR (📍 À ranger tile): #t= {p: Code GS, s: POS RECEIVER,
//  k: key, n: employee, l: store}. Kept on the phone (store phone stays
//  signed in until another QR is scanned).
//  📥 Recevoir: pick the transfer that arrived, scan each item out of the
//   box (blind, nothing expected is shown). After a few items, put them up
//   and scan the shelf label: the items scanned since the last label go on
//   that shelf. « Pas de place » = stays in « Non placé ». « Terminé » =
//   transfer received with what was scanned (POS RECEIVER saveTransfer:
//   stock into « Non placé ») + the shelf moves (Code GS placeItems).
//  📍 À ranger: what is in « Non placé » here; scan the product, then the
//   shelf label.
//  Everything waits in an outbox (localStorage) until it is sent.
// ══════════════════════════════════════════════════════════════════
function ls(k, v){ try { if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }
function lsj(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UNPLACED = 'Non placé';
/*@@SHARED@@*/

// ── session ──
let T = lsj('rg_tok', null);
(function(){
  const m = /#t=([^&]+)/.exec(location.hash);
  if(m){ try { T = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); ls('rg_tok', JSON.stringify(T)); } catch(e){} history.replaceState(null, '', location.pathname); }
})();
const HERE = T && T.l === 'Store 2' ? 'Store 2' : 'Store 1';
const HERE_NAME = HERE === 'Store 2' ? 'Ouaga 2000' : 'Balkuy';
let D = lsj('rg_data', null);            // { zones, spots, names, images, aliases, at }
let TR = lsj('rg_tr', []);               // transfers in transit to here
let R = lsj('rg_recv', null);            // receiving in progress
let OUT = lsj('rg_out', []);             // outbox
let PL = lsj('rg_placed', {});           // locally placed from « Non placé » not yet in D: bkey → qty
let V = { s: 'home' }, CUR = null, busy = false;
function save(){ ls('rg_recv', R ? JSON.stringify(R) : null); ls('rg_out', JSON.stringify(OUT)); ls('rg_placed', JSON.stringify(PL)); }
function toast(t, ms){ const o = $('.toast'); if(o) o.remove(); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 2600); }
function beep(ok){ try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = ok ? 1200 : 300; g.gain.value = .15; o.connect(g); g.connect(a.destination); o.start(); setTimeout(() => { o.stop(); a.close(); }, ok ? 90 : 300); } catch(e){} try { navigator.vibrate && navigator.vibrate(ok ? 40 : [80, 50, 80]); } catch(e){} }

// ── server ──
async function gsGet(action){ const r = await fetch(T.p + (T.p.includes('?') ? '&' : '?') + 'action=' + action + '&key=' + encodeURIComponent(T.k), { cache:'no-store' }); return r.json(); }
async function postTo(url, body){ const r = await fetch(url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: T.k }, body)) }); return r.json(); }
async function load(){
  try {
    const [d, ph] = await Promise.all([gsGet('getStock1981'), gsGet('getZonePhotos').catch(() => null)]);
    if(d && d.success){ D = { zones: d.zones || [], spots: d.spots || [], names: d.names || {}, images: d.images || {}, aliases: d.aliases || {}, at: Date.now() }; PL = {}; ls('rg_data', JSON.stringify(D)); save(); }
    if(ph && ph.success && ph.traces){ SHEET_TRACES = ph.traces; ls('s1981_traces', JSON.stringify(SHEET_TRACES)); if(ph.images){ ZIMG = ph.images; ls('s1981_zimg', JSON.stringify(ZIMG)); } }
  } catch(e){}
  try {
    const r = await fetch(T.s + (T.s.includes('?') ? '&' : '?') + 'action=getTransfers&key=' + encodeURIComponent(T.k), { cache:'no-store' });
    const j = await r.json();
    if(j && Array.isArray(j.transfers)){ TR = j.transfers.filter(t => t.status === 'transit' && t.to === HERE); ls('rg_tr', JSON.stringify(TR)); }
  } catch(e){}
  render();
}
async function flush(){
  if(busy || !OUT.length || !navigator.onLine) return;
  busy = true;
  try {
    while(OUT.length){
      const job = OUT[0];
      const d = await postTo(job.to === 'pos' ? T.s : T.p, job.body);
      if(!d || !(d.ok === true || d.success === true || /Rien à ranger/.test(d.error || ''))) throw new Error((d && d.error) || 'refusé');
      OUT.shift(); save();
    }
  } catch(e){ setTimeout(flush, 20000); }
  busy = false; render();
}
window.addEventListener('online', flush);

// ── products & places ──
function aliasOf(raw){ const s = String(raw || '').trim(); const a = D && D.aliases ? D.aliases[bkey(s)] : null; return a || s; }
function nameOf(bc){ const k = bkey(aliasOf(bc)); if(D && D.names && D.names[k]) return D.names[k]; const z = D && (D.zones || []).find(r => bkey(r[2]) === k && r[3]); return z ? z[3] : ''; }
function imgOf(bc){ const k = bkey(aliasOf(bc)); return D && D.images ? (D.images[k] || '') : ''; }
function zoneDef(loc, zone){ return (ZONES[loc] || []).find(z => z.c === zone) || null; }
function spotLabel(loc, zone, spot){ const s = zoneSpots(zoneDef(loc, zone)).find(x => x.code === spot); return s ? s.label : ''; }
function placeText(p){ if(!p) return ''; const l = p.spot ? spotLabel(HERE, p.zone, p.spot) : ''; return 'Zone ' + p.zone + (l && l !== 'Toute la zone' ? ' · ' + l : ''); }
// usual place of a product in this store: the shelf holding the most, else the zone
function suggest(bc){
  const k = bkey(aliasOf(bc)); if(!D) return null;
  const sp = D.spots.filter(r => r[0] === HERE && bkey(r[3]) === k && Number(r[5]) > 0 && r[1] !== UNPLACED).sort((a, b) => b[5] - a[5])[0];
  if(sp) return { zone: sp[1], spot: sp[2] };
  const z = D.zones.filter(r => r[0] === HERE && bkey(r[2]) === k && Number(r[4]) > 0 && r[1] !== UNPLACED && zoneDef(HERE, r[1])).sort((a, b) => b[4] - a[4])[0];
  return z ? { zone: z[1], spot: '' } : null;
}
// a shelf label S2-B7-3 → { zone:'B7', spot:'B7-3' } (only this store)
function shelfOf(raw){
  const tries = [String(raw || '').trim()]; tries.push(tries[0].split('').map(ch => AZ_MAP[ch] || ch).join(''));
  for(const t of tries){
    const m = /^S([12])-(.+)$/i.exec(t); if(!m) continue;
    const loc = 'Store ' + m[1], rest = m[2].toLowerCase();
    if(loc !== HERE) return { other: true };
    for(const z of (ZONES[loc] || [])){ const sp = zoneSpots(z).find(x => x.code.toLowerCase() === rest); if(sp) return { zone: z.c, spot: sp.code }; }
    const z = (ZONES[loc] || []).find(q => q.c.toLowerCase() === rest);
    if(z) return { zone: z.c, spot: zoneSpots(z).length === 1 ? zoneSpots(z)[0].code : '' };
    return { unknown: t };
  }
  return null;
}
function photoHTML(p){
  if(!p) return '';
  const src = photoFor(HERE, p.zone); if(!src) return '';
  const t = traceFor(HERE, p.zone);
  const boxes = t ? Object.keys(t.spots).map(c => { const [x, y, w, h] = t.spots[c]; return '<i class="' + (c === p.spot ? 'hl' : '') + '" style="left:' + x + '%;top:' + y + '%;width:' + w + '%;height:' + h + '%"></i>'; }).join('') : '';
  return '<div class="pz"><img src="' + esc(src) + '" alt="" onerror="this.parentNode.remove()">' + (p.spot && t && t.spots[p.spot] ? boxes : '') + '</div>';
}
function prodCard(bc, qtyHTML){
  const sg = suggest(bc), im = imgOf(bc);
  return '<div class="card"><div class="top">' + (im ? '<img src="' + esc(im) + '" alt="">' : '') + '<div style="flex:1"><h3>' + esc(nameOf(bc) || bc) + '</h3>' + (qtyHTML || '') + '</div></div>' +
    (sg ? '<div class="goto">➡ ' + esc(placeText(sg)) + '</div>' + photoHTML(sg) : '<div class="goto none">Pas encore de place ici : laissez-le de côté (« Pas de place »), 1981 décidera.</div>') + '</div>';
}

// ── camera (BarcodeDetector, else ZXing) — stays open; onCode(code) for each scan ──
let camStream = null, camTimer = null, zxReader = null, camCB = null;
async function openCamera(onCode, top){
  closeCamera(); camCB = onCode;
  const box = document.createElement('div'); box.className = 'cam'; box.id = 'cam';
  box.innerHTML = '<video playsinline muted></video><div class="frame"></div><div class="flash" id="flash"></div><div class="camtop" id="camtop">' + (top || '') + '</div><div class="camui"><span id="camtxt">Visez le code-barres</span><button id="camx" style="background:#fff">Fermer</button></div>';
  document.body.appendChild(box);
  $('#camx').onclick = () => { closeCamera(); render(); };
  const video = box.querySelector('video');
  let last = '', lastAt = 0;
  const hit = code => { const now = Date.now(); if(code === last && now - lastAt < 1500) return; last = code; lastAt = now; if(camCB) camCB(code); };
  try {
    if('BarcodeDetector' in window){
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = camStream; await video.play();
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'] });
      camTimer = setInterval(async () => { try { const r = await det.detect(video); if(r[0]) hit(r[0].rawValue); } catch(e){} }, 220);
    } else {
      if(!window.ZXing) await new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
      zxReader = new ZXing.BrowserMultiFormatReader();
      await zxReader.decodeFromConstraints({ video: { facingMode: 'environment' } }, video, r => { if(r) hit(r.getText()); });
    }
  } catch(e){ const t = $('#camtxt'); if(t) t.textContent = 'Appareil photo indisponible : autorisez la caméra pour ce site.'; }
}
function closeCamera(){
  clearInterval(camTimer); camTimer = null; camCB = null;
  try { if(zxReader) zxReader.reset(); } catch(e){} zxReader = null;
  if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const b = $('#cam'); if(b) b.remove();
}
function camSay(txt, top, bad){
  const t = $('#camtxt'); if(t) t.textContent = txt;
  if(top != null){ const c = $('#camtop'); if(c) c.innerHTML = top; }
  const f = $('#flash'); if(f){ f.className = 'flash on' + (bad ? ' bad' : ''); setTimeout(() => { f.className = 'flash'; }, 250); }
}

// ══ 📥 RECEIVING ══
function groups(){
  const g = {};
  TR.forEach(t => { const k = t.grp || t.uid; (g[k] = g[k] || { grp: k, gid: t.gid || t.id, from: t.fulfiller || t.from, lines: [], ts: t.sentTs || t.ts }).lines.push(t); });
  return Object.values(g).sort((a, b) => String(a.ts).localeCompare(String(b.ts)));
}
function recvStart(grp){
  const g = groups().find(x => x.grp === grp); if(!g) return;
  R = { grp: g.grp, gid: g.gid, from: g.from, lines: g.lines, got: {}, nm: {}, pend: {}, placed: [], last: '' };
  save(); V = { s: 'recv' }; render(); recvCam();
}
function _rk(bc){ return bkey(aliasOf(bc)); }
function recvTop(){
  if(!R || !R.last) return '<div>Sortez un article du carton et scannez-le.</div>';
  const k = R.last, sg = suggest(k), n = R.pend[k] || 0;
  return '<div>' + esc(R.nm[k] || nameOf(k) || k) + ' — <b>' + n + '</b> à poser</div>' + (sg ? '<div class="goto">➡ ' + esc(placeText(sg)) + '</div>' : '<div class="goto" style="color:#fbbf24">Pas de place connue</div>') +
    '<div style="font-size:13px;opacity:.85;margin-top:4px">Posez-les, puis scannez l’étiquette de l’étagère.</div>';
}
function recvCam(){ openCamera(recvCode, recvTop()); }
function recvCode(raw){
  const code = String(raw || '').trim();
  const sh = shelfOf(code);
  if(sh){ recvShelf(sh); return; }
  if(!/^\d{6,14}$/.test(code)){ beep(false); camSay('Code non reconnu : ' + code, null, true); return; }
  const k = _rk(code);
  R.got[k] = (R.got[k] || 0) + 1; R.pend[k] = (R.pend[k] || 0) + 1; R.nm[k] = R.nm[k] || nameOf(code) || ((R.lines.find(l => bkey(l.barcode) === k) || {}).name) || code; R.last = k;
  save(); beep(true);
  camSay('+1 ' + R.nm[k] + ' (total ' + R.got[k] + ')', recvTop());
}
function recvShelf(sh){
  if(sh.other){ beep(false); camSay('Étiquette d’un autre magasin !', null, true); return; }
  if(sh.unknown){ beep(false); camSay('Étagère inconnue : ' + sh.unknown, null, true); return; }
  const ks = Object.keys(R.pend).filter(k => R.pend[k] > 0);
  if(!ks.length){ beep(false); camSay('Scannez d’abord les articles à poser.', null, true); return; }
  const off = ks.filter(k => { const sg = suggest(k); return sg && sg.zone !== sh.zone; });
  if(off.length && !confirm((off.length === 1 ? R.nm[off[0]] : off.length + ' produits') + ' : ce n’est pas l’étagère prévue (' + placeText(suggest(off[0])) + ').\nPoser ici quand même (' + placeText(sh) + ') ?')) { camSay('D’accord : allez à l’étagère prévue.'); return; }
  let n = 0;
  ks.forEach(k => { R.placed.push({ barcode: k, name: R.nm[k] || k, qty: R.pend[k], toZone: sh.zone, spot: sh.spot }); n += R.pend[k]; R.pend[k] = 0; });
  save(); beep(true);
  camSay('✓ ' + n + ' article(s) posé(s) : ' + placeText(sh), '<div>Continuez : article suivant.</div>');
}
function recvNoPlace(){ Object.keys(R.pend).forEach(k => R.pend[k] = 0); save(); toast('Laissé dans « Non placé ».'); render(); }
function recvFinish(){
  const tot = Object.values(R.got).reduce((a, n) => a + n, 0);
  const pend = Object.values(R.pend).reduce((a, n) => a + n, 0);
  if(!tot){ if(!confirm('Aucun article scanné. Marquer ce transfert comme reçu VIDE ?')) return; }
  else if(!confirm('Terminer : ' + tot + ' article(s) reçu(s)' + (pend ? ', dont ' + pend + ' pas encore posé(s) (resteront dans « Non placé »)' : '') + ' ?')) return;
  closeCamera();
  const now = new Date(), who = T.n || '?', seen = {};
  const pad = n => String(n).padStart(2, '0');
  const date = pad(now.getDate()) + '/' + pad(now.getMonth() + 1) + '/' + now.getFullYear(), time = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  const push = rec => { rec.upd = Date.now() + OUT.length; OUT.push({ to: 'pos', body: { action: 'saveTransfer', uid: rec.uid, upd: rec.upd, id: rec.id, status: rec.status, from: rec.from, to: rec.to,
    barcode: rec.barcode || '', name: rec.name, qty: rec.qty, qtyReceived: rec.qtyReceived == null ? '' : rec.qtyReceived, by: rec.by || '', receivedBy: rec.receivedBy || '', date: rec.date || '', json: JSON.stringify(rec) } }); };
  R.lines.forEach(l => { const k = bkey(l.barcode); const got = seen[k] ? 0 : (R.got[k] || 0); seen[k] = 1;
    push(Object.assign({}, l, { status: 'received', qtyReceived: got, receivedBy: who, receivedTs: now.toISOString(), gapReason: '', viaPhone: true })); });
  Object.keys(R.got).filter(k => !seen[k] && R.got[k] > 0).forEach((k, i) => push({ uid: R.grp + '-p' + Date.now().toString(36) + i, grp: R.grp, gid: R.gid, id: R.gid, ts: now.toISOString(), date, time,
    from: R.from, to: HERE, fulfiller: R.from, barcode: k, name: R.nm[k] || k, qty: 0, reqQty: 0, status: 'received', qtyReceived: R.got[k], receivedBy: who, receivedTs: now.toISOString(), by: who, extra: true, zoneIn: UNPLACED, viaPhone: true }));
  if(R.placed.length) OUT.push({ to: 'gs', body: { action: 'placeItems', location: HERE, by: who, items: R.placed.map((p, i) => Object.assign({ opId: 'rg' + Date.now().toString(36) + i }, p)) } });
  TR = TR.filter(t => (t.grp || t.uid) !== R.grp); ls('rg_tr', JSON.stringify(TR));
  const placedN = R.placed.reduce((a, p) => a + p.qty, 0);
  R = null; save(); V = { s: 'home' };
  toast('📥 Reçu : ' + tot + ' article(s)' + (placedN ? ', ' + placedN + ' rangé(s)' : '') + '. Merci !', 4000);
  render(); flush();
}

// ══ 📍 « NON PLACÉ » ══
function unplaced(){
  if(!D) return [];
  return D.zones.filter(r => r[0] === HERE && r[1] === UNPLACED && Number(r[4]) > 0).map(r => ({ barcode: r[2], name: r[3] || nameOf(r[2]) || r[2], qty: Number(r[4]) - (PL[bkey(r[2])] || 0) })).filter(x => x.qty > 0).sort((a, b) => b.qty - a.qty);
}
function upOpen(bc){ const it = unplaced().find(x => bkey(x.barcode) === bkey(aliasOf(bc))); if(!it){ beep(false); toast('Ce produit n’est pas dans « Non placé ».'); return false; } CUR = { barcode: it.barcode, name: it.name, max: it.qty, n: it.qty }; V = { s: 'up1' }; render(); return true; }
function upScanProduct(){ openCamera(code => { const sh = shelfOf(code); if(sh){ beep(false); camSay('Scannez d’abord le PRODUIT.', null, true); return; } closeCamera(); beep(true); upOpen(code); }, '<div>Scannez le produit à ranger</div>'); }
function upScanShelf(){
  openCamera(code => {
    const sh = shelfOf(code);
    if(!sh){ beep(false); camSay('Ce n’est pas une étiquette d’étagère.', null, true); return; }
    if(sh.other || sh.unknown){ beep(false); camSay(sh.other ? 'Étiquette d’un autre magasin !' : 'Étagère inconnue.', null, true); return; }
    const sg = suggest(CUR.barcode);
    if(sg && sg.zone !== sh.zone && !confirm('Ce n’est pas l’étagère prévue (' + placeText(sg) + ').\nPoser ici quand même (' + placeText(sh) + ') ?')) return;
    closeCamera(); beep(true);
    OUT.push({ to: 'gs', body: { action: 'placeItems', location: HERE, by: T.n || '?', items: [{ opId: 'rg' + Date.now().toString(36), barcode: CUR.barcode, name: CUR.name, qty: CUR.n, toZone: sh.zone, spot: sh.spot }] } });
    PL[bkey(CUR.barcode)] = (PL[bkey(CUR.barcode)] || 0) + CUR.n; save();
    toast('✓ ' + CUR.n + ' × ' + CUR.name + ' → ' + placeText(sh), 3000);
    CUR = null; V = { s: 'up' }; render(); flush();
  }, '<div>' + esc(CUR.name) + ' × ' + CUR.n + '</div><div style="font-size:13px;opacity:.85;margin-top:4px">Posez-les, puis scannez l’étiquette de l’étagère.</div>');
}

// ══ RENDER ══
function render(){
  const app = $('#app'), bar = $('#bar'), hb = $('#hb');
  bar.hidden = true; bar.innerHTML = '';
  if(!T || !T.p || !T.s || !T.k){ app.innerHTML = '<div class="card"><h3>Ouvrez cette page depuis la caisse</h3><p>Sur la caisse : tuile <b>📍 À ranger</b>, puis scannez le QR code avec l’appareil photo du téléphone.</p></div>'; hb.hidden = true; return; }
  hb.hidden = V.s === 'home';
  hb.onclick = () => { closeCamera(); if(V.s === 'up1'){ V = { s: 'up' }; } else V = { s: 'home' }; render(); };
  const pendOut = OUT.length ? '<div class="dim" style="text-align:center;margin-top:10px">⏳ ' + OUT.length + ' envoi(s) en attente' + (navigator.onLine ? '…' : ' (hors ligne)') + '</div>' : '';
  if(V.s === 'home'){
    $('#ttl').textContent = '📍 ' + HERE_NAME;
    const G = groups(), U = unplaced(), un = U.reduce((a, x) => a + x.qty, 0);
    app.innerHTML = '<div style="font-size:20px;font-weight:800;margin:4px 0 2px">Bonjour ' + esc(T.n || '') + '</div><div class="dim">' + (D ? 'Données du ' + new Date(D.at).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : 'Chargement…') + '</div>' +
      (R ? '<button class="big warn" id="bres">▶ Reprendre la réception ' + esc(R.gid) + '</button>' : '') +
      '<button class="big" id="brecv">📥 Recevoir un transfert<small>' + (G.length ? G.length + ' arrivé(s) ou en route' : 'Aucun en route') + '</small></button>' +
      '<button class="big alt" id="bup">📍 À ranger<small>' + un + ' article(s) dans « Non placé »</small></button>' +
      '<button class="big alt" id="bload" style="font-size:15px;padding:12px">🔄 Mettre à jour</button>' + pendOut +
      '<p class="dim" style="margin-top:18px">Pas vous ? Scannez le QR de la caisse avec votre nom.</p>';
    $('#brecv').onclick = () => { if(R){ toast('Terminez d’abord la réception en cours.'); return; } V = { s: 'recvpick' }; render(); };
    $('#bup').onclick = () => { V = { s: 'up' }; render(); };
    $('#bload').onclick = () => { app.querySelector('#bload').textContent = 'Chargement…'; load(); flush(); };
    if(R) $('#bres').onclick = () => { V = { s: 'recv' }; render(); };
    return;
  }
  if(V.s === 'recvpick'){
    $('#ttl').textContent = '📥 Quel transfert ?';
    const G = groups();
    app.innerHTML = G.length ? '<p class="dim">Touchez le transfert qui vient d’arriver.</p>' + G.map(g => '<button class="big alt" data-g="' + esc(g.grp) + '">' + esc(g.gid) + '<small>depuis ' + (g.from === 'Warehouse' ? 'l’entrepôt' : g.from === 'Store 1' ? 'Balkuy' : 'Ouaga 2000') + ' · ' + g.lines.length + ' produit(s)</small></button>').join('')
      : '<div class="card">Aucun transfert en route vers ' + HERE_NAME + '.<br><span class="dim">Touchez 🔄 Mettre à jour sur l’accueil si un transfert vient d’être envoyé.</span></div>';
    app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => recvStart(b.dataset.g));
    return;
  }
  if(V.s === 'recv' && R){
    $('#ttl').textContent = '📥 ' + R.gid;
    const pend = Object.keys(R.pend).filter(k => R.pend[k] > 0), tot = Object.values(R.got).reduce((a, n) => a + n, 0), plc = R.placed.reduce((a, p) => a + p.qty, 0);
    app.innerHTML = '<div class="card"><b>' + tot + '</b> article(s) scanné(s) · <b>' + plc + '</b> posé(s)' + (pend.length ? ' · <b style="color:var(--warn)">' + pend.reduce((a, k) => a + R.pend[k], 0) + ' à poser</b>' : '') + '</div>' +
      '<button class="big" id="bcam">📷 Scanner (articles et étiquettes)</button>' +
      (pend.length ? '<div style="font-weight:800;margin-top:14px">À poser maintenant</div>' + pend.map(k => prodCard(k, '<span class="pill">× ' + R.pend[k] + '</span>')).join('') +
        '<button class="big alt" id="bnop">Pas de place → laisser dans « Non placé »</button>' : '') +
      (R.placed.length ? '<div style="font-weight:800;margin-top:14px">Déjà posé</div>' + R.placed.map(p => '<div class="row"><div class="nm">' + esc(p.name) + '<small>' + esc(placeText({ zone: p.toZone, spot: p.spot })) + '</small></div><b class="q">× ' + p.qty + '</b></div>').join('') : '') +
      '<p class="dim">Scannez chaque article qui sort du carton. Quand vous avez posé un groupe sur l’étagère, scannez l’étiquette de l’étagère.</p>';
    bar.hidden = false; bar.innerHTML = '<button class="big" id="bfin" style="background:#1c1917">📥 Terminé</button>';
    $('#bcam').onclick = recvCam; $('#bfin').onclick = recvFinish;
    const nb = $('#bnop'); if(nb) nb.onclick = recvNoPlace;
    return;
  }
  if(V.s === 'up'){
    $('#ttl').textContent = '📍 À ranger';
    const U = unplaced();
    app.innerHTML = '<button class="big" id="bscan">📷 Scanner un produit à ranger</button>' + (U.length ? U.map(x => { const sg = suggest(x.barcode), im = imgOf(x.barcode);
      return '<div class="row" data-b="' + esc(x.barcode) + '">' + (im ? '<img class="ph" src="' + esc(im) + '" alt="">' : '<div class="ph"></div>') + '<div class="nm"><b>' + esc(x.name) + '</b><small>' + (sg ? '➡ ' + esc(placeText(sg)) : 'Place à décider par 1981') + '</small></div><b class="q">× ' + x.qty + '</b></div>'; }).join('')
      : '<div class="card">Rien dans « Non placé ». 👍</div>') + pendOut;
    $('#bscan').onclick = upScanProduct;
    app.querySelectorAll('[data-b]').forEach(r => r.onclick = () => upOpen(r.dataset.b));
    return;
  }
  if(V.s === 'up1' && CUR){
    $('#ttl').textContent = '📍 Ranger';
    app.innerHTML = prodCard(CUR.barcode, '<div class="cnt" style="margin-top:6px"><button id="cm">−</button><span id="cn">' + CUR.n + '</span><button id="cp">+</button></div><div class="dim">combien vous posez (max ' + CUR.max + ')</div>');
    bar.hidden = false; bar.innerHTML = '<button class="big" id="bsh">📷 Posé : scanner l’étagère</button>';
    $('#cm').onclick = () => { CUR.n = Math.max(1, CUR.n - 1); $('#cn').textContent = CUR.n; };
    $('#cp').onclick = () => { CUR.n = Math.min(CUR.max, CUR.n + 1); $('#cn').textContent = CUR.n; };
    $('#bsh').onclick = upScanShelf;
    return;
  }
  V = { s: 'home' }; render();
}
render();
if(T && T.p){ load(); flush(); setInterval(flush, 60000); }
</script>
</body>
</html>
