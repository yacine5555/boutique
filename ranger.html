function parseShape(str){
  const o = { rows:[], T:0, C:0, G:0, D:0 };
  String(str || '').trim().split(/\s+/).forEach(t => {
    const m = t.match(/^([TCGD])(\d+)$/i);
    if(m){ o[m[1].toUpperCase()] = +m[2]; return; }
    t.split(',').forEach(n => { const v = parseInt(n, 10); if(v > 0 && v <= 12) o.rows.push(v); });
  });
  return o;
}

function zoneSpots(z){ return z && z.s ? shapeSpots(z.c, z.s) : (z ? [{ code: z.c + '-W', label: 'Toute la zone' + (z.k ? ' · ' + z.k : '') }] : []); }
function shapeSpots(zone, shape){
  const sh = parseShape(shape), out = [];
  for(let s = sh.rows.length; s >= 1; s--){ const n = sh.rows[s-1]; for(let c = 1; c <= n; c++) out.push({ code: n > 1 ? `${zone}-${s}-${c}` : `${zone}-${s}`, label: 'Étagère ' + s + (n > 1 ? ' · case ' + c : '') }); }
  for(let d = 1; d <= sh.T; d++) out.push({ code:`${zone}-T${d}`, label:'Tiroir ' + d });
  for(let c = 1; c <= sh.C; c++) out.push({ code:`${zone}-C${c}`, label:'Côté · case ' + c });
  for(let c = 1; c <= sh.G; c++) out.push({ code:`${zone}-G${c}`, label:'Côté gauche · case ' + c });
  for(let c = 1; c <= sh.D; c++) out.push({ code:`${zone}-D${c}`, label:'Côté droit · case ' + c });

  return out;
}

function recvStart(grp){
  const g = groups().find(x => x.grp === grp); if(!g) return;
  R = { grp: g.grp, gid: g.gid, from: g.from, lines: g.lines, got: {}, nm: {}, pend: {}, placed: [], last: '' };
  save(); V = { s: 'recv' }; render(); recvCam();
}
function _rk(bc){ return bkey(aliasOf(bc)); }
function recvTop(){
  if(!R || !R.last) return '<div>Sortez un article du carton et scannez-le.</div>';
  const k = R.last, sg = suggest(k), n = R.pend[k] || 0;
  return '<div>' + esc(R.nm[k] || nameOf(k) || k) + ' — <b>' + n + '</b> à poser</div>' + (sg ? '<div class="goto">➡ ' + esc(placeText(sg)) + '</div>' : '<div class="goto" style="color:#fbbf24">Pas de place connue</div>') +
    '<div style="font-size:13px;opacity:.85;margin-top:4px">Posez-les, puis scannez l’étiquette de l’étagère.</div>';
}
function recvCam(){ openCamera(recvCode, recvTop()); }
function recvCode(raw){
  const code = String(raw || '').trim();
  const sh = shelfOf(code);
  if(sh){ recvShelf(sh); return; }
  if(!/^\d{6,14}$/.test(code)){ beep(false); camSay('Code non reconnu : ' + code, null, true); return; }
  const k = _rk(code);
  R.got[k] = (R.got[k] || 0) + 1; R.pend[k] = (R.pend[k] || 0) + 1; R.nm[k] = R.nm[k] || nameOf(code) || ((R.lines.find(l => bkey(l.barcode) === k) || {}).name) || code; R.last = k;
  save(); beep(true);
  camSay('+1 ' + R.nm[k] + ' (total ' + R.got[k] + ')', recvTop());
}
function recvShelf(sh){
  if(sh.other){ beep(false); camSay('Étiquette d’un autre magasin !', null, true); return; }
  if(sh.unknown){ beep(false); camSay('Étagère inconnue : ' + sh.unknown, null, true); return; }
  const ks = Object.keys(R.pend).filter(k => R.pend[k] > 0);
  if(!ks.length){ beep(false); camSay('Scannez d’abord les articles à poser.', null, true); return; }
  const off = ks.filter(k => { const sg = suggest(k); return sg && sg.zone !== sh.zone; });
  if(off.length && !confirm((off.length === 1 ? R.nm[off[0]] : off.length + ' produits') + ' : ce n’est pas l’étagère prévue (' + placeText(suggest(off[0])) + ').\nPoser ici quand même (' + placeText(sh) + ') ?')) { camSay('D’accord : allez à l’étagère prévue.'); return; }
  let n = 0;
  ks.forEach(k => { R.placed.push({ barcode: k, name: R.nm[k] || k, qty: R.pend[k], toZone: sh.zone, spot: sh.spot }); n += R.pend[k]; R.pend[k] = 0; });
  save(); beep(true);
  camSay('✓ ' + n + ' article(s) posé(s) : ' + placeText(sh), '<div>Continuez : article suivant.</div>');
}
function recvNoPlace(){ Object.keys(R.pend).forEach(k => R.pend[k] = 0); save(); toast('Laissé dans « Non placé ».'); render(); }
function recvFinish(){
  const tot = Object.values(R.got).reduce((a, n) => a + n, 0);
  const pend = Object.values(R.pend).reduce((a, n) => a + n, 0);
  if(!tot){ if(!confirm('Aucun article scanné. Marquer ce transfert comme reçu VIDE ?')) return; }
  else if(!confirm('Terminer : ' + tot + ' article(s) reçu(s)' + (pend ? ', dont ' + pend + ' pas encore posé(s) (resteront dans « Non placé »)' : '') + ' ?')) return;
  closeCamera();
  const now = new Date(), who = T.n || '?', seen = {};
  const pad = n => String(n).padStart(2, '0');
  const date = pad(now.getDate()) + '/' + pad(now.getMonth() + 1) + '/' + now.getFullYear(), time = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  const push = rec => { rec.upd = Date.now() + OUT.length; OUT.push({ to: 'pos', body: { action: 'saveTransfer', uid: rec.uid, upd: rec.upd, id: rec.id, status: rec.status, from: rec.from, to: rec.to,
    barcode: rec.barcode || '', name: rec.name, qty: rec.qty, qtyReceived: rec.qtyReceived == null ? '' : rec.qtyReceived, by: rec.by || '', receivedBy: rec.receivedBy || '', date: rec.date || '', json: JSON.stringify(rec) } }); };
  R.lines.forEach(l => { const k = bkey(l.barcode); const got = seen[k] ? 0 : (R.got[k] || 0); seen[k] = 1;
    push(Object.assign({}, l, { status: 'received', qtyReceived: got, receivedBy: who, receivedTs: now.toISOString(), gapReason: '', viaPhone: true })); });
  Object.keys(R.got).filter(k => !seen[k] && R.got[k] > 0).forEach((k, i) => push({ uid: R.grp + '-p' + Date.now().toString(36) + i, grp: R.grp, gid: R.gid, id: R.gid, ts: now.toISOString(), date, time,
    from: R.from, to: HERE, fulfiller: R.from, barcode: k, name: R.nm[k] || k, qty: 0, reqQty: 0, status: 'received', qtyReceived: R.got[k], receivedBy: who, receivedTs: now.toISOString(), by: who, extra: true, zoneIn: UNPLACED, viaPhone: true }));
  if(R.placed.length) OUT.push({ to: 'gs', body: { action: 'placeItems', location: HERE, by: who, items: R.placed.map((p, i) => Object.assign({ opId: 'rg' + Date.now().toString(36) + i }, p)) } });
  TR = TR.filter(t => (t.grp || t.uid) !== R.grp); ls('rg_tr', JSON.stringify(TR));
  const placedN = R.placed.reduce((a, p) => a + p.qty, 0);
  R = null; save(); V = { s: 'home' };
  toast('📥 Reçu : ' + tot + ' article(s)' + (placedN ? ', ' + placedN + ' rangé(s)' : '') + '. Merci !', 4000);
  render(); flush();
}

// ══ 📍 « NON PLACÉ » ══
function unplaced(){
  if(!D) return [];
  return D.zones.filter(r => r[0] === HERE && r[1] === UNPLACED && Number(r[4]) > 0).map(r => ({ barcode: r[2], name: r[3] || nameOf(r[2]) || r[2], qty: Number(r[4]) - (PL[bkey(r[2])] || 0) })).filter(x => x.qty > 0).sort((a, b) => b.qty - a.qty);
}
function upOpen(bc){ const it = unplaced().find(x => bkey(x.barcode) === bkey(aliasOf(bc))); if(!it){ beep(false); toast('Ce produit n’est pas dans « Non placé ».'); return false; } CUR = { barcode: it.barcode, name: it.name, max: it.qty, n: it.qty }; V = { s: 'up1' }; render(); return true; }
function upScanProduct(){ openCamera(code => { const sh = shelfOf(code); if(sh){ beep(false); camSay('Scannez d’abord le PRODUIT.', null, true); return; } closeCamera(); beep(true); upOpen(code); }, '<div>Scannez le produit à ranger</div>'); }
function upScanShelf(){
  openCamera(code => {
    const sh = shelfOf(code);
    if(!sh){ beep(false); camSay('Ce n’est pas une étiquette d’étagère.', null, true); return; }
    if(sh.other || sh.unknown){ beep(false); camSay(sh.other ? 'Étiquette d’un autre magasin !' : 'Étagère inconnue.', null, true); return; }
    const sg = suggest(CUR.barcode);
    if(sg && sg.zone !== sh.zone && !confirm('Ce n’est pas l’étagère prévue (' + placeText(sg) + ').\nPoser ici quand même (' + placeText(sh) + ') ?')) return;
    closeCamera(); beep(true);
    OUT.push({ to: 'gs', body: { action: 'placeItems', location: HERE, by: T.n || '?', items: [{ opId: 'rg' + Date.now().toString(36), barcode: CUR.barcode, name: CUR.name, qty: CUR.n, toZone: sh.zone, spot: sh.spot }] } });
    PL[bkey(CUR.barcode)] = (PL[bkey(CUR.barcode)] || 0) + CUR.n; save();
    toast('✓ ' + CUR.n + ' × ' + CUR.name + ' → ' + placeText(sh), 3000);
    CUR = null; V = { s: 'up' }; render(); flush();
  }, '<div>' + esc(CUR.name) + ' × ' + CUR.n + '</div><div style="font-size:13px;opacity:.85;margin-top:4px">Posez-les, puis scannez l’étiquette de l’étagère.</div>');
}

// ══ RENDER ══
function render(){
  const app = $('#app'), bar = $('#bar'), hb = $('#hb');
  bar.hidden = true; bar.innerHTML = '';
  if(!T || !T.p || !T.s || !T.k){ app.innerHTML = '<div class="card"><h3>Ouvrez cette page depuis la caisse</h3><p>Sur la caisse : tuile <b>📍 À ranger</b>, puis scannez le QR code avec l’appareil photo du téléphone.</p></div>'; hb.hidden = true; return; }
  hb.hidden = V.s === 'home';
  hb.onclick = () => { closeCamera(); if(V.s === 'up1'){ V = { s: 'up' }; } else V = { s: 'home' }; render(); };
  const pendOut = OUT.length ? '<div class="dim" style="text-align:center;margin-top:10px">⏳ ' + OUT.length + ' envoi(s) en attente' + (navigator.onLine ? '…' : ' (hors ligne)') + '</div>' : '';
  if(V.s === 'home'){
    $('#ttl').textContent = '📍 ' + HERE_NAME;
    const G = groups(), U = unplaced(), un = U.reduce((a, x) => a + x.qty, 0);
    app.innerHTML = '<div style="font-size:20px;font-weight:800;margin:4px 0 2px">Bonjour ' + esc(T.n || '') + '</div><div class="dim">' + (D ? 'Données du ' + new Date(D.at).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : 'Chargement…') + '</div>' +
      (R ? '<button class="big warn" id="bres">▶ Reprendre la réception ' + esc(R.gid) + '</button>' : '') +
      '<button class="big" id="brecv">📥 Recevoir un transfert<small>' + (G.length ? G.length + ' arrivé(s) ou en route' : 'Aucun en route') + '</small></button>' +
      '<button class="big alt" id="bup">📍 À ranger<small>' + un + ' article(s) dans « Non placé »</small></button>' +
      '<button class="big alt" id="bload" style="font-size:15px;padding:12px">🔄 Mettre à jour</button>' + pendOut +
      '<p class="dim" style="margin-top:18px">Pas vous ? Scannez le QR de la caisse avec votre nom.</p>';
    $('#brecv').onclick = () => { if(R){ toast('Terminez d’abord la réception en cours.'); return; } V = { s: 'recvpick' }; render(); };
    $('#bup').onclick = () => { V = { s: 'up' }; render(); };
    $('#bload').onclick = () => { app.querySelector('#bload').textContent = 'Chargement…'; load(); flush(); };
    if(R) $('#bres').onclick = () => { V = { s: 'recv' }; render(); };
    return;
  }
  if(V.s === 'recvpick'){
    $('#ttl').textContent = '📥 Quel transfert ?';
    const G = groups();
    app.innerHTML = G.length ? '<p class="dim">Touchez le transfert qui vient d’arriver.</p>' + G.map(g => '<button class="big alt" data-g="' + esc(g.grp) + '">' + esc(g.gid) + '<small>depuis ' + (g.from === 'Warehouse' ? 'l’entrepôt' : g.from === 'Store 1' ? 'Balkuy' : 'Ouaga 2000') + ' · ' + g.lines.length + ' produit(s)</small></button>').join('')
      : '<div class="card">Aucun transfert en route vers ' + HERE_NAME + '.<br><span class="dim">Touchez 🔄 Mettre à jour sur l’accueil si un transfert vient d’être envoyé.</span></div>';
    app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => recvStart(b.dataset.g));
    return;
  }
  if(V.s === 'recv' && R){
    $('#ttl').textContent = '📥 ' + R.gid;
    const pend = Object.keys(R.pend).filter(k => R.pend[k] > 0), tot = Object.values(R.got).reduce((a, n) => a + n, 0), plc = R.placed.reduce((a, p) => a + p.qty, 0);
    app.innerHTML = '<div class="card"><b>' + tot + '</b> article(s) scanné(s) · <b>' + plc + '</b> posé(s)' + (pend.length ? ' · <b style="color:var(--warn)">' + pend.reduce((a, k) => a + R.pend[k], 0) + ' à poser</b>' : '') + '</div>' +
      '<button class="big" id="bcam">📷 Scanner (articles et étiquettes)</button>' +
      (pend.length ? '<div style="font-weight:800;margin-top:14px">À poser maintenant</div>' + pend.map(k => prodCard(k, '<span class="pill">× ' + R.pend[k] + '</span>')).join('') +
        '<button class="big alt" id="bnop">Pas de place → laisser dans « Non placé »</button>' : '') +
      (R.placed.length ? '<div style="font-weight:800;margin-top:14px">Déjà posé</div>' + R.placed.map(p => '<div class="row"><div class="nm">' + esc(p.name) + '<small>' + esc(placeText({ zone: p.toZone, spot: p.spot })) + '</small></div><b class="q">× ' + p.qty + '</b></div>').join('') : '') +
      '<p class="dim">Scannez chaque article qui sort du carton. Quand vous avez posé un groupe sur l’étagère, scannez l’étiquette de l’étagère.</p>';
    bar.hidden = false; bar.innerHTML = '<button class="big" id="bfin" style="background:#1c1917">📥 Terminé</button>';
    $('#bcam').onclick = recvCam; $('#bfin').onclick = recvFinish;
    const nb = $('#bnop'); if(nb) nb.onclick = recvNoPlace;
    return;
  }
  if(V.s === 'up'){
    $('#ttl').textContent = '📍 À ranger';
    const U = unplaced();
    app.innerHTML = '<button class="big" id="bscan">📷 Scanner un produit à ranger</button>' + (U.length ? U.map(x => { const sg = suggest(x.barcode), im = imgOf(x.barcode);
      return '<div class="row" data-b="' + esc(x.barcode) + '">' + (im ? '<img class="ph" src="' + esc(im) + '" alt="">' : '<div class="ph"></div>') + '<div class="nm"><b>' + esc(x.name) + '</b><small>' + (sg ? '➡ ' + esc(placeText(sg)) : 'Place à décider par 1981') + '</small></div><b class="q">× ' + x.qty + '</b></div>'; }).join('')
      : '<div class="card">Rien dans « Non placé ». 👍</div>') + pendOut;
    $('#bscan').onclick = upScanProduct;
    app.querySelectorAll('[data-b]').forEach(r => r.onclick = () => upOpen(r.dataset.b));
    return;
  }
  if(V.s === 'up1' && CUR){
    $('#ttl').textContent = '📍 Ranger';
    app.innerHTML = prodCard(CUR.barcode, '<div class="cnt" style="margin-top:6px"><button id="cm">−</button><span id="cn">' + CUR.n + '</span><button id="cp">+</button></div><div class="dim">combien vous posez (max ' + CUR.max + ')</div>');
    bar.hidden = false; bar.innerHTML = '<button class="big" id="bsh">📷 Posé : scanner l’étagère</button>';
    $('#cm').onclick = () => { CUR.n = Math.max(1, CUR.n - 1); $('#cn').textContent = CUR.n; };
    $('#cp').onclick = () => { CUR.n = Math.min(CUR.max, CUR.n + 1); $('#cn').textContent = CUR.n; };
    $('#bsh').onclick = upScanShelf;
    return;
  }
  V = { s: 'home' }; render();
}
render();
if(T && T.p){ load(); flush(); setInterval(flush, 60000); }
</script>
</body>
</html>
