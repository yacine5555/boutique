function applySheetMaps(layouts){
  Object.keys(MAPS_BUILTIN).forEach(k => { MAPS[k] = MAPS_BUILTIN[k]; });
  Object.keys(MAPS).forEach(k => { if(!MAPS_BUILTIN[k]) delete MAPS[k]; });
  Object.keys(ZONES_BUILTIN).forEach(k => { ZONES[k].length = 0; ZONES_BUILTIN[k].forEach(z => ZONES[k].push(JSON.parse(JSON.stringify(z)))); });
  Object.keys(layouts || {}).forEach(loc => {
    const L = layouts[loc];
    if(!L || !L.layout || !Array.isArray(L.layout.items) || String(L.at || '') < MAP_SHEET_AFTER) return;
    const zones = L.layout.items.filter(i => i.t === 'zone' && i.code);
    if(!zones.length) return;
    // zone details edited in Stock1981 (1 Nov 2026) travel inside the zone items
    if(L.layout.zonesDefined){
      if(!ZONES[loc]) ZONES[loc] = [];
      zones.forEach(i => {
        let z = ZONES[loc].find(q => q.c === i.code);
        if(!z){ z = { c: i.code }; ZONES[loc].push(z); }
        z.g = i.g || ''; z.k = i.k || ''; z.s = i.s || ''; if(i.sale) z.x = 1; else delete z.x; if(i.box) z.b = 1; else delete z.b;
      });
    }
    const deco = L.layout.items.filter(i => i.t !== 'zone').map(i => {
      const txt = esc(i.text || ''), cx = i.x + i.w / 2, cy = i.y + i.h / 2;
      if(i.t === 'line') return `<line x1="${i.x}" y1="${i.y}" x2="${i.x + i.w}" y2="${i.y + i.h}" stroke="#8a7d6c" stroke-width="1.5" stroke-dasharray="6 4"/>`;
      return i.t === 'box' ? `<rect x="${i.x}" y="${i.y}" width="${i.w}" height="${i.h}" rx="3" fill="none" stroke="#8a7d6c" stroke-dasharray="5 4"/><text class="map-deco-text strong" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central">${txt}</text>`
        : `<text class="map-deco-text strong" x="${i.x + 2}" y="${i.y + i.h * 0.75}">${txt}</text>`;
    }).join(' ');
    MAPS[loc] = { vb: L.layout.viewBox, deco, z: zones.map(i => [i.code, i.x, i.y, i.w, i.h]), sheet: { by: L.by, at: L.at, version: L.version } };
  });
}

let TR = lsj('s1981_transit', null), trLoading = false, trErr = '';
async function loadTransit(){

  trLoading = false; render();
}
function trHours(iso){ const t = new Date(iso).getTime(); return isNaN(t) ? null : (Date.now() - t) / 36e5; }
function trAge(h){ return h == null ? '' : h < 1 ? 'il y a moins d’1 h' : h < 48 ? 'depuis ' + Math.round(h) + ' h' : 'depuis ' + Math.round(h / 24) + ' j'; }
function trGroups(lines, timeKey){
  const g = {};
  lines.forEach(l => { const k = l.grp || l.id; (g[k] = g[k] || { k, from: l.from, to: l.to, carrier: l.carrier, boxes: l.boxes, by: l.sentBy || l.by, t: l[timeKey] || l.ts, lines: [] }).lines.push(l); });
  return Object.values(g).map(x => Object.assign(x, { h: trHours(x.t) })).sort((a, b) => (b.h || 0) - (a.h || 0));
}
function transitHTML(){
  let h = '';
  if(trErr) h += `<div class="notice">${esc(trErr)}<button data-act="trreload">Réessayer</button></div>`;
  if(!TR) return h + `<p class="empty">${trLoading ? 'Chargement…' : 'Rien pour l’instant.'}</p>`;
  const sent = trGroups(TR.transit, 'sentTs'), reqs = trGroups(TR.requested, 'ts');
  const late = sent.filter(x => x.h != null && x.h > 24).length;
  h += `<div class="sect">En route · ${sent.length} envoi(s)${late ? ` · <span style="color:var(--bad)">${late} depuis plus de 24 h</span>` : ''}</div>`;
  h += sent.length ? sent.map(x => {

      <div class="trmeta">${x.carrier ? 'Porté par <b>' + esc(x.carrier) + '</b> · ' : ''}${x.boxes ? x.boxes + ' colis · ' : ''}<span class="${red ? 'bad' : ''}">${esc(trAge(x.h))}</span>${x.by ? ' · envoyé par ' + esc(x.by) : ''}</div>
      <div class="list">${x.lines.map(l => `<div class="row" style="cursor:default">${thumb(l.bc, l.name)}<div class="nm"><strong>${esc(l.name || l.bc)}</strong><small class="num">${esc(l.bc)}</small></div><div class="qty num">${fmt(l.qty)}</div></div>`).join('')}</div></div>`;
  }).join('') : '<p class="empty" style="padding:12px">Rien sur la route.</p>';
  h += `<div class="sect">Demandes à préparer · ${reqs.length}</div>`;
  h += reqs.length ? reqs.map(x => `<div class="trcard"><div class="trhead"><b>Pour ${esc(locName(x.to))}</b><span class="num">${x.lines.length} produit(s)</span></div>

      <div class="list">${x.lines.map(l => `<div class="row" style="cursor:default">${thumb(l.bc, l.name)}<div class="nm"><strong>${esc(l.name || l.bc)}</strong></div><div class="qty num">${fmt(l.qty)}</div></div>`).join('')}</div></div>`).join('') : '<p class="empty" style="padding:12px">Aucune demande en attente.</p>';
  h += '<p class="sub" style="color:var(--muted);font-size:13px;margin-top:12px">Pour préparer, envoyer ou recevoir : Scanner → 🔄 Transferts.</p>';
  return h;
}

let S = null;
function openSheet(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').hidden = false; $('#scrim').hidden = false; }
function closeSheet(){ $('#sheet').hidden = true; $('#scrim').hidden = true; S = null; }

// ══════════════════════════════════════════════════════════════════
//  📤 SORTIES (3 Nov 2026) — what left a store: sales (getSorties, read from
//  the sales Sheet) + transfers out (getMovements). Shown three ways:
//   • a 🛒 badge on each zone of the store (since that zone's last count),
//   • a « Sorties » tab in the zone, sorted by number of units,
//   • the « 📤 Sorties » screen: one day / 7 days, grouped by zone, with the
//     « À remonter de l'entrepôt » list — proposed, then confirmed by 1981,
//     which becomes a transfer request (🚚 En route), dated that day.
//  A sale has no shelf: it is shown on every zone that holds the product
//  (« aussi en … »).
// ══════════════════════════════════════════════════════════════════
let SOR = lsj('s1981_sorties', {});   // loc -> { sales:[[bk,bc,qty,t,name,emp]], noCode:[[name,qty,t,emp]], moves:[...], at }
let SOR_BUSY = {}, SOR_ERR = '';
let SOV = { loc: 'Store 1', per: 'today', pick: {}, qty: {} };
async function loadSorties(loc, force){
  if(!URL_ || !KEY || SOR_BUSY[loc]) return;
  const c = SOR[loc];
  if(!force && c && Date.now() - c.at < 5 * 60 * 1000) return;
  SOR_BUSY[loc] = true; SOR_ERR = '';
  try {
    const [d, m] = await Promise.all([api({ action:'getSorties', location: loc, days: 14 }), api({ action:'getMovements', days: 14 }).catch(() => null)]);
    if(!d || !d.success || !Array.isArray(d.sales)) throw new Error(d && d.error ? d.error : 'old');
    SOR[loc] = { sales: d.sales, noCode: d.noCode || [], moves: (m && m.moves) || [], at: Date.now() };
    ls('s1981_sorties', JSON.stringify(SOR));
  } catch(e){ SOR_ERR = e.message === 'old' ? 'Collez « LATEST - Code GS » et redéployez pour voir les sorties.' : (/fetch/i.test(e.message) ? 'Pas de connexion : dernières sorties enregistrées sur ce téléphone.' : e.message); }
  SOR_BUSY[loc] = false;
  if(['store', 'zone', 'sorties'].includes(VIEW.screen)) render();
}
function sorDayStart(off){ const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime() - (off || 0) * 864e5; }
function sorPeriod(per){
  if(per === 'yesterday') return [sorDayStart(1), sorDayStart(0)];
  if(per === 'week') return [sorDayStart(6), Infinity];
  return [sorDayStart(0), Infinity];
}
// zones of `loc` holding the product (stock now, else last counts)
function sorZonesOf(loc, bk){
  let z = [...new Set(rowsAt(loc).filter(r => bkey(r[2]) === bk && r[4] > 0 && r[1] !== UNPLACED).map(r => r[1]))];
  if(!z.length) z = [...new Set((DATA ? DATA.spots : []).filter(r => r[0] === loc && bkey(r[3]) === bk).map(r => r[1]))];
  if(!z.length) z = [...new Set(rowsAt(loc).filter(r => bkey(r[2]) === bk && r[1] !== UNPLACED).map(r => r[1]))];
  return z;
}
function sorWarehouse(bk){ return rowsAt('Warehouse').filter(r => bkey(r[2]) === bk && r[4] > 0).reduce((a, r) => a + r[4], 0); }
function sorZoneCountAt(loc, zone){
  const ds = spotsAt(loc, zone).map(r => r[6]).filter(Boolean).sort();
  if(!ds.length) return null;
  const t = new Date(ds[ds.length - 1]).getTime();
  if(isNaN(t)) return null;
  return /^\d{4}-\d{2}-\d{2}$/.test(String(ds[ds.length - 1])) ? new Date(ds[ds.length - 1] + 'T00:00:00').getTime() : t;
}
function sorMoveT(m){ const t = new Date(m.at).getTime(); return isNaN(t) ? 0 : t; }
// Per product of one zone, between from and to: { bk, bc, name, sold, moved, others }
function sorZoneOut(loc, zone, from, to){
  const c = SOR[loc]; if(!c) return [];
  const out = {};
  const get = (bk, bc, name) => out[bk] || (out[bk] = { bk, bc, name: name || productName(bc) || bc, sold: 0, moved: 0, others: [] });
  c.sales.forEach(([bk, bc, q, t, nm]) => {
    if(t < from || t >= to) return;
    const zs = sorZonesOf(loc, bk);
    if(!zs.includes(zone)) return;
    const o = get(bk, bc, nm); o.sold += q; o.others = zs.filter(x => x !== zone);
  });
  (c.moves || []).forEach(m => {
    const t = sorMoveT(m);
    if(m.fromLoc !== loc || m.fromZone !== zone || t < from || t >= to) return;
    if(m.toLoc === loc && m.toZone === zone) return;
    get(bkey(m.bc), m.bc, m.name).moved += m.qty;
  });
  return Object.values(out).filter(o => o.sold || o.moved).sort((a, b) => (b.sold + b.moved) - (a.sold + a.moved));
}
// 🛒 badge of a zone: units out since its last count (7 days if never counted)
function sorZoneBadge(loc, zone){
  if(!SOR[loc]) return 0;
  const from = sorZoneCountAt(loc, zone) || sorDayStart(6);
  return sorZoneOut(loc, zone, from, Infinity).reduce((a, o) => a + o.sold + o.moved, 0);
}
function sorItemHTML(loc, o, here){
  const w = sorWarehouse(o.bk), left = rowsAt(loc, here).filter(r => bkey(r[2]) === o.bk).reduce((a, r) => a + r[4], 0);
  return `<button class="row" data-bc="${esc(o.bc)}">${thumb(o.bc, o.name)}<div class="nm"><strong>${esc(o.name || 'Sans nom')}</strong>
    <small>${o.sold ? '🛒 ' + fmt(o.sold) + ' vendu' + (o.sold > 1 ? 's' : '') : ''}${o.sold && o.moved ? ' · ' : ''}${o.moved ? '🔄 ' + fmt(o.moved) + ' transféré' + (o.moved > 1 ? 's' : '') : ''}${o.others && o.others.length ? ' · aussi en ' + esc(o.others.join(', ')) : ''}</small>
    ${o.sold ? `<small style="font-weight:700;color:${w ? 'var(--ok)' : 'var(--warn)'}">${w ? '📦 ' + fmt(w) + ' à l’entrepôt → à remonter' : '⚠ rien à l’entrepôt'}${here ? ' · reste ici ' + fmt(left) : ''}</small>` : (here ? `<small>reste ici ${fmt(left)}</small>` : '')}</div>
    <div class="qty num" style="color:var(--bad)">−${fmt(o.sold + o.moved)}</div></button>`;
}
function zoneSortiesHTML(loc, zone){
  if(!SOR[loc]){ loadSorties(loc); return `<p class="empty">${SOR_ERR ? esc(SOR_ERR) : 'Chargement des sorties…'}</p>`; }
  const per = VIEW.zper || 'count', cAt = sorZoneCountAt(loc, zone);
  const from = per === 'today' ? sorDayStart(0) : per === 'week' ? sorDayStart(6) : (cAt || sorDayStart(6));
  const zk = VIEW.zkind || 'sold';
  const both = sorZoneOut(loc, zone, from, Infinity);
  const list = both.map(o => zk === 'sold' ? Object.assign({}, o, { moved: 0 }) : Object.assign({}, o, { sold: 0 })).filter(o => o.sold + o.moved > 0);
  const n = list.reduce((a, o) => a + o.sold + o.moved, 0);
  let h = `<div class="chips" style="margin-bottom:10px">${[['count', cAt ? 'Depuis le comptage' : '7 derniers jours'], ['today', 'Aujourd’hui'], ['week', '7 jours']].map(([k, l]) => `<button data-zper="${k}" aria-pressed="${per === k}">${l}</button>`).join('')}</div>`;
  h += `<p class="sub" style="color:var(--muted);margin:0 0 10px;font-size:13px">${per === 'count' && cAt ? 'Depuis le comptage du ' + esc(new Date(cAt).toLocaleDateString('fr-FR', { day:'numeric', month:'short' })) + ' · ' : ''}${fmt(n)} article(s) sorti(s), ${list.length} produit(s), du plus vendu au moins vendu.</p>`;
  h = `<div class="seg" role="group" aria-label="Sorties" style="margin-bottom:10px"><button data-zkind="sold" aria-pressed="${zk === 'sold'}">🛒 Vendus (${fmt(both.reduce((a, o) => a + o.sold, 0))})</button><button data-zkind="moved" aria-pressed="${zk === 'moved'}">🔄 Transférés (${fmt(both.reduce((a, o) => a + o.moved, 0))})</button></div>` + h;
  h += list.length ? '<div class="list">' + list.map(o => sorItemHTML(loc, o, zone)).join('') + '</div>' : '<p class="empty">' + (zk === 'sold' ? 'Rien de vendu' : 'Rien de transféré') + ' depuis cette zone sur cette période.</p>';
  return h;
}
function sortiesHTML(){
  const loc = SOV.loc, c = SOR[loc];
  let h = `<div class="chips" style="margin-bottom:8px">${LOCS.filter(L => L.id !== 'Warehouse').map(L => `<button data-sorloc="${esc(L.id)}" aria-pressed="${L.id === loc}">${esc(L.name)}</button>`).join('')}</div>`;
  h += `<div class="chips" style="margin-bottom:12px">${[['today', 'Aujourd’hui'], ['yesterday', 'Hier'], ['week', '7 jours']].map(([k, l]) => `<button data-sorper="${k}" aria-pressed="${SOV.per === k}">${l}</button>`).join('')}<button data-act="sorreload">↻</button></div>`;
  if(SOR_ERR) h += `<div class="notice">${esc(SOR_ERR)}</div>`;
  if(!c){ loadSorties(loc); return h + '<p class="empty">Chargement des sorties…</p>'; }
  const [from, to] = sorPeriod(SOV.per);
  // all products out of the store in the period
  const byP = {};
  const P = (bk, bc, nm) => byP[bk] || (byP[bk] = { bk, bc, name: nm || productName(bc) || bc, sold: 0, moved: 0 });
  c.sales.forEach(([bk, bc, q, t, nm]) => { if(t >= from && t < to) P(bk, bc, nm).sold += q; });
  (c.moves || []).forEach(m => { const t = sorMoveT(m); if(m.fromLoc === loc && m.toLoc !== loc && t >= from && t < to) P(bkey(m.bc), m.bc, m.name).moved += m.qty; });
  const kind = SOV.kind || 'sold';
  const both = Object.values(byP).filter(o => o.sold + o.moved > 0);
  const nSold = both.reduce((a, o) => a + o.sold, 0), nMoved = both.reduce((a, o) => a + o.moved, 0);
  h += `<div class="seg" role="group" aria-label="Sorties" style="margin-bottom:12px"><button data-sorkind="sold" aria-pressed="${kind === 'sold'}">🛒 Vendus (${fmt(nSold)})</button><button data-sorkind="moved" aria-pressed="${kind === 'moved'}">🔄 Transférés (${fmt(nMoved)})</button></div>`;
  const all = both.map(o => kind === 'sold' ? Object.assign({}, o, { moved: 0 }) : Object.assign({}, o, { sold: 0 })).filter(o => o.sold + o.moved > 0);
  const nc = kind === 'sold' ? c.noCode.filter(r => r[2] >= from && r[2] < to) : [];
  const units = all.reduce((a, o) => a + o.sold + o.moved, 0) + nc.reduce((a, r) => a + r[1], 0);
  const val = all.reduce((a, o) => a + (priceOf(o.bc) || 0) * o.sold, 0);
  h += `<div class="stats"><div class="stat"><b class="num">${fmt(units)}</b><span>articles sortis</span></div><div class="stat"><b class="num">${fmt(all.length)}</b><span>produits</span></div>${val ? `<div class="stat"><b class="num">${fmt(val)} F</b><span>ventes (prix fiche)</span></div>` : ''}</div>`;
  // « À remonter de l'entrepôt »
  const refill = all.filter(o => o.sold > 0 && sorWarehouse(o.bk) > 0).sort((a, b) => b.sold - a.sold);
  if(loc !== 'Warehouse' && kind === 'sold'){
    h += `<div class="sect">📦 À remonter de l’entrepôt (${refill.length})</div>`;
    if(refill.length){
      h += '<div class="list">' + refill.map(o => {
        const w = sorWarehouse(o.bk), on = SOV.pick[o.bk] !== false, q = Math.min(w, SOV.qty[o.bk] != null ? SOV.qty[o.bk] : o.sold);
        const shf = shelfOf(loc, o.bc);
        return `<div class="citem"><input type="checkbox" data-sorpick="${esc(o.bk)}" ${on ? 'checked' : ''} style="width:22px;height:22px">${thumb(o.bc, o.name)}<div class="nm"><strong>${esc(o.name)}</strong>${shf ? `<small style="font-weight:700;color:var(--ok)">→ ira en ${esc(shf)}</small>` : ''}<small>🛒 ${fmt(o.sold)} vendu(s) · 📦 ${fmt(w)} à l’entrepôt</small></div>
          <button data-sorq="${esc(o.bk)}" data-d="-1" aria-label="Moins">−</button><span class="c num">${q}</span><button data-sorq="${esc(o.bk)}" data-d="1" aria-label="Plus">+</button></div>`;
      }).join('') + '</div>';
      const sel = refill.filter(o => SOV.pick[o.bk] !== false);
      h += `<button class="go" data-act="sorpropose" style="margin:10px 0 4px" ${sel.length ? '' : 'disabled'}>Proposer la demande : ${sel.length} produit(s), ${fmt(sel.reduce((a, o) => a + Math.min(sorWarehouse(o.bk), SOV.qty[o.bk] != null ? SOV.qty[o.bk] : o.sold), 0))} article(s)</button>`;
    } else h += '<p class="empty" style="padding:10px">Rien à remonter : les produits vendus n’ont pas de stock compté à l’entrepôt.</p>';
  }
  // grouped by zone
  const zones = {};
  all.forEach(o => {
    const zs = sorZonesOf(loc, o.bk);
    const z = zs[0] || 'Sans zone';
    (zones[z] = zones[z] || []).push(Object.assign({}, o, { others: zs.slice(1) }));
  });
  const zk = Object.keys(zones).sort((a, b) => zones[b].reduce((s, o) => s + o.sold + o.moved, 0) - zones[a].reduce((s, o) => s + o.sold + o.moved, 0));
  h += `<div class="sect">${kind === 'sold' ? 'Vendus par zone, du plus vendu au moins vendu' : 'Transférés par zone (sortis vers un autre magasin ou l’entrepôt)'}</div>`;
  h += zk.length ? zk.map(z => {
    const l = zones[z].sort((a, b) => (b.sold + b.moved) - (a.sold + a.moved));
    return `<div class="sect" style="margin-top:14px">${esc(z)} · ${fmt(l.reduce((s, o) => s + o.sold + o.moved, 0))} article(s)</div><div class="list">` + l.map(o => sorItemHTML(loc, o, z === 'Sans zone' ? '' : z)).join('') + '</div>';
  }).join('') : '<p class="empty">' + (kind === 'sold' ? 'Aucune vente' : 'Aucun transfert') + ' sur cette période.</p>';
  if(nc.length) h += `<div class="sect" style="margin-top:14px">Sans code (tapé à la main) · ${fmt(nc.reduce((a, r) => a + r[1], 0))} article(s)</div><div class="list">` + nc.map(r => `<div class="citem"><div class="nm"><strong>${esc(r[0] || 'Sans nom')}</strong><small>${new Date(r[2]).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' })}${r[3] ? ' · ' + esc(r[3]) : ''} — impossible de savoir de quelle zone</small></div><span class="c num">${fmt(r[1])}</span></div>`).join('') + '</div>';
  return h;
}
function bindSorties(){
  document.querySelectorAll('[data-sorloc]').forEach(b => b.onclick = () => { SOV.loc = b.dataset.sorloc; SOV.pick = {}; SOV.qty = {}; render(); loadSorties(SOV.loc); });
  document.querySelectorAll('[data-sorper]').forEach(b => b.onclick = () => { SOV.per = b.dataset.sorper; SOV.pick = {}; SOV.qty = {}; render(); });
  document.querySelectorAll('[data-sorkind]').forEach(b => b.onclick = () => { SOV.kind = b.dataset.sorkind; render(); });
  const rl = document.querySelector('[data-act="sorreload"]'); if(rl) rl.onclick = () => loadSorties(SOV.loc, true);
  document.querySelectorAll('[data-sorpick]').forEach(x => x.onchange = () => { SOV.pick[x.dataset.sorpick] = x.checked; render(); });
  document.querySelectorAll('[data-sorq]').forEach(b => b.onclick = () => {
    const bk = b.dataset.sorq, w = sorWarehouse(bk);
    const c = SOR[SOV.loc], [from, to] = sorPeriod(SOV.per);
    const sold = c.sales.filter(r => r[0] === bk && r[3] >= from && r[3] < to).reduce((a, r) => a + r[2], 0);
    const cur = SOV.qty[bk] != null ? SOV.qty[bk] : sold;
    SOV.qty[bk] = Math.max(1, Math.min(w, cur + Number(b.dataset.d))); render();
  });
  document.querySelectorAll('.row[data-bc]').forEach(b => b.onclick = () => openProduct(SOV.loc, sorZonesOf(SOV.loc, bkey(b.dataset.bc))[0] || UNPLACED, b.dataset.bc));
  const pr = document.querySelector('[data-act="sorpropose"]'); if(pr) pr.onclick = sorPropose;
}
function sorPropose(){
  const loc = SOV.loc, c = SOR[loc], [from, to] = sorPeriod(SOV.per);
  const sold = {}; c.sales.forEach(([bk, bc, q, t, nm]) => { if(t >= from && t < to){ (sold[bk] = sold[bk] || { bk, bc, name: nm, q: 0 }).q += q; } });
  const lines = Object.values(sold).filter(o => o.q > 0 && sorWarehouse(o.bk) > 0 && SOV.pick[o.bk] !== false)
    .map(o => ({ barcode: o.bc, name: productName(o.bc) || o.name, qty: Math.min(sorWarehouse(o.bk), SOV.qty[o.bk] != null ? SOV.qty[o.bk] : o.q) })).filter(l => l.qty > 0);
  if(!lines.length) return;
  const today = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
  openSheet(`<h3>Demande de transfert</h3><div class="sub">Entrepôt → ${esc(locName(loc))} · datée d’aujourd’hui (${esc(today)})</div>
    <div class="list" style="max-height:46vh;overflow:auto">${lines.map(l => `<div class="citem">${thumb(l.barcode, l.name)}<div class="nm"><strong>${esc(l.name)}</strong><small class="num">${esc(l.barcode)}</small></div><span class="c num">${fmt(l.qty)}</span></div>`).join('')}</div>
    <button class="go" id="sorok">Confirmer : ${fmt(lines.reduce((a, l) => a + l.qty, 0))} article(s)</button><button class="ghost" id="sorno">Annuler</button>`);
  $('#sorno').onclick = closeSheet;
  $('#sorok').onclick = async () => {
    const b = $('#sorok'); b.disabled = true; b.textContent = 'Envoi…';
    try {
      const d = await post({ action:'stock1981RequestTransfer', by: user.name, userHash: user.hash, from: 'Warehouse', to: loc, lines });
      if(!d || !d.success) throw new Error(d && d.error ? d.error : 'Collez « LATEST - Code GS » et redéployez.');
      closeSheet(); toast('📨 Demande ' + d.id + ' envoyée à l’entrepôt (' + d.lines + ' produit(s))');
      SOV.pick = {}; SOV.qty = {}; render(); try { loadTransit(); } catch(e){}
    } catch(e){ b.disabled = false; b.textContent = 'Réessayer'; toast(/fetch/i.test(e.message) ? 'Pas de connexion : réessayez.' : e.message); }
  };
}
function openProduct(loc, zone, bc){
  const here = rowsAt(loc, zone).find(r => bkey(r[2]) === bkey(bc));
  S = { loc, zone, bc, name: (here && here[3]) || productName(bc), cur: here ? here[4] : 0, mode:'out', qty:1, reason:null, note:'' };
  drawProduct();
}
function drawProduct(){
  if(S.mode === 'move') return drawMove();
  const all = (DATA ? DATA.zones : []).filter(r => bkey(r[2]) === bkey(S.bc) && r[4] !== 0);
  const p = priceOf(S.bc);
  const after = S.mode === 'set' ? S.qty : S.mode === 'out' ? S.cur - S.qty : S.cur + S.qty;
  const reasons = REASONS[S.mode];
  if(!reasons.includes(S.reason)) S.reason = reasons.length === 1 ? reasons[0] : null;
  const pimg = imgOf(S.bc);
  openSheet(`${pimg ? `<div class="psheet-img"><img src="${esc(pimg)}" alt="" onerror="this.parentNode.remove()"></div>` : ''}<h3>${esc(S.name || 'Produit sans nom')}</h3>
    <div class="sub num">${esc(S.bc)}${p ? ' · ' + fmt(p) + ' F' : ''}</div>
    <div class="where">${all.length ? all.map(r => `<div class="${r[0] === S.loc && r[1] === S.zone ? 'here' : ''}"><span>${esc(locName(r[0]))} · ${esc(r[1])}</span><b class="num">${fmt(r[4])}</b></div>`).join('') : '<div><span>Nulle part en stock</span><b>0</b></div>'}</div>
    <div class="seg" role="group" aria-label="Type de changement">
      <button data-mode="out" aria-pressed="${S.mode === 'out'}">Retirer</button>

function packOf(bc){ const k = bkey(bc), P = (DATA && DATA.packs) || {}; return Object.values(P).find(p => bkey(p.barcode) === k) || null; }
function packScanned(code){

  if(r) return openPack(r[0], r[1], bc, r[3]);

function openPack(loc, zone, bc, name){

  if(S.edit && !meIsAdmin()){ closeSheet(); return toast('Ce pack n’est pas encore décrit : demandez à un administrateur.'); }

function queueWork(ops, labels, msg){
  if(!user){ lock(); return; }

    op.opId = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + i;
    applyLocal(op);
    QUEUE.push({ op, by: user.name, hash: user.hash });
  });
  if(labels.length) QUEUE.push({ kind:'labels', labels, by: user.name, hash: user.hash });
  ls('s1981_queue', JSON.stringify(QUEUE));
  ls('s1981_cache', JSON.stringify(DATA));
  closeSheet(); render();
  toast(online ? msg : 'Enregistré sur le téléphone, envoi au retour de la connexion');
  flushQueue();
}

async function hashCode(name, code){
  const data = new TextEncoder().encode('b1981|' + String(name).trim().toLowerCase() + '|' + code);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

  const users = activeUsers();
  if(!users.length){
    box.innerHTML = `<div class="logo">Stock<b>1981</b></div><p>Aucun code trouvé. Créez d'abord votre code dans l'app Comptage, puis revenez.</p><button class="go" id="lretry">Réessayer</button><div class="lockerr">${esc(msg)}</div>`;
    $('#lretry').onclick = async () => { await refreshUsers(); drawLock(activeUsers().length ? '' : 'Toujours aucun code.'); };
    return;
  }
  if(!pickName || !users.find(u => u.name === pickName)) pickName = (users.find(u => u.name === ls('inv_count_last_user')) || users[0]).name;
  box.innerHTML = `<div class="logo">Stock<b>1981</b></div><p>Qui êtes-vous ?</p>
    <div class="users">${users.map(u => `<button data-u="${esc(u.name)}" aria-pressed="${u.name === pickName}">${esc(u.name)}</button>`).join('')}</div>
    <div class="dots">${[0,1,2,3].map(i => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join('')}</div>
    <div class="lockerr">${esc(msg)}</div>
    <div class="pad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k => k ? `<button data-k="${k}" aria-label="${k === '⌫' ? 'Effacer' : k}">${k}</button>` : '<span></span>').join('')}</div>`;
  box.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { pickName = b.dataset.u; pin = ''; drawLock(''); });
  box.querySelectorAll('[data-k]').forEach(b => b.onclick = () => key(b.dataset.k));
}
async function key(k){
  if(k === '⌫'){ pin = pin.slice(0, -1); return drawLock(''); }
  if(pin.length >= 4) return;
  pin += k; drawLock('');
  if(pin.length < 4) return;
  const u = activeUsers().find(x => x.name === pickName);
  const h = await hashCode(pickName, pin); pin = '';
  if(!u || u.hash !== h) return drawLock('Code incorrect.');
  signIn(u);
}
document.addEventListener('keydown', e => { if(!$('#lock').hidden && /^[0-9]$/.test(e.key)) key(e.key); else if(!$('#lock').hidden && e.key === 'Backspace') key('⌫'); });
function signIn(u){
  user = { name: u.name, role: u.role, hash: u.hash };
  lastActive = Date.now();
  ls('s1981_auth', JSON.stringify({ name: u.name, at: lastActive }));
  ls('inv_count_last_user', u.name);
  $('#lock').hidden = true;
  render();
  if(!DATA || !DATA.generatedAt) loadData();
  flushQueue();
  setTimeout(checkImport, 300);
}
['pointerdown', 'keydown', 'scroll'].forEach(ev => window.addEventListener(ev, () => {
  if(!user) return;
  lastActive = Date.now();
}, { passive: true }));
setInterval(() => {
  if(user && Date.now() - lastActive > IDLE_MS) lock();
  else if(user) ls('s1981_auth', JSON.stringify({ name: user.name, at: lastActive }));
}, 20000);

// ── start ───────────────────────────────────────────────
(async function start(){
  if(history.state && history.state.screen) VIEW = history.state; else history.replaceState(VIEW, '');
  const a = lsj('s1981_auth', null);
  const u = a && activeUsers().find(x => x.name === a.name);
  if(u && Date.now() - a.at < IDLE_MS){ user = { name: u.name, role: u.role, hash: u.hash }; lastActive = a.at; }
  else lock();
  render();
  if(URL_ && KEY){ refreshUsers(); loadTraces(); loadMaps(); loadTransit(); await loadData(); flushQueue(); checkImport(); }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
