<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1022">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock1981">
<title>Stock1981</title>
<link rel="manifest" href="stock1981.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Stock1981 — Beauty Empire. Layout: one column, app bar on top, screens slide in place (home → store → zone), product sheet from the bottom. */
:root{
  --bg:#faf6f8; --surface:#ffffff; --sunk:#f2eaef; --ink:#2a1022; --muted:#7c6573; --line:#eadde5;
  --brand:#c2186b; --brand-ink:#ffffff; --brand-soft:#fbe1ee; --plum:#2a1022;
  --ok:#17784a; --ok-soft:#dcf2e6; --warn:#b25a07; --warn-soft:#fdebd6; --bad:#c3262f; --bad-soft:#fbdfe0;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(42,16,34,.06),0 6px 18px rgba(42,16,34,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#150b11; --surface:#21131b; --sunk:#1a0f16; --ink:#f7ecf2; --muted:#b39aa8; --line:#3a2530;
  --brand:#f0559c; --brand-ink:#1b0812; --brand-soft:#4a1a32; --plum:#0f070c;
  --ok:#5fd39a; --ok-soft:#173a29; --warn:#f3a65a; --warn-soft:#432a10; --bad:#ff7d84; --bad-soft:#45191c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* App bar */
.bar{position:sticky;top:0;z-index:20;background:var(--plum);color:#fbeaf3;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.bar .back{border:0;background:rgba(255,255,255,.1);width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer;display:grid;place-items:center;color:#fbeaf3}
.bar h1{flex:1;min-width:0;margin:0;font:800 20px var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font:500 12px var(--body);opacity:.7;letter-spacing:0}
.bar h1 b{color:#ff8cc0;font-weight:800}
.who{border:0;background:rgba(255,255,255,.1);color:#fbeaf3;border-radius:99px;padding:6px 12px 6px 8px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
.who i{width:8px;height:8px;border-radius:50%;background:#7be3a8;display:inline-block}
.who i.off{background:#f3a65a}

main{max-width:880px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.notice{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;margin-bottom:14px}
.notice button{margin-left:auto;border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.notice.ok{background:var(--ok-soft);color:var(--ok)}

/* Search */
.search{position:relative;margin-bottom:16px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px 13px 42px;font:16px var(--body);color:var(--ink)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.results{display:flex;flex-direction:column;gap:6px;margin:-6px 0 18px}

/* Store tiles */
.tiles{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border:0;padding:0;border-radius:20px;overflow:hidden;cursor:pointer;text-align:left;aspect-ratio:16/10;background:var(--plum);box-shadow:var(--shadow);max-width:100%}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,6,15,0) 30%,rgba(20,6,15,.85))}
.tile .pat{position:absolute;inset:0;background:repeating-linear-gradient(135deg,#3a1630 0 18px,#2a1022 18px 36px)}
.tile .t{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff}
.tile .t h2{margin:0;font:800 26px/1 var(--display);letter-spacing:-.01em}
.tile .t p{margin:6px 0 0;font-size:13px;opacity:.9}
.tile .badge{position:absolute;top:12px;right:12px;z-index:1;background:var(--brand);color:#fff;font-weight:700;font-size:12px;padding:4px 10px;border-radius:99px}
.sect{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}

/* Zone grid */
.zgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.zcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-width:0}
.zcard .ph{width:100%;aspect-ratio:4/3;background:var(--sunk) center/cover no-repeat;position:relative}
.zcard .ph span{position:absolute;left:8px;top:8px;background:rgba(20,6,15,.78);color:#fff;font:800 15px var(--display);padding:3px 9px;border-radius:9px}
.zcard .ph .cl{left:auto;right:8px;background:var(--brand);font:700 11px var(--body);padding:4px 8px}
.zcard .b{padding:9px 10px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.zcard .b strong{font-size:14px}
.zcard .b small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zcard.isempty .b strong{color:var(--muted);font-weight:500}
.zcard.unplaced{border:1.5px dashed var(--warn)}
.zcard.unplaced .ph{background:var(--warn-soft);display:grid;place-items:center;color:var(--warn);font-weight:700}

/* Zone view */
.hero{border-radius:20px;overflow:hidden;background:var(--sunk);aspect-ratio:16/9;max-height:300px;width:100%;position:relative}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .nophoto{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600}
.zhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin:14px 0 4px}
.zhead h2{margin:0;font:800 28px var(--display)}
.zhead p{margin:0;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:92px}
.stat b{display:block;font:800 20px var(--display)}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;margin:16px 0 12px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Rows */
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;width:100%;min-width:0}
.row .nm{flex:1;min-width:0}
.row .nm strong{display:block;font-weight:600;overflow-wrap:anywhere}
.row .nm small{color:var(--muted);font-size:12px}
.qty{font:800 20px var(--display);min-width:44px;text-align:right}
.qty.zero{color:var(--muted)}
.qty.neg{color:var(--bad)}
.addbtn{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:12px;font-weight:600;color:var(--brand);cursor:pointer;margin-top:4px}
.shelf{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.shelf h4{margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.shelf h4 span{color:var(--muted);font-weight:500;font-size:12px}
.shelf ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.shelf li{display:flex;gap:8px;font-size:14px}
.shelf li span{flex:1;min-width:0;overflow-wrap:anywhere}
.shelf li b{font-variant-numeric:tabular-nums}
.shelf .none{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:26px 8px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(20,6,15,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0;font:800 22px/1.15 var(--display);overflow-wrap:anywhere}
.sheet .sub{color:var(--muted);font-size:13px;margin-top:4px}
.where{margin:14px 0;display:flex;flex-direction:column;gap:4px}
.where div{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:10px;background:var(--sunk);font-size:14px}
.where div.here{background:var(--brand-soft);font-weight:700}
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;margin:8px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px}
.stepper button{width:54px;height:54px;border-radius:16px;border:1px solid var(--line);background:var(--sunk);font-size:26px;font-weight:700;cursor:pointer}
.stepper input{width:110px;text-align:center;font:800 36px var(--display);border:0;background:transparent;color:var(--ink)}
.preview{text-align:center;color:var(--muted);font-size:14px;margin:-6px 0 12px}
.preview b{color:var(--ink)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 5px}
select,input.t,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:16px var(--body)}
textarea{min-height:60px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.loss[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.go{width:100%;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;border-radius:14px;padding:15px;margin-top:16px;cursor:pointer}
.go:disabled{opacity:.45;cursor:default}
.ghost{width:100%;border:0;background:transparent;color:var(--muted);font-weight:600;padding:12px;cursor:pointer}
.err{color:var(--bad);font-size:14px;font-weight:600;margin-top:8px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;font-size:14px;line-height:1.35;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--brand)}
select.t{appearance:auto}

/* Lock */
.lock{position:fixed;inset:0;z-index:60;background:var(--plum);color:#fbeaf3;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.lockbox{width:100%;max-width:340px;text-align:center}
.lockbox .logo{font:800 34px var(--display);letter-spacing:-.02em}
.lockbox .logo b{color:#ff8cc0}
.lockbox p{opacity:.75;margin:6px 0 18px}
.users{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.users button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fbeaf3;border-radius:99px;padding:8px 16px;font-weight:600;cursor:pointer}
.users button[aria-pressed="true"]{background:#fbeaf3;color:var(--plum)}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0 10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fbeaf3}
.dots i.f{background:#fbeaf3}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pad button{height:62px;border-radius:18px;border:0;background:rgba(255,255,255,.09);color:#fbeaf3;font:700 24px var(--display);cursor:pointer}
.pad button:active{background:rgba(255,255,255,.2)}
.lockerr{color:#ff9aa1;min-height:20px;font-weight:600}
.lock input{width:100%;margin:6px 0;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;padding:12px;font:15px var(--body)}
.lock .go{background:#ff8cc0;color:var(--plum)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.viewsw{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;margin:0 0 14px;max-width:260px}
.viewsw button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.viewsw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.mapwrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;overflow-x:auto}
.mapwrap svg{display:block;width:100%;min-width:820px;height:auto}
@media (min-width:860px){.mapwrap svg{min-width:0}}
.mz rect{fill:var(--sunk);stroke:var(--line);stroke-width:1.5;rx:5}
.mz.has rect{fill:var(--brand-soft);stroke:var(--brand)}
.mz.sale rect{fill:var(--warn-soft);stroke:var(--warn)}
.mz{cursor:pointer}
.mz:hover rect,.mz:focus rect{stroke-width:3}
.mz text{fill:var(--ink);font:800 15px var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mz text.n{font:700 12px var(--body);fill:var(--muted)}
.mz.has text.n{fill:var(--brand)}
.map-deco-text{font:13px var(--body);fill:var(--muted)}
.map-deco-text.strong{font-weight:700;fill:var(--ink);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 4px 0;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1.5px solid var(--line);background:var(--sunk)}
.legend i.has{background:var(--brand-soft);border-color:var(--brand)}
.legend i.sale{background:var(--warn-soft);border-color:var(--warn)}
.zrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;min-width:0}
.zrow .code{font:800 17px var(--display);min-width:54px}
.zrow .nm{flex:1;min-width:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.zrow .u{font-weight:700;font-variant-numeric:tabular-nums}
.zrow.unplaced{border:1.5px dashed var(--warn)}
.shelfhead{display:flex;align-items:center;gap:8px}
.shelfhead h4{flex:1;margin:0}
.cbtn{border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:13px;border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.cbtn.alt{background:var(--sunk);color:var(--ink)}
.countbar{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:6px 0 10px}
.scanin{display:flex;gap:8px}
.scanin input{flex:1;min-width:0;border:2px solid var(--brand);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px;font:600 18px var(--body)}
.scanin button{border:0;border-radius:14px;padding:0 16px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);font-size:20px}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
.citem{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px}
.citem .nm{flex:1;min-width:0}
.citem .nm strong{display:block;font-weight:600;overflow-wrap:anywhere}
.citem .nm small{color:var(--muted);font-size:12px}
.citem .nm input{width:100%;margin-top:4px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:9px;padding:7px 9px;font:15px var(--body)}
.citem button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:20px;font-weight:700;cursor:pointer}
.citem .c{font:800 22px var(--display);min-width:38px;text-align:center}
.citem.flash{animation:fl .5s}
@keyframes fl{from{background:var(--brand-soft)}}
.cfoot{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:16px}
.cfoot .go{margin:0}
.cam{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover}
.cam .camui{position:absolute;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff}
.cam .camui span{flex:1;font-weight:600}
.cam .frame{position:absolute;left:12%;right:12%;top:35%;height:22%;border:3px solid #ff8cc0;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.setrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow small{color:var(--muted);display:block;overflow-wrap:anywhere}
.xb{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok);margin-top:3px}
.xb.later{background:var(--warn-soft);color:var(--warn)}
.xb.orange,.xb.far{background:var(--warn-soft);color:var(--warn)}
.xb.red,.xb.past{background:var(--bad-soft);color:var(--bad)}
.xopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.xopts button{border:1px solid var(--line);background:var(--sunk);border-radius:14px;padding:12px 8px;font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.xopts button span{font-size:14px;font-weight:700}
.xdisp{font:800 38px var(--display);text-align:center;letter-spacing:.08em;padding:8px;border-radius:14px;background:var(--sunk)}
.xdisp.red,.xdisp.past{color:var(--bad);background:var(--bad-soft)}
.xdisp.orange,.xdisp.far{color:var(--warn);background:var(--warn-soft)}
.xhint{text-align:center;color:var(--muted);font-size:13px;margin:6px 0}
.xwarn{text-align:center;font-weight:700;border-radius:10px;padding:8px;margin:6px 0}
.xwarn.red{background:var(--bad-soft);color:var(--bad)}
.xwarn.orange{background:var(--warn-soft);color:var(--warn)}
.sheet .xpad{margin-top:10px}
.sheet .xpad button{background:var(--sunk);color:var(--ink);height:56px}
.sheet .xpad button[data-k="OK"]{background:var(--brand);color:var(--brand-ink)}
.sheet .xpad button:disabled{opacity:.35}
.recvbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;border:1.5px solid var(--brand);background:var(--brand-soft);color:var(--ink);border-radius:16px;padding:14px;cursor:pointer;text-align:left}
.recvbtn b{font:800 18px var(--display)}
.recvbtn small{display:block;color:var(--muted);font-size:13px}
.recvbtn .ic{font-size:26px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
</style>
</head>
<body>

// ── network ─────────────────────────────────────────────
async function api(params){
  const u = URL_ + (URL_.includes('?') ? '&' : '?') + new URLSearchParams(Object.assign({ key: KEY }, params));
  const r = await fetch(u, { cache:'no-store' });
  return r.json();
}
async function post(body){
  const r = await fetch(URL_, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: KEY }, body)) });
  return r.json();
}
async function loadData(){
  if(!URL_ || !KEY || loading) return;
  loading = true; loadErr = ''; render();
  try {
    const d = await api({ action:'getStock1981' });
    if(!d || !d.success) throw new Error((d && d.error) || 'Réponse invalide');
    DATA = { zones: d.zones, spots: d.spots, prices: d.prices || {}, names: d.names || {}, aliases: d.aliases || {}, generatedAt: d.generatedAt };
    reapplyQueue();
    ls('s1981_cache', JSON.stringify(DATA));
    online = true;
  } catch(e){
    loadErr = /Invalid key|Réponse invalide|getStock1981/.test(e.message) ? 'Le Sheet ne connaît pas encore Stock1981 : collez la nouvelle version de Code_updated.gs et redéployez.' : 'Pas de connexion : données enregistrées sur ce téléphone.';
    online = false;
  }
  loading = false; render();
}

}
async function flushQueue(){
  if(sending || !QUEUE.length || !user || !URL_) return;
  sending = true; render();
  let progress = false;
  try {
    const first = QUEUE[0];
    if(first.kind === 'labels'){
      const d = await post({ action:'stock1981Labels', by: first.by, userHash: first.hash, labels: first.labels });
      if(d && d.success){ QUEUE.shift(); progress = true; online = true; }
      else if(d && d.error){ toast(d.error); if(/Utilisateur|code|Aucune/i.test(d.error)){ QUEUE.shift(); progress = true; } }
    } else if(RECV_ACTIONS[first.kind]){
      const d = await post(Object.assign({ action: RECV_ACTIONS[first.kind], by: first.by, userHash: first.hash }, first.body));
      if(d && d.success){ QUEUE.shift(); progress = true; online = true; if(first.kind !== 'recvarr') setTimeout(loadArrivals, 500); }
      else if(d && /Missing name or barcode/.test(d.error || '')){
        // script not updated yet: keep it, but let counts and moves behind it go through
        toast('Réception gardée sur le téléphone : collez Code_updated_Stock1981_v8.gs et redéployez.');
        QUEUE.push(QUEUE.shift());
        if(QUEUE.some(o => !RECV_ACTIONS[o.kind])) progress = true;
      }
      else if(d && d.error){ toast(d.error); if(/Utilisateur|code/i.test(d.error)){ QUEUE.shift(); progress = true; } }
    } else if(first.kind === 'count'){
      const d = await post(Object.assign({ action:'stock1981Count', by: first.by, userHash: first.hash }, first.body));
      if(d && d.success){ QUEUE.shift(); progress = true; online = true; }
      else if(d && d.error){ toast(d.error); if(/Utilisateur|code/i.test(d.error)){ QUEUE.shift(); progress = true; } }
    } else {
      const batch = [];
      for(const o of QUEUE){ if(o.kind || batch.length >= 40) break; batch.push(o); }
      const d = await post({ action:'stock1981Adjust', by: batch[0].by, userHash: batch[0].hash, ops: batch.map(o => o.op) });
      if(d && d.success){
        const done = new Set(d.results.map(r => r.opId));
        const failed = d.results.filter(r => !r.ok);
        QUEUE = QUEUE.filter(o => o.kind || !done.has(o.op.opId));
        if(failed.length) toast(failed.length + ' changement(s) refusé(s) : ' + failed[0].error);
        progress = true; online = true;
      } else if(d && d.error){
        toast(d.error);
        if(/Utilisateur|code/i.test(d.error)){ QUEUE = QUEUE.filter(o => !batch.includes(o)); progress = true; }
      }
    }
  } catch(e){ online = false; }
  ls('s1981_queue', JSON.stringify(QUEUE));
  sending = false;
  if(progress && online && QUEUE.length) return flushQueue();
  if(progress && online) await loadData(); else render();
}
window.addEventListener('online', () => { online = true; flushQueue(); loadData(); });
window.addEventListener('offline', () => { online = false; render(); });

// ── data helpers ────────────────────────────────────────
function zoneList(loc){ return (ZONES[loc] || []); }
function rowsAt(loc, zone){ return (DATA ? DATA.zones : []).filter(r => r[0] === loc && (zone == null || r[1] === zone)); }
function spotsAt(loc, zone){ return (DATA ? DATA.spots : []).filter(r => r[0] === loc && r[1] === zone); }
function priceOf(bc){ const p = DATA && DATA.prices ? DATA.prices[bkey(bc)] : null; return p == null ? null : p; }
function productName(bc){
  const k = bkey(bc);
  if(DATA && DATA.names && DATA.names[k]) return DATA.names[k];
  const r = (DATA ? DATA.zones : []).find(x => bkey(x[2]) === k && x[3]); if(r) return r[3];
  const db = lsj('inv_count_product_cache', {});
  for(const b in db){ if(bkey(b) === k) return db[b].name; }
  return '';
}
function totals(rows){ let u = 0, p = 0, v = 0; rows.forEach(r => { if(r[4] > 0){ u += r[4]; p++; const pr = priceOf(r[2]); if(pr) v += pr * r[4]; } }); return { units:u, products:p, value:v }; }
function applyLocal(op){
  if(!DATA) DATA = { zones:[], spots:[], prices:{} };
  let r = DATA.zones.find(x => x[0] === op.location && x[1] === op.zone && bkey(x[2]) === bkey(op.barcode));
  if(!r){ r = [op.location, op.zone, op.barcode, op.name || '', 0, 0]; DATA.zones.push(r); }
  r[4] = op.mode === 'set' ? op.qty : r[4] + op.qty;
  if(op.name && !r[3]) r[3] = op.name;
}
function reapplyQueue(){ QUEUE.forEach(o => o.kind === 'count' ? applyCountLocal(o.body) : o.kind === 'recvunit' ? applyRecvStock(o.body) : o.kind ? null : applyLocal(o.op)); }
function applyCountLocal(c){
  if(!DATA) DATA = { zones:[], spots:[], prices:{}, names:{} };

// ── camera scanning (BarcodeDetector, else ZXing) ───────
let camStream = null, camTimer = null, zxReader = null;
async function openCamera(){
  const box = document.createElement('div');
  box.className = 'cam'; box.id = 'cam';
  box.innerHTML = '<video playsinline muted></video><div class="frame"></div><div class="camui"><span id="camtxt">Visez le code-barres</span><button class="cbtn" id="camx">Fermer</button></div>';
  document.body.appendChild(box);
  $('#camx').onclick = closeCamera;
  const video = box.querySelector('video');
  let last = '', lastAt = 0;
  const hit = code => { const now = Date.now(); if(code === last && now - lastAt < 1800) return; last = code; lastAt = now; addScan(code); $('#camtxt').textContent = 'Ajouté : ' + (productName(code) || code); };
  try {
    if('BarcodeDetector' in window){
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = camStream; await video.play();
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'] });
      camTimer = setInterval(async () => { try { const r = await det.detect(video); if(r[0]) hit(r[0].rawValue); } catch(e){} }, 250);
    } else {
      if(!window.ZXing) await new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
      zxReader = new ZXing.BrowserMultiFormatReader();
      await zxReader.decodeFromConstraints({ video: { facingMode: 'environment' } }, video, r => { if(r) hit(r.getText()); });
    }
  } catch(e){ $('#camtxt').textContent = "Appareil photo indisponible. Autorisez l'accès à la caméra pour ce site."; }
}
function closeCamera(){
  clearInterval(camTimer); camTimer = null;
  try { if(zxReader) zxReader.reset(); } catch(e){} zxReader = null;
  if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const b = $('#cam'); if(b) b.remove();
  const inp = $('#scan'); if(inp) inp.focus({ preventScroll: true });
}


// ══════════════════════════════════════════════════════════════════
//  📦 RÉCEPTION D'UN ARRIVAGE (28 Oct 2026)
//  An arrival is emptied one cooler / box at a time, blind (nothing
//  expected is shown). Every scan adds 1. The first time a product shows
//  up in an arrival, the phone asks for its expiry date once (month +
//  year, day optional), « ne périme pas » (never asked again) or « plus
//  tard » (goes on the « Dates à relever » list). A cooler in progress
//  lives in localStorage (s1981_recv) so a power cut loses nothing; a
//  finished cooler waits in the normal queue until it is sent
//  (action recvUnit). Stock lands in Entrepôt.
// ══════════════════════════════════════════════════════════════════
const RECV_LOC = 'Warehouse', RECV_ZONE = 'Entrepôt';
let R = lsj('s1981_recv', null);                 // cooler in progress
let ARR = lsj('s1981_arrivals', null);           // {arrivals:[...], noExpiry:[bkey], generatedAt}
let RDATES = lsj('s1981_recv_dates', {});        // arrivalId -> { bkey: {mode, expiry, solde} }
let NOEXP = new Set(lsj('s1981_noexp', []));     // products never asked again
let arrLoading = false, arrErr = '';
function saveRecv(){ ls('s1981_recv', R ? JSON.stringify(R) : null); }
function saveDates(){ ls('s1981_recv_dates', JSON.stringify(RDATES)); ls('s1981_noexp', JSON.stringify([...NOEXP])); }
function rid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

async function loadArrivals(){
  if(!URL_ || !KEY || arrLoading) return;
  arrLoading = true; arrErr = ''; if(/^(recv|arrival)$/.test(VIEW.screen)) render();
  try {
    const d = await api({ action:'getArrivals' });
    if(!d || !d.success || !Array.isArray(d.arrivals)) throw new Error('v8');
    ARR = { arrivals: d.arrivals, noExpiry: d.noExpiry || [], generatedAt: d.generatedAt };
    (d.noExpiry || []).forEach(k => NOEXP.add(k));
    reapplyRecvQueue();
    ls('s1981_arrivals', JSON.stringify(ARR)); saveDates();
  } catch(e){
    arrErr = e.message === 'v8' ? 'Le Sheet ne connaît pas encore la réception : collez Code_updated_Stock1981_v8.gs et redéployez (Nouvelle version).' : 'Pas de connexion : arrivages enregistrés sur ce téléphone.';
  }
  arrLoading = false; if(/^(recv|arrival)$/.test(VIEW.screen)) render();
}
function arrival(id){ return ARR && ARR.arrivals ? ARR.arrivals.find(a => a.id === id) : null; }
// Pending (not yet sent) arrivals / coolers / dates are shown at once.
function applyRecvLocal(o){
  if(!ARR) ARR = { arrivals: [], noExpiry: [] };
  const b = o.body;
  if(o.kind === 'recvarr'){
    if(!arrival(b.id)) ARR.arrivals.unshift({ id: b.id, name: b.name, created: new Date().toLocaleDateString('fr-FR'), status:'open', by: o.by, units: [], lines: [], pending: true });
    return;
  }
  if(o.kind === 'recvunit'){
    let a = arrival(b.arrivalId);
    if(!a){ a = { id: b.arrivalId, name: b.arrivalName, created:'', status:'open', by: o.by, units: [], lines: [] }; ARR.arrivals.unshift(a); }
    if(a.units.some(u => u.opId === b.opId)) return;
    const units = b.lines.reduce((s, l) => s + l.qty, 0);
    a.units.push({ unit: b.unit, kind: b.kind, cooler: b.cooler ? (b.cooler.name || b.cooler.barcode) : '', products: new Set(b.lines.map(l => bkey(l.barcode))).size, units, by: o.by, at: 'en attente', opId: b.opId, pending: true });
    b.lines.forEach(l => a.lines.push([l.lineId, b.unit, l.barcode, l.name, l.qty, l.mode, l.expiry || '', l.solde ? 1 : 0, priceOf(l.barcode)]));
    return;
  }
  if(o.kind === 'recvdate'){
    (ARR.arrivals || []).forEach(a => a.lines.forEach(l => { if(l[0] === b.lineId && l[5] === 'later'){ l[5] = b.mode; l[6] = b.expiry || ''; } }));
  }
}
function reapplyRecvQueue(){ QUEUE.filter(o => /^recv/.test(o.kind || '')).forEach(applyRecvLocal); }
// Stock in Entrepôt moves at once on the phone, like any other change.
function applyRecvStock(b){
  b.lines.forEach(l => applyLocal({ location: RECV_LOC, zone: RECV_ZONE, barcode: l.barcode, name: l.name, mode:'delta', qty: l.qty }));
  if(b.cooler) applyLocal({ location: RECV_LOC, zone: RECV_ZONE, barcode: b.cooler.barcode, name: b.cooler.name, mode:'delta', qty: 1 });
}
function queueRecv(kind, body, msg){
  if(!user){ lock(); return; }
  const o = { kind, body, by: user.name, hash: user.hash };
  QUEUE.push(o);
  applyRecvLocal(o);
  if(kind === 'recvunit') applyRecvStock(body);
  ls('s1981_queue', JSON.stringify(QUEUE)); ls('s1981_cache', JSON.stringify(DATA)); ls('s1981_arrivals', JSON.stringify(ARR));
  if(msg) toast(online ? msg : 'Enregistré sur le téléphone, envoi au retour de la connexion');
  flushQueue();
}
const RECV_ACTIONS = { recvarr:'recvArrival', recvunit:'recvUnit', recvdate:'recvSetDate' };

// ── dates ───────────────────────────────────────────────
// "0327" → 31/03/2027 (end of month) · "150327" → 15/03/2027
function parseExp(digits){
  const d = String(digits || '');
  let day = null, m, y;
  if(d.length === 4){ m = +d.slice(0, 2); y = 2000 + +d.slice(2); }
  else if(d.length === 6){ day = +d.slice(0, 2); m = +d.slice(2, 4); y = 2000 + +d.slice(4); }
  else return null;
  if(m < 1 || m > 12) return null;
  const last = new Date(y, m, 0).getDate();
  if(day != null && (day < 1 || day > last)) return null;
  const dd = day == null ? last : day;
  return { date: new Date(y, m - 1, dd), str: String(dd).padStart(2, '0') + '/' + String(m).padStart(2, '0') + '/' + y, short: (day == null ? '' : String(dd).padStart(2, '0') + '/') + String(m).padStart(2, '0') + '/' + String(y).slice(2) };
}
function expDate(str){ const m = String(str || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; }
function monthsLeft(d){ return (d - new Date()) / (30.44 * 864e5); }
function expLevel(str){
  const d = expDate(str); if(!d) return '';
  const ml = monthsLeft(d);
  return ml < 0 ? 'past' : ml <= 3 ? 'red' : ml <= 6 ? 'orange' : ml > 60 ? 'far' : 'ok';
}
function expBadge(l){
  if(l.mode === 'none') return '<span class="xb">∞ ne périme pas</span>';
  if(l.mode === 'later' || !l.expiry) return '<span class="xb later">⏭ date plus tard</span>';
  const lv = expLevel(l.expiry);
  return `<span class="xb ${lv}">📅 ${esc(l.expiry.slice(3))}${lv === 'past' ? ' · périmé' : lv === 'red' ? ' · < 3 mois' : lv === 'orange' ? ' · < 6 mois' : ''}${l.solde ? ' · solde' : ''}</span>`;
}
// The date panel. cb({mode, expiry, solde}) — on-screen keys only, so a
// scanner gun can't type into it by mistake.
function openDatePanel(name, bc, cur, cb, opts){
  let digits = '', solde = cur && cur.solde ? true : null, mode = 'date';
  const draw = () => {
    const p = parseExp(digits);
    const lv = p ? expLevel(p.str) : '';
    if(solde === null && (lv === 'past' || lv === 'red')) solde = true;
    const shown = digits.length <= 4 ? (digits.padEnd(4, '·').replace(/^(..)(..)$/, '$1 / $2')) : digits.padEnd(6, '·').replace(/^(..)(..)(..)$/, '$1 / $2 / $3');
    const warn = !p ? (digits.length === 4 || digits.length === 6 ? '<div class="err">Date impossible : vérifiez le mois' + (digits.length === 6 ? ' et le jour' : '') + '.</div>' : '')
      : lv === 'past' ? '<div class="xwarn red">⚠ Déjà périmé !</div>'
      : lv === 'red' ? '<div class="xwarn red">⚠ Périme dans moins de 3 mois</div>'
      : lv === 'orange' ? '<div class="xwarn orange">Périme dans moins de 6 mois</div>'
      : lv === 'far' ? '<div class="xwarn orange">Plus de 5 ans : vérifiez l’année</div>' : '';
    openSheet(`<h3>${esc(name || 'Produit inconnu')}</h3><div class="sub num">${esc(bc)}${opts && opts.sub ? ' · ' + esc(opts.sub) : ''}</div>
      <div class="xopts"><button data-xm="none">∞<span>Ne périme pas</span></button><button data-xm="later">⏭<span>Plus tard</span></button></div>
      <label class="f">Date de péremption : mois + année${digits.length > 4 ? ' (avec le jour)' : ''}</label>
      <div class="xdisp num ${lv}">${shown}</div>
      <div class="xhint">${p ? '= ' + esc(p.str) + (digits.length === 4 ? ' (fin du mois)' : '') : 'Ex. 0 3 2 7 = mars 2027 · avec le jour : 1 5 0 3 2 7'}</div>
      ${warn}
      ${p && (lv === 'past' || lv === 'red' || lv === 'orange') ? `<label class="chk"><input type="checkbox" id="xsol" ${solde ? 'checked' : ''}> À mettre en solde (vendre en priorité)</label>` : ''}
      <div class="pad xpad">${['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(k => `<button data-k="${k}" ${k === 'OK' && !p ? 'disabled' : ''}>${k}</button>`).join('')}</div>
      ${opts && opts.cancel ? '<button class="ghost" id="xcancel">Annuler</button>' : ''}`);
    const sh = $('#sheet');
    sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if(k === '⌫') digits = digits.slice(0, -1);
      else if(k === 'OK'){ const q = parseExp(digits); if(!q) return; const lv2 = expLevel(q.str); closeSheet(); cb({ mode:'date', expiry: q.str, solde: (lv2 === 'past' || lv2 === 'red' || lv2 === 'orange') && !!solde }); return; }
      else if(digits.length < 6) digits += k;
      draw();
    });
    sh.querySelectorAll('[data-xm]').forEach(b => b.onclick = () => { closeSheet(); cb({ mode: b.dataset.xm, expiry:'', solde:false }); });
    const so = $('#xsol'); if(so) so.onchange = e => { solde = e.target.checked; };
    const xc = $('#xcancel'); if(xc) xc.onclick = closeSheet;
  };
  draw();
}

function knownDate(k){
  const m = RDATES[R.aid] && RDATES[R.aid][k];
  if(m) return m;
  if(NOEXP.has(k)) return { mode:'none', expiry:'', solde:false };
  const a = arrival(R.aid);
  const l = a && a.lines.find(x => bkey(x[2]) === k && x[5] !== 'later');
  return l ? { mode: l[5], expiry: l[6], solde: !!l[7] } : null;
}
function setLineDate(i, r, forProduct){
  const l = R.lines[i]; if(!l) return;
  Object.assign(l, { mode: r.mode, expiry: r.expiry, solde: r.solde });
  if(r.mode === 'none') NOEXP.add(bkey(l.barcode));
  if(forProduct !== false) (RDATES[R.aid] = RDATES[R.aid] || {})[bkey(l.barcode)] = r;
  saveDates(); saveRecv(); render();
}
function recvScan(raw){
  if(!R) return;
  const code = aliasOf(raw);
  if(!code) return;
  if(!/^\d{4,20}$/.test(code)){ beep(false); toast('Code illisible : vérifiez la langue du clavier (chiffres seulement), puis rescannez.'); return; }
  if(!$('#sheet').hidden){ beep(false); toast('Répondez d’abord à la date du produit précédent.'); return; }
  const k = bkey(code);
  let i = R.lines.findIndex(l => bkey(l.barcode) === k && l.active);
  if(i >= 0){ const l = R.lines.splice(i, 1)[0]; l.qty++; R.lines.unshift(l); R.flash = true; beep(true); saveRecv(); render(); return; }
  const kd = knownDate(k);
  const l = { barcode: code, name: productName(code), qty: 1, mode: kd ? kd.mode : 'later', expiry: kd ? kd.expiry : '', solde: kd ? !!kd.solde : false, active: true };
  R.lines.unshift(l); R.flash = true; beep(true); saveRecv(); render();
  if(!kd) openDatePanel(l.name, code, null, r => setLineDate(R.lines.indexOf(l), r));
}
function bindUnit(){

    const fb = $('#fcb'); if(fb){ fb.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); cbc = aliasOf(fb.value.trim()); draw(); } }; fb.onchange = () => { cbc = aliasOf(fb.value.trim()); draw(); }; if(!cbc) fb.focus(); }
    const fn = $('#fcn'); if(fn) fn.oninput = () => { cname = fn.value; };
    $('#fok').onclick = () => {
      if(fb) cbc = aliasOf(fb.value.trim());

      if(sell && cbc && !productName(cbc) && !cname) return draw('Donnez un nom à cette glacière.');

      const opId = rid('r');
      const body = { opId, arrivalId: R.aid, arrivalName: R.aname, unit: R.unit, kind: R.kind,
        cooler: sell && cbc ? { barcode: cbc, name: productName(cbc) || cname } : null,
        lines: R.lines.map((l, i) => ({ lineId: opId + '-' + i, barcode: l.barcode, name: l.name, qty: l.qty, mode: l.mode === 'date' && !l.expiry ? 'later' : l.mode, expiry: l.expiry || '', solde: !!l.solde })) };

    <div class="chips">${LOCS.filter(l => !(l.id === S.loc && S.loc === 'Warehouse')).map(l => `<button data-to="${esc(l.id)}" aria-pressed="${S.to === l.id}">${esc(l.name)}</button>`).join('')}</div>
    <label class="f" for="mz">Zone d’arrivée</label>
    <select class="t" id="mz">${zs.filter(z => !(S.to === S.loc && z === S.zone)).map(z => `<option value="${esc(z)}"${z === S.toZone ? ' selected' : ''}>${esc(z === UNPLACED ? 'Non placé (à ranger)' : z)}</option>`).join('')}</select>
    <label class="f">Quantité</label>
    <div class="stepper"><button data-step="-1" aria-label="Moins">−</button><input id="mq" class="num" inputmode="numeric" value="${S.qty}" aria-label="Quantité"><button data-step="1" aria-label="Plus">+</button></div>
    ${over ? `<div class="err">Plus que les ${fmt(S.cur)} enregistrés ici : vérifiez le compte (le stock passera en négatif).</div>` : ''}
    <label class="chk"><input type="checkbox" id="mp" ${S.print ? 'checked' : ''}> 🏷 Imprimer ${fmt(S.qty)} étiquette${S.qty > 1 ? 's' : ''} (prix ${esc(locName(S.to))}) sur l’ordinateur de l’imprimante</label>
    <button class="go" id="mgo" ${S.qty > 0 && S.toZone ? '' : 'disabled'}>Déplacer ${fmt(S.qty)}</button>
    <button class="ghost" id="mback">Retour</button>`);
  const sh = $('#sheet');
  sh.querySelectorAll('[data-to]').forEach(b => b.onclick = () => { S.to = b.dataset.to; S.toZone = null; drawMove(); });
  $('#mz').onchange = e => { S.toZone = e.target.value; };
  if(!zs.includes(S.toZone) || (S.to === S.loc && S.toZone === S.zone)) S.toZone = $('#mz').value;
  sh.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { S.qty = Math.max(1, S.qty + Number(b.dataset.step)); drawMove(); });
  $('#mq').onchange = e => { const v = parseInt(e.target.value, 10); if(v > 0) S.qty = v; drawMove(); };
  $('#mp').onchange = e => { S.print = e.target.checked; };
  $('#mback').onclick = () => { S.mode = 'out'; S.qty = 1; drawProduct(); };
  $('#mgo').onclick = () => {
    const id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const base = { barcode: S.bc, name: S.name, mode:'delta', reason:'Transfert' };
    const ops = [
      Object.assign({}, base, { location: S.loc, zone: S.zone, qty: -S.qty, note: 'vers ' + locName(S.to) + ' · ' + S.toZone }),
      Object.assign({}, base, { location: S.to, zone: S.toZone, qty: S.qty, note: 'depuis ' + locName(S.loc) + ' · ' + S.zone })
    ];
    const labels = S.print ? [{ id: id + '-u', barcode: S.bc, name: S.name, qty: S.qty, store: locName(S.to), kind:'unit' }] : [];
    queueWork(ops, labels, S.qty + ' déplacé' + (S.qty > 1 ? 's' : '') + ' vers ' + locName(S.to) + (labels.length ? ' · étiquettes envoyées à l’imprimante' : ''));
  };
}
function drawBox(){
  const b = S.box;
  openSheet(`<h3>🏷 Étiquette de carton</h3>
    <div class="sub">${esc(S.name || 'Produit sans nom')} · <span class="num">${esc(S.bc)}</span></div>
    <p class="sub" style="margin:8px 0">Une étiquette par carton : code-barres, nom et quantité dans le carton. Elle s’imprime sur l’ordinateur de l’imprimante.</p>
    <label class="f">Unités dans chaque carton</label>
    <div class="stepper"><button data-b="per" data-step="-1" aria-label="Moins">−</button><input id="bper" class="num" inputmode="numeric" value="${b.per}" aria-label="Unités par carton"><button data-b="per" data-step="1" aria-label="Plus">+</button></div>
    <label class="f">Nombre de cartons</label>
    <div class="stepper"><button data-b="n" data-step="-1" aria-label="Moins">−</button><input id="bn" class="num" inputmode="numeric" value="${b.n}" aria-label="Nombre de cartons"><button data-b="n" data-step="1" aria-label="Plus">+</button></div>
    <button class="go" id="bgo">Envoyer ${fmt(b.n)} étiquette${b.n > 1 ? 's' : ''} de carton</button>
    <button class="ghost" id="bback">Retour</button>`);
  const sh = $('#sheet');
  sh.querySelectorAll('[data-b]').forEach(x => x.onclick = () => { b[x.dataset.b] = Math.max(1, b[x.dataset.b] + Number(x.dataset.step)); drawBox(); });
  $('#bper').onchange = e => { const v = parseInt(e.target.value, 10); if(v > 0) b.per = v; drawBox(); };
  $('#bn').onchange = e => { const v = parseInt(e.target.value, 10); if(v > 0) b.n = Math.min(50, v); drawBox(); };
  $('#bback').onclick = () => drawProduct();
  $('#bgo').onclick = () => {
    const id = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const labels = Array.from({ length: b.n }, (_, i) => ({ id: id + '-' + i, barcode: S.bc, name: S.name, qty: b.per, store: locName(S.loc), kind:'box' }));
    queueWork([], labels, b.n + ' étiquette' + (b.n > 1 ? 's' : '') + ' de carton envoyée' + (b.n > 1 ? 's' : '') + ' à l’imprimante');
  };
}
function queueWork(ops, labels, msg){
  if(!user){ lock(); return; }
  ops.forEach((op, i) => {
    op.opId = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + i;
    applyLocal(op);
    QUEUE.push({ op, by: user.name, hash: user.hash });
  });
  if(labels.length) QUEUE.push({ kind:'labels', labels, by: user.name, hash: user.hash });
  ls('s1981_queue', JSON.stringify(QUEUE));
  ls('s1981_cache', JSON.stringify(DATA));
  closeSheet(); render();
  toast(online ? msg : 'Enregistré sur le téléphone, envoi au retour de la connexion');
  flushQueue();
}
function save(op){
  if(!user){ lock(); return; }
  op.opId = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  applyLocal(op);
  QUEUE.push({ op, by: user.name, hash: user.hash });
  ls('s1981_queue', JSON.stringify(QUEUE));
  ls('s1981_cache', JSON.stringify(DATA));
  closeSheet(); render();
  toast(online ? 'Enregistré' : 'Enregistré sur le téléphone, envoi au retour de la connexion');
  flushQueue();
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

// ── sign-in & lock ──────────────────────────────────────
async function hashCode(name, code){
  const data = new TextEncoder().encode('b1981|' + String(name).trim().toLowerCase() + '|' + code);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function activeUsers(){ return USERS.filter(u => u.active !== false); }
function lock(){ user = null; pin = ''; ls('s1981_auth', null); closeSheet(); $('#lock').hidden = false; drawLock(''); }
function drawLock(msg){
  const box = $('#lockbox');
  if(!URL_ || !KEY){
    box.innerHTML = `<div class="logo">Stock<b>1981</b></div><p>Collez le lien du Sheet et la clé (les mêmes que dans l'app Comptage).</p>
      <input id="lu" placeholder="https://script.google.com/…/exec"><input id="lk" placeholder="Clé d'écriture">
      <button class="go" id="lsave">Enregistrer</button><div class="lockerr">${esc(msg)}</div>`;
    $('#lsave').onclick = async () => {
      const u = $('#lu').value.trim(), k = $('#lk').value.trim();
      if(!/^https:\/\/script\.google\.com\//.test(u) || !k) return drawLock('Lien ou clé manquant.');
      URL_ = u; KEY = k; ls('inv_count_sync_url', u); ls('inv_count_write_key', k);
      await refreshUsers(); drawLock('');
    };
    return;
  }
  const users = activeUsers();
  if(!users.length){
    box.innerHTML = `<div class="logo">Stock<b>1981</b></div><p>Aucun code trouvé. Créez d'abord votre code dans l'app Comptage, puis revenez.</p><button class="go" id="lretry">Réessayer</button><div class="lockerr">${esc(msg)}</div>`;
    $('#lretry').onclick = async () => { await refreshUsers(); drawLock(activeUsers().length ? '' : 'Toujours aucun code.'); };
    return;
  }
  if(!pickName || !users.find(u => u.name === pickName)) pickName = (users.find(u => u.name === ls('inv_count_last_user')) || users[0]).name;
  box.innerHTML = `<div class="logo">Stock<b>1981</b></div><p>Qui êtes-vous ?</p>
    <div class="users">${users.map(u => `<button data-u="${esc(u.name)}" aria-pressed="${u.name === pickName}">${esc(u.name)}</button>`).join('')}</div>
    <div class="dots">${[0,1,2,3].map(i => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join('')}</div>
    <div class="lockerr">${esc(msg)}</div>
    <div class="pad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k => k ? `<button data-k="${k}" aria-label="${k === '⌫' ? 'Effacer' : k}">${k}</button>` : '<span></span>').join('')}</div>`;
  box.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { pickName = b.dataset.u; pin = ''; drawLock(''); });
  box.querySelectorAll('[data-k]').forEach(b => b.onclick = () => key(b.dataset.k));
}
async function key(k){
  if(k === '⌫'){ pin = pin.slice(0, -1); return drawLock(''); }
  if(pin.length >= 4) return;
  pin += k; drawLock('');
  if(pin.length < 4) return;
  const u = activeUsers().find(x => x.name === pickName);
  const h = await hashCode(pickName, pin); pin = '';
  if(!u || u.hash !== h) return drawLock('Code incorrect.');
  signIn(u);
}
document.addEventListener('keydown', e => { if(!$('#lock').hidden && /^[0-9]$/.test(e.key)) key(e.key); else if(!$('#lock').hidden && e.key === 'Backspace') key('⌫'); });
function signIn(u){
  user = { name: u.name, role: u.role, hash: u.hash };
  lastActive = Date.now();
  ls('s1981_auth', JSON.stringify({ name: u.name, at: lastActive }));
  ls('inv_count_last_user', u.name);
  $('#lock').hidden = true;
  render();
  if(!DATA || !DATA.generatedAt) loadData();
  flushQueue();
}
['pointerdown', 'keydown', 'scroll'].forEach(ev => window.addEventListener(ev, () => {
  if(!user) return;
  lastActive = Date.now();
}, { passive: true }));
setInterval(() => {
  if(user && Date.now() - lastActive > IDLE_MS) lock();
  else if(user) ls('s1981_auth', JSON.stringify({ name: user.name, at: lastActive }));
}, 20000);

// ── start ───────────────────────────────────────────────
(async function start(){
  if(history.state && history.state.screen) VIEW = history.state; else history.replaceState(VIEW, '');
  const a = lsj('s1981_auth', null);
  const u = a && activeUsers().find(x => x.name === a.name);
  if(u && Date.now() - a.at < IDLE_MS){ user = { name: u.name, role: u.role, hash: u.hash }; lastActive = a.at; }
  else lock();
  render();
  if(URL_ && KEY){ refreshUsers(); await loadData(); flushQueue(); }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
