<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1022">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock1981">
<title>Stock1981</title>
<link rel="manifest" href="stock1981.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Stock1981 — Beauty Empire. Layout: one column, app bar on top, screens slide in place (home → store → zone), product sheet from the bottom. */
:root{
  --bg:#faf6f8; --surface:#ffffff; --sunk:#f2eaef; --ink:#2a1022; --muted:#7c6573; --line:#eadde5;
  --brand:#c2186b; --brand-ink:#ffffff; --brand-soft:#fbe1ee; --plum:#2a1022;
  --ok:#17784a; --ok-soft:#dcf2e6; --warn:#b25a07; --warn-soft:#fdebd6; --bad:#c3262f; --bad-soft:#fbdfe0;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(42,16,34,.06),0 6px 18px rgba(42,16,34,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#150b11; --surface:#21131b; --sunk:#1a0f16; --ink:#f7ecf2; --muted:#b39aa8; --line:#3a2530;
  --brand:#f0559c; --brand-ink:#1b0812; --brand-soft:#4a1a32; --plum:#0f070c;
  --ok:#5fd39a; --ok-soft:#173a29; --warn:#f3a65a; --warn-soft:#432a10; --bad:#ff7d84; --bad-soft:#45191c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* App bar */
.bar{position:sticky;top:0;z-index:20;background:var(--plum);color:#fbeaf3;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.bar .back{border:0;background:rgba(255,255,255,.1);width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer;display:grid;place-items:center;color:#fbeaf3}
.bar h1{flex:1;min-width:0;margin:0;font:800 20px var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font:500 12px var(--body);opacity:.7;letter-spacing:0}
.bar h1 b{color:#ff8cc0;font-weight:800}
.who{border:0;background:rgba(255,255,255,.1);color:#fbeaf3;border-radius:99px;padding:6px 12px 6px 8px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
.who i{width:8px;height:8px;border-radius:50%;background:#7be3a8;display:inline-block}
.who i.off{background:#f3a65a}

main{max-width:880px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.notice{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;margin-bottom:14px}
.notice button{margin-left:auto;border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.notice.ok{background:var(--ok-soft);color:var(--ok)}

/* Search */
.search{position:relative;margin-bottom:16px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px 13px 42px;font:16px var(--body);color:var(--ink)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.results{display:flex;flex-direction:column;gap:6px;margin:-6px 0 18px}

/* Store tiles */
.tiles{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.tools{display:grid;gap:8px;grid-template-columns:repeat(4,1fr);margin-top:10px}
@media(max-width:360px){.tools{grid-template-columns:repeat(3,1fr)}}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;aspect-ratio:1/1;border:1.5px solid var(--brand);background:var(--brand-soft);color:var(--ink);border-radius:14px;padding:6px 4px;cursor:pointer;text-align:center;font:inherit;position:relative}
.tool .ic{font-size:24px;line-height:1}
.tool b{font-size:12px;line-height:1.15}
.tool small{font-size:10px;color:var(--muted);line-height:1.15;max-height:2.3em;overflow:hidden}
.tool .dot{position:absolute;top:5px;right:5px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
.zact{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.zact button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--brand);background:var(--brand-soft);border-radius:12px;padding:10px 4px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer}
.zact button span{font-size:20px}
.pbox.empty{background:repeating-linear-gradient(135deg,rgba(120,120,120,.35) 0 6px,rgba(120,120,120,.12) 6px 12px)!important;border-color:#777!important}
.vide{display:inline-block;background:#eee;color:#555;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700}
.spotpick{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line,#ddd);border-radius:10px;margin-bottom:6px;width:100%;background:#fff;font:inherit;text-align:left;cursor:pointer}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border:0;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;aspect-ratio:1/1;background:var(--plum);box-shadow:var(--shadow);max-width:100%}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,6,15,0) 30%,rgba(20,6,15,.85))}
.tile .pat{position:absolute;inset:0;background:repeating-linear-gradient(135deg,#3a1630 0 18px,#2a1022 18px 36px)}
.tile .t{position:absolute;left:8px;right:8px;bottom:8px;z-index:1;color:#fff}
.tile .t h2{margin:0;font:800 15px/1.05 var(--display);letter-spacing:-.01em}
.tile .t p{margin:3px 0 0;font-size:10px;opacity:.9}
.tile .badge{position:absolute;top:6px;right:6px;z-index:1;background:var(--brand);color:#fff;font-weight:700;font-size:10px;padding:2px 7px;border-radius:99px}
.sect{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}

/* Zone grid */
.zgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.zcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-width:0}
.zcard .ph{width:100%;aspect-ratio:4/3;background:var(--sunk) center/cover no-repeat;position:relative}
.zcard .ph span{position:absolute;left:8px;top:8px;background:rgba(20,6,15,.78);color:#fff;font:800 15px var(--display);padding:3px 9px;border-radius:9px}
.zcard .ph .cl{left:auto;right:8px;background:var(--brand);font:700 11px var(--body);padding:4px 8px}
.zcard .b{padding:9px 10px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.zcard .b strong{font-size:14px}
.zcard .b small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zcard.isempty .b strong{color:var(--muted);font-weight:500}
.zcard.unplaced{border:1.5px dashed var(--warn)}
.zcard.unplaced .ph{background:var(--warn-soft);display:grid;place-items:center;color:var(--warn);font-weight:700}

/* Zone view */
.hero{border-radius:20px;overflow:hidden;background:var(--sunk);aspect-ratio:16/9;max-height:300px;width:100%;position:relative}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .nophoto{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600}
.zhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin:14px 0 4px}
.zhead h2{margin:0;font:800 28px var(--display)}
.zhead p{margin:0;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:92px}
.stat b{display:block;font:800 20px var(--display)}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;margin:16px 0 12px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Rows */
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;width:100%;min-width:0}
.row .nm{flex:1;min-width:0}
.row .nm strong{display:block;font-weight:600;overflow-wrap:anywhere}
.row .nm small{color:var(--muted);font-size:12px}
.qty{font:800 20px var(--display);min-width:44px;text-align:right}
.qty.zero{color:var(--muted)}
.qty.neg{color:var(--bad)}
.addbtn{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:12px;font-weight:600;color:var(--brand);cursor:pointer;margin-top:4px}
.shelf{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.shelf h4{margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.shelf h4 span{color:var(--muted);font-weight:500;font-size:12px}
.shelf ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.shelf li{display:flex;gap:8px;font-size:14px}
.shelf li span{flex:1;min-width:0;overflow-wrap:anywhere}
.shelf li b{font-variant-numeric:tabular-nums}
.shelf .none{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:26px 8px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(20,6,15,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0;font:800 22px/1.15 var(--display);overflow-wrap:anywhere}
.sheet .sub{color:var(--muted);font-size:13px;margin-top:4px}
.where{margin:14px 0;display:flex;flex-direction:column;gap:4px}
.where div{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:10px;background:var(--sunk);font-size:14px}
.where div.here{background:var(--brand-soft);font-weight:700}
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;margin:8px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px}
.stepper button{width:54px;height:54px;border-radius:16px;border:1px solid var(--line);background:var(--sunk);font-size:26px;font-weight:700;cursor:pointer}
.stepper input{width:110px;text-align:center;font:800 36px var(--display);border:0;background:transparent;color:var(--ink)}
.preview{text-align:center;color:var(--muted);font-size:14px;margin:-6px 0 12px}
.preview b{color:var(--ink)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 5px}
select,input.t,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:16px var(--body)}
textarea{min-height:60px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.loss[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.go{width:100%;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;border-radius:14px;padding:15px;margin-top:16px;cursor:pointer}
.go:disabled{opacity:.45;cursor:default}
.ghost{width:100%;border:0;background:transparent;color:var(--muted);font-weight:600;padding:12px;cursor:pointer}
.err{color:var(--bad);font-size:14px;font-weight:600;margin-top:8px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;font-size:14px;line-height:1.35;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--brand)}
select.t{appearance:auto}

/* Lock */
.lock{position:fixed;inset:0;z-index:60;background:var(--plum);color:#fbeaf3;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.lockbox{width:100%;max-width:340px;text-align:center}
.lockbox .logo{font:800 34px var(--display);letter-spacing:-.02em}
.lockbox .logo b{color:#ff8cc0}
.lockbox p{opacity:.75;margin:6px 0 18px}
.users{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.users button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fbeaf3;border-radius:99px;padding:8px 16px;font-weight:600;cursor:pointer}
.users button[aria-pressed="true"]{background:#fbeaf3;color:var(--plum)}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0 10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fbeaf3}
.dots i.f{background:#fbeaf3}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pad button{height:62px;border-radius:18px;border:0;background:rgba(255,255,255,.09);color:#fbeaf3;font:700 24px var(--display);cursor:pointer}
.pad button:active{background:rgba(255,255,255,.2)}
.lockerr{color:#ff9aa1;min-height:20px;font-weight:600}
.lock input{width:100%;margin:6px 0;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;padding:12px;font:15px var(--body)}
.lock .go{background:#ff8cc0;color:var(--plum)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.viewsw{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;margin:0 0 14px;max-width:260px}
.viewsw button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.viewsw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.mapwrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;overflow-x:auto}
.mapwrap svg{display:block;width:100%;min-width:820px;height:auto}
@media (min-width:860px){.mapwrap svg{min-width:0}}
.mz rect{fill:var(--sunk);stroke:var(--line);stroke-width:1.5;rx:5}
.mz.has rect{fill:var(--brand-soft);stroke:var(--brand)}
.mz.hl rect{fill:#ffe14d;stroke:#d40000;stroke-width:4;animation:hlp 1.2s ease-in-out infinite}
@keyframes hlp{50%{stroke-width:1.5}}
.pbox.hl{outline:4px solid #ffd400!important;background:rgba(255,212,0,.35)!important}
.hlbar{display:flex;gap:8px;align-items:center;background:#fff7cc;border:1.5px solid #e6b800;border-radius:12px;padding:8px 10px;margin:0 0 10px;font-size:13px}
.hlbar b{flex:1}
.pin{border:1.5px solid var(--brand);background:#fff;border-radius:99px;padding:4px 9px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.mz.sale rect{fill:var(--warn-soft);stroke:var(--warn)}
.mz{cursor:pointer}
.mz:hover rect,.mz:focus rect{stroke-width:3}
.mz text{fill:var(--ink);font:800 15px var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mz text.n{font:700 12px var(--body);fill:var(--muted)}
.mz.has text.n{fill:var(--brand)}
.map-deco-text{font:13px var(--body);fill:var(--muted)}
.map-deco-text.strong{font-weight:700;fill:var(--ink);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 4px 0;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1.5px solid var(--line);background:var(--sunk)}
.legend i.has{background:var(--brand-soft);border-color:var(--brand)}
.legend i.sale{background:var(--warn-soft);border-color:var(--warn)}
.mz.rpart rect{fill:#ffe7c2;stroke:#d97706}
.mz.boxz rect{stroke-dasharray:6 4;stroke:#d97706;stroke-width:2.5}
.mz.boxz.has rect{fill:#ffe7c2}
.me-z.box rect{stroke-dasharray:6 4;stroke:#d97706;fill:#fff4e0}
.bilan{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.55;white-space:normal;overflow-wrap:anywhere}
.boxbar{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
.boxrow .code{font-size:20px}
.medit{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.me-top{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--plum,#2b1622);color:#fff}
.me-top b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-top button{border:0;border-radius:10px;padding:9px 12px;font:700 14px var(--body);background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.me-top button.go2{background:#ff8cc0;color:#2b1622}
.me-top button:disabled{opacity:.4}
.me-add{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.me-add button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font:700 13px var(--body);cursor:pointer;color:var(--ink)}
.me-add span{font-size:12px;color:var(--muted)}
.me-canvas{flex:1;overflow:auto;padding:8px;background:var(--sunk);touch-action:pan-x pan-y}
.me-canvas svg{display:block;background:var(--surface);border-radius:10px}
.me-bg{fill:var(--surface)}
.me-z rect{fill:var(--brand-soft);stroke:var(--brand);stroke-width:1.5}
.me-z.sale rect{fill:var(--warn-soft);stroke:var(--warn)}
.me-z.sel rect,.me-x.sel rect.box{stroke:#ff3d8b;stroke-width:3.5}
.me-x.sel .hit{fill:rgba(255,61,139,.12);stroke:#ff3d8b;stroke-dasharray:4 3}
.me-z text,.me-x text{fill:var(--ink);font:800 15px var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.me-z text.n{font:600 11px var(--body);fill:var(--muted)}
.me-x text.lbl{text-anchor:start;dominant-baseline:auto;font:700 14px var(--body)}
.me-x rect.box{fill:none;stroke:#8a7d6c;stroke-dasharray:5 4}
.me-x .hit{fill:transparent}
.me-z,.me-x{cursor:move}
.me-h{fill:#ff3d8b;stroke:#fff;stroke-width:2;cursor:nwse-resize}
.me-panel{max-height:46vh;overflow:auto;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.me-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.me-row{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.me-row label,.me-sect{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

function resetAtMs(v){
  const t = String(v == null ? '' : v).trim();
  if(/^\d+(\.\d+)?$/.test(t)) return (Number(t) - 25569) * 864e5;   // Sheets serial day
  const ms = Date.parse(t.length <= 16 && t.includes('T') ? t + ':00Z' : t);
  return isNaN(ms) ? 0 : ms;
}
function applyZoneResets(D){
  if(!D || !Array.isArray(D.spots)) return D;
  Object.keys(ZONE_RESET).forEach(loc => {
    const R = ZONE_RESET[loc], cut = resetAtMs(R.at), zs = new Set(R.zones);
    D.spots = D.spots.filter(r => !(r[0] === loc && zs.has(r[1]) && resetAtMs(r[6]) < cut));

      D.zones = D.zones.filter(r => !(r[0] === loc && zs.has(r[1])));

    }
  });

}

      C = null; saveDraft(); closeSheet();
      VIEW = { screen:'zone', loc: body.location, zone: body.zone, tab:'shelves' }; history.replaceState(VIEW, ''); render();
      toast(online ? '🔁 Remplissage enregistré (+' + fmt(na) + ')' : 'Gardé sur le téléphone, envoi au retour de la connexion');
      flushQueue();
    };
    return;
  }
  const gaps = recountGaps();
  const gapsHTML = !gaps ? '' : !gaps.length ? '<div class="sub" style="color:#15803d;font-weight:700;margin-top:8px">✅ Conforme à ce qui était attendu (dernier comptage − ventes)</div>'
    : '<div class="sect" style="margin-top:10px">⚖ Écarts avec ce qui était attendu (≈)</div><div class="where">' + gaps.slice(0, 10).map(x => `<div><span>${esc(x.name)}<br><small class="num">attendu ≈${fmt(x.exp)} · compté ${fmt(x.got)}</small></span><b class="num" style="color:${x.g < 0 ? '#b91c1c' : '#15803d'}">${x.g > 0 ? '+' : ''}${fmt(x.g)}${x.v != null ? '<br><small>' + (x.v > 0 ? '+' : '') + fmt(x.v) + ' F</small>' : ''}</b></div>`).join('') + (gaps.length > 10 ? `<div><span>… et ${gaps.length - 10} autre(s)</span></div>` : '') +
      (() => { const v = gaps.reduce((a, x) => a + (x.v || 0), 0); return v ? `<div class="here"><span>Valeur</span><b class="num" style="color:${v < 0 ? '#b91c1c' : '#15803d'}">${v > 0 ? '+' : ''}${fmt(v)} F</b></div>` : ''; })() + '</div><div class="sub">Si un écart est une erreur de scan, touchez « Revenir au comptage ».</div>';
  openSheet(`<h3>${C.items.length ? 'Envoyer ce comptage ?' : 'Étagère vide ?'}</h3>
    <div class="sub">${esc(locName(C.loc))} · ${esc(C.zone)} · ${esc(spotLabelOf(C.loc, C.zone, C.spot))}</div>
    <div class="where"><div class="here"><span>${C.items.length} produit(s)</span><b class="num">${fmt(n)} article(s)</b></div></div>
    <div class="sub">${C.items.length ? 'Ce comptage remplace ce qui était enregistré pour cette étagère.' : 'Tout ce qui était enregistré sur cette étagère sera retiré.'}</div>
    ${gapsHTML}
    <button class="go" id="cok">Envoyer</button><button class="ghost" id="cno">Revenir au comptage</button>`);
  $('#cno').onclick = () => { if(C) delete C.next; closeSheet(); };
  $('#cok').onclick = () => {
    if(!user){ closeSheet(); lock(); return; }
    const body = { opId: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), location: C.loc, zone: C.zone, spot: C.spot,
      at: new Date().toISOString(), items: C.items.map(it => ({ barcode: it.barcode, name: it.name, count: it.count })) };
    applyCountLocal(Object.assign({ by: user.name }, body));
    QUEUE.push({ kind:'count', body, by: user.name, hash: user.hash });
    ls('s1981_queue', JSON.stringify(QUEUE)); ls('s1981_cache', JSON.stringify(DATA));
    const nx = C.next;
    C = null; saveDraft(); closeSheet();
    VIEW = { screen:'zone', loc: body.location, zone: body.zone, tab:'shelves' }; history.replaceState(VIEW, ''); render();
    if(nx) setTimeout(() => startCount(nx.loc, nx.zone, nx.spot), 200);
    toast(online ? 'Comptage enregistré' : 'Comptage gardé sur le téléphone, envoi au retour de la connexion');
    flushQueue();
  };
}

// ── camera scanning (BarcodeDetector, else ZXing) ───────
let camStream = null, camTimer = null, zxReader = null;
async function openCamera(onCode){
  const box = document.createElement('div');
  box.className = 'cam'; box.id = 'cam';
  box.innerHTML = '<video playsinline muted></video><div class="frame"></div><div class="camui"><span id="camtxt">Visez le code-barres</span><button class="cbtn" id="camx">Fermer</button></div>';
  document.body.appendChild(box);
  $('#camx').onclick = closeCamera;
  const video = box.querySelector('video');
  let last = '', lastAt = 0;
  const hit = code => { const now = Date.now(); if(code === last && now - lastAt < 1800) return; last = code; lastAt = now;
    if(typeof onCode === 'function'){ beep(true); closeCamera(); onCode(code); return; }
    addScan(code); const t = $('#camtxt'); if(t) t.textContent = 'Ajouté : ' + (productName(code) || code); };
  try {
    if('BarcodeDetector' in window){
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = camStream; await video.play();
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'] });
      camTimer = setInterval(async () => { try { const r = await det.detect(video); if(r[0]) hit(r[0].rawValue); } catch(e){} }, 250);
    } else {
      if(!window.ZXing) await new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
      zxReader = new ZXing.BrowserMultiFormatReader();
      await zxReader.decodeFromConstraints({ video: { facingMode: 'environment' } }, video, r => { if(r) hit(r.getText()); });
    }
  } catch(e){ $('#camtxt').textContent = "Appareil photo indisponible. Autorisez l'accès à la caméra pour ce site."; }
}
function closeCamera(){
  clearInterval(camTimer); camTimer = null;
  try { if(zxReader) zxReader.reset(); } catch(e){} zxReader = null;
  if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const b = $('#cam'); if(b) b.remove();
  const inp = $('#scan'); if(inp) inp.focus({ preventScroll: true });
}


// ══════════════════════════════════════════════════════════════════
//  📦 RÉCEPTION D'UN ARRIVAGE (28 Oct 2026)
//  An arrival is emptied one cooler / box at a time, blind (nothing
//  expected is shown). Every scan adds 1. The first time a product shows
//  up in an arrival, the phone asks for its expiry date once (month +
//  year, day optional), « ne périme pas » (never asked again) or « plus
//  tard » (goes on the « Dates à relever » list). A cooler in progress
//  lives in localStorage (s1981_recv) so a power cut loses nothing; a
//  finished cooler waits in the normal queue until it is sent
//  (action recvUnit). Stock lands in Entrepôt.
// ══════════════════════════════════════════════════════════════════
const RECV_LOC = 'Warehouse', RECV_ZONE = 'Entrepôt';
let R = lsj('s1981_recv', null);                 // cooler in progress
let ARR = lsj('s1981_arrivals', null);           // {arrivals:[...], noExpiry:[bkey], generatedAt}
let RDATES = lsj('s1981_recv_dates', {});        // arrivalId -> { bkey: {mode, expiry, solde} }
let NOEXP = new Set(lsj('s1981_noexp', []));     // products never asked again
let arrLoading = false, arrErr = '';
function saveRecv(){ ls('s1981_recv', R ? JSON.stringify(R) : null); }
function saveDates(){ ls('s1981_recv_dates', JSON.stringify(RDATES)); ls('s1981_noexp', JSON.stringify([...NOEXP])); }
// ══════════════════════════════════════════════════════════
//  🔄 RÉORGANISATION (31 Oct 2026) — first count of each shelf done by the
//  staff: the cashier scans every item at the till (Scanner → 🔄
//  Réorganisation, ▶ Nouvelle zone between shelves). Here the admin first
//  « repère » each shelf in walk order (2–3 fingerprint barcodes + the total
//  he counted), then matches the till's zones with his shelves (order +
//  fingerprints + totals) and validates: ✓ Valider = an ordinary shelf count.
// ══════════════════════════════════════════════════════════
let RE = lsj('s1981_reorg', null);            // { loc, marks:[...], scans:[[t, sess, z, bc, by]], at }
let REM = lsj('s1981_reorg_draft', null);     // mark being entered { id, loc, zone, spot, prints:[], total, order }
let RE_LOC = ls('s1981_reorg_loc') || 'Store 1', RE_DAY = '', RE_LOADING = false, RE_ERR = '';
const REORG_ACTIONS = { reorgmark: 'reorgMark', reorgstatus: 'reorgStatus' };
function reDay(t){ const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function reToday(){ return reDay(Date.now()); }
function reSaveDraft(){ ls('s1981_reorg_draft', REM ? JSON.stringify(REM) : null); }
async function loadReorg(){
  if(!URL_ || !KEY || RE_LOADING) return;
  RE_LOADING = true; RE_ERR = ''; if(/^reorg/.test(VIEW.screen)) render();
  try {
    const d = await api({ action:'getReorg', location: RE_LOC, days: 14 });
    if(!d || !d.success) throw new Error((d && d.error) || 'Réponse invalide');
    // the Sheet may hand the day back as a full date (« Sat Oct 31 2026 00:00:00 GMT-0700 ») — bring it back to 2026-10-31
    (d.marks || []).forEach(m => { if(!/^\d{4}-\d{2}-\d{2}$/.test(String(m.day))){ const t = Date.parse(m.day); m.day = isNaN(t) ? String(m.day).slice(0, 10) : reDay(t + 12 * 3600e3); } m.order = Number(m.order) || 0; m.total = Number(m.total) || 0; });
    RE = { loc: RE_LOC, marks: d.marks || [], scans: d.scans || [], at: new Date().toISOString() };
    reApplyQueue();
    ls('s1981_reorg', JSON.stringify(RE));
  } catch(e){ RE_ERR = /Invalid|invalide|getReorg/.test(e.message) ? 'Le Sheet ne connaît pas encore la Réorganisation : collez « LATEST - Code GS » et redéployez.' : 'Pas de connexion : données gardées sur ce téléphone.'; }
  RE_LOADING = false; if(/^reorg/.test(VIEW.screen)) render();
}
function reApplyLocal(kind, b){
  if(!RE || RE.loc !== (b.location || RE.loc)) return;
  if(kind === 'reorgmark'){
    const i = RE.marks.findIndex(m => m.id === b.id);
    if(b.delete){ if(i >= 0) RE.marks.splice(i, 1); return; }
    const old = i >= 0 ? RE.marks[i] : null;
    const m = { id: b.id, day: old ? old.day : reDay(b.at || Date.now()), location: b.location, order: b.order, zone: b.zone, spot: b.spot, total: b.total, prints: b.prints, by: b.by || (user && user.name) || '', at: old ? old.at : (b.at || new Date().toISOString()), status: old ? old.status : '', note: old ? old.note : '' };
    if(i >= 0) RE.marks[i] = m; else RE.marks.push(m);
  } else if(kind === 'reorgstatus'){
    const m = RE.marks.find(x => x.id === b.id); if(m){ m.status = b.status; m.note = b.note || ''; }
  }
}
function reApplyQueue(){ QUEUE.filter(o => REORG_ACTIONS[o.kind]).forEach(o => reApplyLocal(o.kind, o.body)); }
function queueReorg(kind, body){
  if(!user){ lock(); return; }
  reApplyLocal(kind, body);
  QUEUE.push({ kind, body, by: user.name, hash: user.hash });
  ls('s1981_queue', JSON.stringify(QUEUE)); if(RE) ls('s1981_reorg', JSON.stringify(RE));
  flushQueue();
}

// S1-1A-2 → that shelf (parseShelf) · B1-BOX3 → that box · B1-? → box to choose
function placeOfLabel(lab){
  const m = /^([SB])([12])-(.+)$/i.exec(String(lab || '')); if(!m) return null;
  if(m[1].toUpperCase() === 'S'){ const sh = parseShelf(lab); return sh && sh.spot ? sh : null; }
  if(m[3] === '?') return null;
  const loc = 'Store ' + m[2], z = boxesOf(loc).find(q => q.c.toLowerCase() === m[3].toLowerCase());
  return z ? { loc, zone: z.c, spot: z.c + '-W', box: true } : null;
}
// ── matching: till zones ↔ shelves noted by the admin ──
function reMatch(day){
  const marks = (RE ? RE.marks : []).filter(m => m.day === day && m.location === RE_LOC).sort((a, b) => (a.order - b.order) || String(a.at).localeCompare(String(b.at)));
  const gm = {};
  (RE ? RE.scans : []).forEach(s => {
    if(reDay(s[0]) !== day) return;
    const k = s[1] + '|' + s[2];
    const g = gm[k] || (gm[k] = { key: k, sess: s[1], z: s[2], t0: s[0], t1: s[0], items: [], by: s[4] || '' });
    if(/^[SB][12]-./i.test(String(s[3]))){ g.label = String(s[3]); return; }   // shelf / box label scanned at the till (7 Nov)
    g.items.push(s[3]); if(s[0] < g.t0) g.t0 = s[0]; if(s[0] > g.t1) g.t1 = s[0];
  });
  Object.keys(gm).forEach(k => { if(!gm[k].items.length) delete gm[k]; });
  const groups = Object.values(gm).sort((a, b) => a.t0 - b.t0);
  groups.forEach((g, i) => { g.n = i + 1; g.keys = new Set(g.items.map(bkey)); });
  const res = marks.map(m => ({ m, g: null, hits: 0, how: '' }));
  const byGroup = {};
  // 1. groups already tied to a shelf (validated / to recount)
  res.forEach(r => { const mm = /^g:(.+)$/.exec(r.m.note || ''); if(mm){ const g = groups.find(x => x.key === mm[1]); if(g && !byGroup[g.key]){ r.g = g; r.how = 'lié'; byGroup[g.key] = r; } } });
  // 1b. groups started with a shelf / box label: tied to that place (existing
  //     mark of the day for it, or a new one made from the label)
  groups.forEach(g => {
    if(byGroup[g.key] || !g.label) return;
    const pl = placeOfLabel(g.label); g.place = pl;
    if(!pl || pl.loc !== RE_LOC) return;
    let r = res.find(x => !x.g && x.m.zone === pl.zone && x.m.spot === pl.spot && x.m.status !== 'Validé');
    if(!r){
      r = { m: { id: 'L' + g.sess.slice(-6) + g.z + String(g.t0).slice(-5), day, location: RE_LOC, order: 1000 + g.n, zone: pl.zone, spot: pl.spot, total: g.items.length, prints: [], status: '', note: '', virtual: true }, g: null, hits: 0, how: '' };
      res.push(r);
    }
    r.g = g; r.how = 'étiquette'; byGroup[g.key] = r;
  });
  // 2. fingerprints
  groups.forEach(g => {
    if(byGroup[g.key]) return;
    let best = null, bestHits = 0, tie = false;
    res.forEach(r => { if(r.g) return; const h = (r.m.prints || []).filter(p => g.keys.has(bkey(p))).length; if(h > bestHits){ best = r; bestHits = h; tie = false; } else if(h && h === bestHits) tie = true; });
    if(best && !tie){ best.g = g; best.hits = bestHits; best.how = 'empreinte'; byGroup[g.key] = best; }
  });
  // 3. order, for what is left (same position between two matched neighbours)
  groups.forEach((g, gi) => {
    if(byGroup[g.key]) return;
    const prev = groups.slice(0, gi).reverse().find(x => byGroup[x.key]), next = groups.slice(gi + 1).find(x => byGroup[x.key]);
    const lo = prev ? res.indexOf(byGroup[prev.key]) : -1, hi = next ? res.indexOf(byGroup[next.key]) : res.length;
    const cand = res.slice(lo + 1, hi).find(r => !r.g);
    if(cand){ cand.g = g; cand.how = 'ordre'; byGroup[g.key] = cand; }
  });
  res.forEach(r => {
    const m = r.m, g = r.g, np = (m.prints || []).length;
    if(r.g && r.how !== 'empreinte') r.hits = (m.prints || []).filter(p => g.keys.has(bkey(p))).length;
    const elsewhere = groups.filter(x => x !== g && (m.prints || []).some(p => x.keys.has(bkey(p)))).map(x => x.n);
    r.scanned = g ? g.items.length : 0;
    if(m.status === 'Validé'){ r.st = 'done'; r.msg = 'Validé'; }
    else if(m.virtual){ r.st = 'ok'; r.msg = (isBox(m.location, m.zone) ? '📦 Boîte' : '🧺 Étagère') + ' scannée avec son étiquette : ' + g.items.length + ' article(s) — vérifiez, puis validez'; }
    else if(!g){ r.st = 'wait'; r.msg = 'Pas encore scanné à la caisse'; }
    else if(elsewhere.length){ r.st = 'bad'; r.msg = 'Mélangé : ses articles repères sont aussi dans la zone caisse n°' + elsewhere.join(', '); }
    else if(np && !r.hits){ r.st = 'bad'; r.msg = 'Aucun article repère trouvé dans la zone caisse n°' + g.n; }
    else if(r.scanned !== m.total){ r.st = 'warn'; r.msg = 'Vous : ' + m.total + ' · caisse : ' + r.scanned + ' (' + (r.scanned > m.total ? '+' : '') + (r.scanned - m.total) + ')'; }
    else if(np && r.hits < np){ r.st = 'warn'; r.msg = 'Total juste, mais ' + (np - r.hits) + ' article(s) repère(s) pas scanné(s)'; }
    else { r.st = 'ok'; r.msg = 'Total juste (' + m.total + ') et articles repères trouvés'; }
    if(m.status === 'À recompter'){ r.st = 'recount'; r.msg = 'À recompter'; }
  });
  const loose = groups.filter(g => !byGroup[g.key]);
  return { res, groups, loose };
}
function reDays(){
  const s = new Set([reToday()]);
  if(RE){ RE.marks.forEach(m => m.location === RE_LOC && s.add(m.day)); RE.scans.forEach(x => s.add(reDay(x[0]))); }
  return [...s].sort().reverse();
}
function reDayLabel(d){ if(d === reToday()) return 'Aujourd’hui'; const t = new Date(d + 'T12:00:00'); return t.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' }); }
const RE_ST = { ok: ['✅', 'var(--ok)'], warn: ['⚠', 'var(--warn)'], bad: ['❌', 'var(--bad)'], wait: ['⏳', 'var(--muted)'], done: ['✔', 'var(--ok)'], recount: ['↺', 'var(--warn)'] };
let RE_SHOW_DONE = false;

  const n = k => res.filter(r => r.st === k).length;
  h += `<div class="stats"><div class="stat"><b class="num">${res.length}</b><span>étagères repérées</span></div><div class="stat"><b class="num">${groups.length}</b><span>zones scannées à la caisse</span></div><div class="stat"><b class="num">${n('done')}</b><span>validées</span></div></div>`;
  const info = reSpotInfo();
  h += `<div class="sect">${VIEW.rz ? '<button class="cbtn alt" data-act="remap" style="margin-right:8px">← Plan</button>' : ''}${day === reToday() ? 'Touchez une zone, puis l’étagère à repérer · ordre n°' + ((res.length ? Math.max(...res.map(r => r.m.order || 0)) : 0) + 1) : 'Plan'}</div>`;
  if(day === reToday() && !VIEW.rz) h += `<button class="go" data-act="rebox" style="margin:0 0 10px">📦 Repérer une boîte</button>`;
  h += VIEW.rz ? reZoneHTML(VIEW.rz, info) : reMapHTML(info);
  // 2 Nov: validated shelves go in a folded section at the bottom, so the
  // list shows only what still needs attention.
  const reTodo = res.filter(r => r.st !== 'done'), reDone = res.filter(r => r.st === 'done');
  const reRow = r => {
    const m = r.m, s = RE_ST[r.st];
    const title = isBox(m.location, m.zone) ? '📦 ' + esc(boxName(m.location, m.zone)) : esc(m.zone) + ' · ' + esc(spotLabelOf(m.location, m.zone, m.spot));
    return `<div class="shelf" style="border-left:4px solid ${s[1]}"><div class="shelfhead"><div style="flex:1;min-width:0"><b style="font-size:15px">${m.virtual ? '🏷' : m.order + '.'} ${title}</b>
      <div style="font-weight:600;font-size:13px;color:${s[1]};margin-top:2px">${s[0]} ${esc(r.msg)}</div>
      <div style="color:var(--muted);font-size:12px;margin-top:2px">${m.virtual ? 'Étiquette scannée à la caisse' : 'Vous : ' + m.total + ' article(s) · ' + (m.prints || []).length + ' repère(s)'}${r.g ? ' · zone caisse n°' + r.g.n + ' (' + r.scanned + ')' : ''}</div></div>
      <div style="display:flex;flex-direction:column;gap:6px">${r.st !== 'done' && r.g ? `<button class="cbtn" data-reval="${esc(m.id)}">${r.st === 'ok' ? '✓ Valider' : 'Voir'}</button>` : ''}
      ${r.st !== 'done' && !m.virtual ? `<button class="cbtn alt" data-reedit="${esc(m.id)}">Modifier</button>` : ''}</div></div></div>`;
  };
  h += '<div class="sect">Étagères à traiter, dans l’ordre du tour' + (res.length ? ' (' + reTodo.length + ')' : '') + '</div>';
  h += res.length ? (reTodo.length ? '<div class="list">' + reTodo.map(reRow).join('') + '</div>' : '<p class="empty">Tout est validé 👍</p>') +
    (reDone.length ? `<button class="cbtn alt" data-act="re-done" style="margin:12px 0 6px;width:100%">${RE_SHOW_DONE ? '▾ Masquer' : '▸ Voir'} les étagères validées (${reDone.length})</button>` +
      (RE_SHOW_DONE ? '<div class="list" style="opacity:.75">' + reDone.map(reRow).join('') + '</div>' : '') : '') : `<p class="empty">${day === reToday() ? 'Aucune étagère repérée aujourd’hui.<br>Commencez par « Repérer l’étagère suivante », dans l’ordre où les chariots partiront.' : 'Rien ce jour-là.'}</p>`;
  if(loose.length) h += '<div class="sect">Zones scannées à la caisse sans étagère</div><div class="list">' + loose.map(g => `<div class="shelf"><div class="shelfhead"><div style="flex:1;min-width:0"><b style="font-size:15px">${g.label && /-\?$/.test(g.label) ? '📦 Boîte à choisir' : 'Zone caisse n°' + g.n} · ${g.items.length} article(s)</b><div style="color:var(--muted);font-size:12px;margin-top:2px">${new Date(g.t0).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' })}–${new Date(g.t1).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' })}${g.by ? ' · ' + esc(g.by) : ''}${g.label && /-\?$/.test(g.label) ? '' : ' — aucun article repère ne correspond'}</div></div><button class="cbtn" data-relink="${esc(g.key)}">${g.label && /-\?$/.test(g.label) ? 'Choisir la boîte' : 'Choisir l’étagère'}</button></div></div>`).join('') + '</div>';
  return h;
}
function bindReorg(){
  document.querySelectorAll('[data-reloc]').forEach(b => b.onclick = () => { RE_LOC = b.dataset.reloc; ls('s1981_reorg_loc', RE_LOC); RE = null; RE_DAY = ''; render(); loadReorg(); });
  document.querySelectorAll('[data-reday]').forEach(b => b.onclick = () => { RE_DAY = b.dataset.reday === reToday() ? '' : b.dataset.reday; render(); });
  const rl = document.querySelector('[data-act="reload-re"]'); if(rl) rl.onclick = loadReorg;
  const rd = document.querySelector('[data-act="re-done"]'); if(rd) rd.onclick = () => { RE_SHOW_DONE = !RE_SHOW_DONE; render(); };
  const rbx = document.querySelector('[data-act="rebox"]'); if(rbx) rbx.onclick = reBoxPick;
  document.querySelectorAll('[data-rmz]').forEach(b => { b.onclick = () => { VIEW.rz = b.dataset.rmz; history.pushState(VIEW, ''); render(); }; b.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); b.onclick(); } }; });
  const rp = document.querySelector('[data-act="remap"]'); if(rp) rp.onclick = () => history.back();
  document.querySelectorAll('[data-rsp]').forEach(b => b.onclick = () => reTapSpot(VIEW.rz, b.dataset.rsp));
  const im = document.querySelector('.pzone .pwrap img'); if(im && im.complete && im.naturalWidth) photoLoaded(im);
  document.querySelectorAll('[data-reedit]').forEach(b => b.onclick = () => reEdit(b.dataset.reedit));
  document.querySelectorAll('[data-reval]').forEach(b => b.onclick = () => reValidate(b.dataset.reval));
  document.querySelectorAll('[data-relink]').forEach(b => b.onclick = () => reLink(b.dataset.relink));
}
// A till zone that matched nothing (or a « 📦 Nouvelle boîte » without label):
// the admin says which box / shelf it was → a mark tied to it, then ✓ Valider.
function reLink(key){
  const day = RE_DAY || reToday(), { groups } = reMatch(day), g = groups.find(x => x.key === key); if(!g) return;
  const bx = boxesOf(RE_LOC), zs = zoneList(RE_LOC).filter(z => !z.b && z.c !== UNPLACED);
  const tie = (zone, spot) => {
    if(!user){ closeSheet(); lock(); return; }
    const id = rid('m');
    queueReorg('reorgmark', { id, location: RE_LOC, order: 1000 + g.n, zone, spot, total: g.items.length, prints: [], at: new Date(g.t0).toISOString(), by: user.name, note: 'g:' + g.key });
    closeSheet(); render(); setTimeout(() => reValidate(id), 80);
  };
  openSheet(`<h3>Zone caisse n°${g.n} · ${g.items.length} article(s)</h3><div class="sub">C’était quelle boîte ou quelle étagère ?</div>
    <div class="sect">📦 Boîtes</div><div class="chips">${bx.map(z => `<button data-lb="${esc(z.c)}">${esc(z.k || z.c)}</button>`).join('')}<button data-lbnew="1">＋ Nouvelle boîte</button></div>
    <div class="sect">🧺 Étagères</div><div class="chips">${zs.map(z => `<button data-lz="${esc(z.c)}">${esc(z.c)}</button>`).join('')}</div>
    <button class="ghost" id="lkx">Annuler</button>`);
  $('#lkx').onclick = closeSheet;
  document.querySelectorAll('[data-lb]').forEach(b => b.onclick = () => tie(b.dataset.lb, b.dataset.lb + '-W'));
  const lbn = document.querySelector('[data-lbnew]'); if(lbn) lbn.onclick = () => reNewBox(code => tie(code, code + '-W'));
  document.querySelectorAll('[data-lz]').forEach(b => b.onclick = () => {
    const z = zs.find(q => q.c === b.dataset.lz), sp = zoneSpots(z);
    if(sp.length <= 1) return tie(z.c, sp.length ? sp[0].code : z.c + '-W');
    openSheet(`<h3>Quelle étagère ?</h3><div class="sub">Zone ${esc(z.c)}</div><div class="chips">${sp.map(x => `<button data-ls="${esc(x.code)}">${esc(x.label)}</button>`).join('')}</div>`);
    document.querySelectorAll('[data-ls]').forEach(x => x.onclick = () => tie(z.c, x.dataset.ls));
  });
}
// ── 🗺 map + zone photo for the Réorganisation (31 Oct 2026) ──
// state per shelf: validated (any day) / noted on the chosen day + its match result
function reSpotInfo(){
  const info = {};
  (RE ? RE.marks : []).filter(m => m.location === RE_LOC && m.status === 'Validé').forEach(m => { info[m.spot] = { done: true, m }; });
  reMatch(RE_DAY || reToday()).res.forEach(r => { info[r.m.spot] = Object.assign(info[r.m.spot] || {}, { r, done: r.st === 'done' || (info[r.m.spot] || {}).done }); });
  return info;
}
const RE_BOX = { ok: 'r-ok', warn: 'r-warn', bad: 'r-bad', wait: 'r-wait', recount: 'r-warn', done: 'r-done' };
function reZoneState(zone, info){
  const z = zoneList(RE_LOC).find(q => q.c === zone) || { c: zone, s: '' };
  const sp = zoneSpots(z), codes = sp.length ? sp.map(s => s.code) : [zone + '-W'];
  const got = codes.filter(c => info[c]);
  if(!got.length) return '';
  return got.length === codes.length && got.every(c => info[c].done) ? 'rdone' : 'rpart';
}
function reMapHTML(info){
  const M = MAPS[RE_LOC];

    const st = reZoneState(c, info), small = w < 50 || ht < 34;
    const n = Object.keys(info).filter(k => (info[k].m || (info[k].r && info[k].r.m) || {}).zone === c).length;
    return `<g class="mz ${st}" data-rmz="${esc(c)}" tabindex="0" role="button" aria-label="Zone ${esc(c)}"><rect x="${x}" y="${y}" width="${w}" height="${ht}"/>`
      + (small ? `<text x="${x + w / 2}" y="${y + ht / 2}">${esc(c)}</text>`
               : `<text x="${x + w / 2}" y="${y + ht / 2 - 7}">${esc(c)}</text><text class="n" x="${x + w / 2}" y="${y + ht / 2 + 8}">${n ? n + ' ét.' : '—'}</text>`) + '</g>';
  }).join('') + `</svg></div><div class="legend"><span>Touchez une zone.</span><span><i></i>Rien de noté</span><span><i class="rpart"></i>En cours</span><span><i class="rdone"></i>Tout validé</span></div>`;
}
function reZoneHTML(zone, info){
  const z = zoneList(RE_LOC).find(q => q.c === zone) || { c: zone, k: '', s: '' };
  const spots = zoneSpots(z);
  const list = spots.length ? spots : [{ code: zone + '-W', label: 'Toute la zone' }];
  const src = photoFor(RE_LOC, zone), t = traceFor(RE_LOC, zone);
  const lab = s => { const i = info[s.code]; if(!i) return ''; if(i.done && !(i.r && i.r.st !== 'done')) return '✔'; return i.r ? (RE_ST[i.r.st][0] === '⏳' ? 'n°' + i.r.m.order : RE_ST[i.r.st][0]) : ''; };
  const cls = s => { const i = info[s.code]; if(!i) return 'todo'; if(i.r) return RE_BOX[i.r.st]; return i.done ? 'r-done' : 'todo'; };
  let h = `<div class="zhead" style="margin-top:4px"><h2>${esc(zone)}</h2><p>${esc(z.k || z.g || '')}</p></div>`;
  if(src && t && spots.length){
    h += `<div class="pzone"><div class="pwrap" data-pw="${t.pw}" data-ph="${t.ph}"><img src="${src}" alt="Photo de la zone ${esc(zone)}" onload="photoLoaded(this)" onerror="this.closest('.pzone').classList.add('nophoto')">`
      + spots.filter(s => t.spots[s.code]).map(s => { const [x, y, w, hh] = t.spots[s.code]; const l = lab(s);
        return `<button class="pbox ${cls(s)}" data-rsp="${esc(s.code)}" style="left:${x}%;top:${y}%;width:${w}%;height:${hh}%" aria-label="${esc(s.label)}"><span class="pt">${esc(s.code.slice(zone.length + 1))}</span>${l ? `<span class="pn">${esc(l)}</span>` : ''}</button>`; }).join('')
      + `</div><div class="plegend"><span><i class="todo"></i>pas notée</span><span><i class="r-wait"></i>notée, attend la caisse</span><span><i class="r-warn"></i>à voir</span><span><i class="r-ok"></i>prête / validée</span></div></div>`;
  }
  h += '<div class="chips" style="margin-top:10px">' + list.map(s => { const l = lab(s); return `<button data-rsp="${esc(s.code)}" class="rchip ${cls(s)}">${esc(s.label)}${l ? ' · ' + esc(l) : ''}</button>`; }).join('') + '</div>';
  return h;
}
function reTapSpot(zone, code){
  const i = reSpotInfo()[code];
  if(i && i.r && i.r.st !== 'done'){ if(i.r.g) return reValidate(i.r.m.id); return reEdit(i.r.m.id); }
  if(i && i.done){ toast('Étagère déjà validée' + (i.m ? ' le ' + reDayLabel(i.m.day) : '')); return; }
  if(RE_DAY && RE_DAY !== reToday()){ toast('Revenez sur « Aujourd’hui » pour noter une étagère.'); return; }
  reStartMark(zone, code);
}

function reStartMark(zone, spot){

}

function bindReorgMark(){
  const inp = $('#scan'); if(!inp) return;
  inp.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); rePrint(inp.value); inp.value = ''; } };
  $('#camb').onclick = openCamera;
  // total: wheel, − / + and jumps — all by touch, so a Bluetooth scanner can stay connected
  const tot = $('#rtot'), wh = $('#rwheel'), RW = 48;
  let whT = null, whSilent = false;
  const setTot = (v, fromWheel) => {
    if(!REM || !document.body.contains(tot)) return;
    v = Math.max(0, Math.min(999, Math.round(Number(v) || 0)));
    REM.total = String(v); tot.value = v; reSaveDraft();
    if(!fromWheel && v <= 300){ whSilent = true; wh.scrollTo({ top: v * RW, behavior: 'smooth' }); setTimeout(() => { whSilent = false; }, 450); }
  };
  if(REM.total !== '') wh.scrollTop = (Number(REM.total) || 0) * RW;
  wh.onscroll = () => { if(whSilent) return; clearTimeout(whT); whT = setTimeout(() => setTot(Math.round(wh.scrollTop / RW), true), 90); };
  tot.oninput = () => { REM.total = tot.value; reSaveDraft(); const v = Number(tot.value); if(v >= 0 && v <= 300){ whSilent = true; wh.scrollTop = v * RW; setTimeout(() => { whSilent = false; }, 200); } };
  document.querySelectorAll('[data-rt]').forEach(b => b.onclick = () => setTot((Number(REM.total) || 0) + Number(b.dataset.rt)));
  document.querySelectorAll('[data-ro]').forEach(b => b.onclick = () => { REM.order = Math.max(1, (Number(REM.order) || 1) + Number(b.dataset.ro)); $('#rordv').textContent = REM.order; reSaveDraft(); });
  document.querySelectorAll('[data-rpx]').forEach(b => b.onclick = () => { REM.prints.splice(+b.dataset.rpx, 1); reSaveDraft(); render(); });
  $('#rquit').onclick = () => { REM = null; reSaveDraft(); history.back(); };
  const del = $('#rdel'); if(del) del.onclick = () => { if(!confirm('Supprimer ce repérage ?')) return; queueReorg('reorgmark', { id: REM.id, location: REM.loc, delete: true }); REM = null; reSaveDraft(); history.back(); };
  $('#rsave').onclick = reSaveMark;
  setTimeout(() => { if($('#sheet').hidden && document.activeElement !== $('#rtot')) inp.focus({ preventScroll: true }); }, 30);
}
function rePrint(raw){
  const code = aliasOf(raw);
  if(!code) return;
  if(!/^\d{4,14}$/.test(code)){ beep(false); toast(code.length > 14 && /^\d+$/.test(code) ? 'Lecture double — rescannez l’article une fois.' : 'Code illisible : vérifiez la langue du clavier, puis rescannez.'); return; }
  const k = bkey(code);
  if(REM.prints.some(p => bkey(p) === k)){ beep(false); toast('Déjà scanné — prenez un autre article.'); return; }
  const other = (RE ? RE.marks : []).find(m => m.id !== REM.id && m.location === REM.loc && m.day === reToday() && m.status !== 'Validé' && m.status !== 'À recompter' && (m.prints || []).some(p => bkey(p) === k));
  if(other){ beep(false); toast('Cet article repère déjà l’étagère ' + other.zone + ' · ' + spotLabelOf(other.location, other.zone, other.spot) + ' — prenez-en un autre.'); return; }
  if(REM.prints.length >= 5){ toast('3 articles repères suffisent.'); return; }
  REM.prints.push(code); beep(true); reSaveDraft(); render();
  if(REM.prints.length >= 3) setTimeout(() => { const w = $('#rwheel'); if(w) w.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
}
function reSaveMark(){
  const tot = Math.round(Number(REM.total));
  if(!REM.prints.length){ toast('Scannez au moins 1 article repère (2 ou 3 c’est mieux).'); return; }
  if(!(tot >= 0) || String(REM.total).trim() === ''){ toast('Choisissez le total compté sur l’étagère (roue ou + / −).'); const w = $('#rwheel'); if(w) w.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if(tot < REM.prints.length){ toast('Le total ne peut pas être plus petit que le nombre d’articles repères.'); return; }
  queueReorg('reorgmark', { id: REM.id, location: REM.loc, order: REM.order, zone: REM.zone, spot: REM.spot, total: tot, prints: REM.prints, at: REM.at || new Date().toISOString(), by: user ? user.name : '' });
  toast('Étagère ' + REM.zone + ' notée (ordre n°' + REM.order + ')');
  REM = null; reSaveDraft(); history.back();
}
// ── validation: becomes an ordinary shelf count (stock1981Count) ──
function reValidate(id){
  const { res } = reMatch(RE_DAY || reToday());
  const r = res.find(x => x.m.id === id); if(!r || !r.g) return;
  const m = r.m, g = r.g, agg = {};
  g.items.forEach(b => { const k = bkey(b); (agg[k] = agg[k] || { barcode: b, name: productName(b) || '', count: 0 }).count++; });
  const items = Object.values(agg).sort((a, b) => b.count - a.count);
  const unknown = items.filter(it => !it.name).length, s = RE_ST[r.st];
  openSheet(`<h3>${isBox(m.location, m.zone) ? '📦 ' + esc(boxName(m.location, m.zone)) : esc(m.zone) + ' · ' + esc(spotLabelOf(m.location, m.zone, m.spot))}</h3>
    <div class="sub" style="color:${s[1]};font-weight:700">${s[0]} ${esc(r.msg)}</div>
    <div class="where">${m.virtual ? '' : `<div class="here"><span>Vous avez compté</span><b class="num">${m.total}</b></div>`}<div class="here"><span>Scanné à la caisse (zone n°${g.n})</span><b class="num">${g.items.length}</b></div></div>
    <ul style="margin:10px 0;max-height:34vh;overflow:auto;padding:0;list-style:none">${items.map(it => `<li style="display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px solid var(--line)"><span>${esc(it.name || 'Inconnu · ' + it.barcode)}${(m.prints || []).some(p => bkey(p) === bkey(it.barcode)) ? ' 📍' : ''}</span><b>${it.count}</b></li>`).join('')}</ul>
    ${unknown ? `<div class="sub">${unknown} code(s) inconnu(s) : ils seront enregistrés sans nom — nommez-les ensuite dans 📷 Photos produits.</div>` : ''}
    <div class="sub">✓ Valider remplace ce qui était enregistré pour cette étagère par ce qui a été scanné.</div>

async function loadArrivals(){

  } catch(e){

function arrival(id){ return ARR && ARR.arrivals ? ARR.arrivals.find(a => a.id === id) : null; }
// Pending (not yet sent) arrivals / coolers / dates are shown at once.
function applyRecvLocal(o){
  if(!ARR) ARR = { arrivals: [], noExpiry: [] };
  const b = o.body;
  if(o.kind === 'recvarr'){
    if(!arrival(b.id)) ARR.arrivals.unshift({ id: b.id, name: b.name, created: new Date().toLocaleDateString('fr-FR'), status:'open', by: o.by, units: [], lines: [], pending: true });
    return;
  }
  if(o.kind === 'recvunit'){
    let a = arrival(b.arrivalId);
    if(!a){ a = { id: b.arrivalId, name: b.arrivalName, created:'', status:'open', by: o.by, units: [], lines: [] }; ARR.arrivals.unshift(a); }
    if(a.units.some(u => u.opId === b.opId)) return;
    const units = b.lines.reduce((s, l) => s + l.qty, 0);
    a.units.push({ unit: b.unit, kind: b.kind, cooler: b.cooler ? (b.cooler.name || b.cooler.barcode) : '', products: new Set(b.lines.map(l => bkey(l.barcode))).size, units, by: o.by, at: 'en attente', opId: b.opId, pending: true });
    b.lines.forEach(l => a.lines.push([l.lineId, b.unit, l.barcode, l.name, l.qty, l.mode, l.expiry || '', l.solde ? 1 : 0, priceOf(l.barcode)]));
    return;
  }
  if(o.kind === 'recvdate'){
    (ARR.arrivals || []).forEach(a => a.lines.forEach(l => { if(l[0] === b.lineId && l[5] === 'later'){ l[5] = b.mode; l[6] = b.expiry || ''; } }));
  }
}

// ── dates ───────────────────────────────────────────────
// "0327" → 31/03/2027 (end of month) · "150327" → 15/03/2027
function parseExp(digits){
  const d = String(digits || '');
  let day = null, m, y;
  if(d.length === 4){ m = +d.slice(0, 2); y = 2000 + +d.slice(2); }
  else if(d.length === 6){ day = +d.slice(0, 2); m = +d.slice(2, 4); y = 2000 + +d.slice(4); }
  else return null;
  if(m < 1 || m > 12) return null;
  const last = new Date(y, m, 0).getDate();
  if(day != null && (day < 1 || day > last)) return null;
  const dd = day == null ? last : day;
  return { date: new Date(y, m - 1, dd), str: String(dd).padStart(2, '0') + '/' + String(m).padStart(2, '0') + '/' + y, short: (day == null ? '' : String(dd).padStart(2, '0') + '/') + String(m).padStart(2, '0') + '/' + String(y).slice(2) };
}
function expDate(str){ const m = String(str || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; }
function monthsLeft(d){ return (d - new Date()) / (30.44 * 864e5); }
function expLevel(str){
  const d = expDate(str); if(!d) return '';
  const ml = monthsLeft(d);
  return ml < 0 ? 'past' : ml <= 3 ? 'red' : ml <= 6 ? 'orange' : ml > 60 ? 'far' : 'ok';
}
function expBadge(l){
  if(l.mode === 'none') return '<span class="xb">∞ ne périme pas</span>';
  if(l.mode === 'later' || !l.expiry) return '<span class="xb later">⏭ date plus tard</span>';
  const lv = expLevel(l.expiry);
  return `<span class="xb ${lv}">📅 ${esc(l.expiry.slice(3))}${lv === 'past' ? ' · périmé' : lv === 'red' ? ' · < 3 mois' : lv === 'orange' ? ' · < 6 mois' : ''}${l.solde ? ' · solde' : ''}</span>`;
}
// The date panel. cb({mode, expiry, solde}) — on-screen keys only, so a
// scanner gun can't type into it by mistake.
function openDatePanel(name, bc, cur, cb, opts){
  let digits = '', solde = cur && cur.solde ? true : null, mode = 'date';
  const draw = () => {
    const p = parseExp(digits);
    const lv = p ? expLevel(p.str) : '';
    if(solde === null && (lv === 'past' || lv === 'red')) solde = true;
    const shown = digits.length <= 4 ? (digits.padEnd(4, '·').replace(/^(..)(..)$/, '$1 / $2')) : digits.padEnd(6, '·').replace(/^(..)(..)(..)$/, '$1 / $2 / $3');
    const warn = !p ? (digits.length === 4 || digits.length === 6 ? '<div class="err">Date impossible : vérifiez le mois' + (digits.length === 6 ? ' et le jour' : '') + '.</div>' : '')
      : lv === 'past' ? '<div class="xwarn red">⚠ Déjà périmé !</div>'
      : lv === 'red' ? '<div class="xwarn red">⚠ Périme dans moins de 3 mois</div>'
      : lv === 'orange' ? '<div class="xwarn orange">Périme dans moins de 6 mois</div>'
      : lv === 'far' ? '<div class="xwarn orange">Plus de 5 ans : vérifiez l’année</div>' : '';
    openSheet(`<h3>${esc(name || 'Produit inconnu')}</h3><div class="sub num">${esc(bc)}${opts && opts.sub ? ' · ' + esc(opts.sub) : ''}</div>
      <div class="xopts"><button data-xm="none">∞<span>Ne périme pas</span></button><button data-xm="later">⏭<span>Plus tard</span></button></div>
      <label class="f">Date de péremption : mois + année${digits.length > 4 ? ' (avec le jour)' : ''}</label>
      <div class="xdisp num ${lv}">${shown}</div>
      <div class="xhint">${p ? '= ' + esc(p.str) + (digits.length === 4 ? ' (fin du mois)' : '') : 'Ex. 0 3 2 7 = mars 2027 · avec le jour : 1 5 0 3 2 7'}</div>
      ${warn}
      ${p && (lv === 'past' || lv === 'red' || lv === 'orange') ? `<label class="chk"><input type="checkbox" id="xsol" ${solde ? 'checked' : ''}> À mettre en solde (vendre en priorité)</label>` : ''}
      <div class="pad xpad">${['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(k => `<button data-k="${k}" ${k === 'OK' && !p ? 'disabled' : ''}>${k}</button>`).join('')}</div>
      ${opts && opts.cancel ? '<button class="ghost" id="xcancel">Annuler</button>' : ''}`);
    const sh = $('#sheet');
    sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if(k === '⌫') digits = digits.slice(0, -1);
      else if(k === 'OK'){ const q = parseExp(digits); if(!q) return; const lv2 = expLevel(q.str); closeSheet(); cb({ mode:'date', expiry: q.str, solde: (lv2 === 'past' || lv2 === 'red' || lv2 === 'orange') && !!solde }); return; }
      else if(digits.length < 6) digits += k;
      draw();
    });
    sh.querySelectorAll('[data-xm]').forEach(b => b.onclick = () => { closeSheet(); cb({ mode: b.dataset.xm, expiry:'', solde:false }); });
    const so = $('#xsol'); if(so) so.onchange = e => { solde = e.target.checked; };
    const xc = $('#xcancel'); if(xc) xc.onclick = closeSheet;
  };
  draw();
}

  if(forProduct !== false) (RDATES[R.aid] = RDATES[R.aid] || {})[bkey(l.barcode)] = r;
  saveDates(); saveRecv(); render();
}
function recvScan(raw){
  if(!R) return;
  const code = aliasOf(raw);
  if(!code) return;
  if(!/^\d{4,20}$/.test(code)){ beep(false); toast('Code illisible : vérifiez la langue du clavier (chiffres seulement), puis rescannez.'); return; }
  if(!$('#sheet').hidden){ beep(false); toast('Répondez d’abord à la date du produit précédent.'); return; }
  const k = bkey(code);
  let i = R.lines.findIndex(l => bkey(l.barcode) === k && l.active);
  if(i >= 0){ const l = R.lines.splice(i, 1)[0]; l.qty++; R.lines.unshift(l); R.flash = true; beep(true); saveRecv(); render(); return; }
  const kd = knownDate(k);
  const l = { barcode: code, name: productName(code), qty: 1, mode: kd ? kd.mode : 'later', expiry: kd ? kd.expiry : '', solde: kd ? !!kd.solde : false, active: true };
  R.lines.unshift(l); R.flash = true; beep(true); saveRecv(); render();
  if(!kd) openDatePanel(l.name, code, null, r => setLineDate(R.lines.indexOf(l), r));
}
function bindUnit(){
  const inp = $('#scan'); if(!inp) return;
  R.flash = false;
  const focus = () => { if(!document.querySelector('[data-rname]:focus') && $('#sheet').hidden) inp.focus({ preventScroll: true }); };
  inp.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); recvScan(inp.value); inp.value = ''; } };
  $('#camb').onclick = openCamera;
  document.querySelectorAll('[data-rinc]').forEach(b => b.onclick = () => { R.lines[+b.dataset.rinc].qty++; saveRecv(); render(); });
  document.querySelectorAll('[data-rdec]').forEach(b => b.onclick = () => { const l = R.lines[+b.dataset.rdec]; l.qty--; if(l.qty <= 0) R.lines.splice(+b.dataset.rdec, 1); saveRecv(); render(); });
  document.querySelectorAll('[data-rname]').forEach(x => {
    x.onclick = e => e.stopPropagation();
    x.oninput = () => { R.lines[+x.dataset.rname].pendingName = x.value; saveRecv(); };
    const done = () => { const v = x.value.trim(); if(!v) return; const k = bkey(R.lines[+x.dataset.rname].barcode); R.lines.forEach(l => { if(bkey(l.barcode) === k){ l.name = v; delete l.pendingName; } }); saveRecv(); render(); };
    x.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); done(); } };
    x.onblur = done;
  });
  document.querySelectorAll('[data-line]').forEach(el => el.onclick = () => openLineSheet(+el.dataset.line));
  $('#rquit').onclick = () => {
    if(!R.lines.length){ R = null; saveRecv(); history.back(); return; }
    openSheet(`<h3>Annuler cette ${esc(R.kind.toLowerCase())} ?</h3><div class="sub">${R.lines.length} ligne(s) scannée(s) seront perdues.</div><button class="go" id="rq1" style="background:var(--bad)">Oui, annuler</button><button class="ghost" id="rq0">Continuer</button>`);
    $('#rq1').onclick = () => { R = null; saveRecv(); closeSheet(); history.back(); };
    $('#rq0').onclick = closeSheet;
  };
  $('#rsend').onclick = finishUnit;
  setTimeout(focus, 30);
}
function openLineSheet(i){
  const l = R.lines[i]; if(!l) return;
  openSheet(`<h3>${esc(l.name || 'Produit inconnu')}</h3><div class="sub num">${esc(l.barcode)} · ${l.qty} article(s)</div><div style="margin:10px 0">${expBadge(l)}</div>
    <button class="go" id="lchg">Changer la date de cette ligne</button>
    <button class="go" id="lsplit" style="background:var(--ink);color:var(--bg)">Autre date pour les prochains scans</button>
    <div class="sub" style="margin-top:6px">« Autre date » : les articles déjà scannés gardent leur date ; les suivants iront sur une nouvelle ligne avec l’autre date.</div>
    <button class="ghost" id="lx">Fermer</button>`);
  $('#lx').onclick = closeSheet;
  $('#lchg').onclick = () => { closeSheet(); openDatePanel(l.name, l.barcode, l, r => setLineDate(R.lines.indexOf(l), r), { cancel: true }); };
  $('#lsplit').onclick = () => {
    closeSheet();
    openDatePanel(l.name, l.barcode, null, r => {
      const k = bkey(l.barcode);
      R.lines.forEach(x => { if(bkey(x.barcode) === k) x.active = false; });
      const nl = { barcode: l.barcode, name: l.name, qty: 0, mode: r.mode, expiry: r.expiry, solde: r.solde, active: true };
      R.lines.unshift(nl); saveRecv(); render(); toast('Scannez maintenant les articles avec cette date');
    }, { cancel: true, sub: 'nouvelle date' });
  };
}
function finishUnit(){
  R.lines = R.lines.filter(l => l.qty > 0);
  R.lines.forEach(l => { if(!l.name && l.pendingName && l.pendingName.trim()){ l.name = l.pendingName.trim(); delete l.pendingName; } });
  if(R.lines.some(l => !l.name)){ toast('Donnez un nom à chaque produit inconnu avant de terminer.'); render(); const x = document.querySelector('[data-rname]'); if(x) x.focus(); return; }
  const n = R.lines.reduce((a, l) => a + l.qty, 0);
  const prods = new Set(R.lines.map(l => bkey(l.barcode))).size;
  const c = { date: 0, none: 0, later: 0 };
  R.lines.forEach(l => { c[l.mode === 'date' && l.expiry ? 'date' : l.mode === 'none' ? 'none' : 'later']++; });
  const isCooler = R.kind === 'Glacière';
  let sell = isCooler, cbc = '', cname = '';
  const draw = err => {
    openSheet(`<h3>Terminer ${esc(R.kind.toLowerCase())} ${esc(R.unit)} ?</h3><div class="sub">${esc(R.aname)}</div>
      <div class="where"><div class="here"><span>${prods} produit(s)</span><b class="num">${fmt(n)} article(s)</b></div>
      <div><span>📅 avec date</span><b>${c.date}</b></div><div><span>∞ ne périme pas</span><b>${c.none}</b></div><div><span>⏭ date plus tard</span><b>${c.later}</b></div></div>
      ${isCooler ? `<label class="chk"><input type="checkbox" id="fsell" ${sell ? 'checked' : ''}> La glacière vide est à vendre (elle entre dans le stock de l’Entrepôt)</label>
      ${sell ? `<label class="f" for="fcb">Code-barres de la glacière</label><input class="t num" id="fcb" inputmode="numeric" autocomplete="off" value="${esc(cbc)}" placeholder="Scannez le code de la glacière">
      ${cbc && !productName(cbc) ? `<label class="f" for="fcn">Nom de cette glacière (nouveau produit)</label><input class="t" id="fcn" value="${esc(cname)}" placeholder="ex. Glacière Igloo 48 L">` : cbc ? `<div class="sub">${esc(productName(cbc))}</div>` : '<div class="sub">Sans code-barres ? Laissez vide : ajoutez-la plus tard avec ＋ dans l’Entrepôt une fois l’étiquette imprimée.</div>'}` : ''}` : ''}
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
      <button class="go" id="fok">Envoyer</button><button class="ghost" id="fno">Revenir</button>`);
    $('#fno').onclick = closeSheet;
    const fs = $('#fsell'); if(fs) fs.onchange = e => { sell = e.target.checked; draw(); };
    const fb = $('#fcb'); if(fb){ fb.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); cbc = aliasOf(fb.value.trim()); draw(); } }; fb.onchange = () => { cbc = aliasOf(fb.value.trim()); draw(); }; if(!cbc) fb.focus(); }
    const fn = $('#fcn'); if(fn) fn.oninput = () => { cname = fn.value; };
    $('#fok').onclick = () => {
      if(fb) cbc = aliasOf(fb.value.trim());
      if(fn) cname = fn.value.trim();
      if(cbc && !/^\d{4,20}$/.test(cbc)) return draw('Code de glacière illisible (chiffres seulement).');
      if(sell && cbc && !productName(cbc) && !cname) return draw('Donnez un nom à cette glacière.');
      if(!user){ closeSheet(); lock(); return; }
      const opId = rid('r');
      const body = { opId, arrivalId: R.aid, arrivalName: R.aname, unit: R.unit, kind: R.kind,
        cooler: sell && cbc ? { barcode: cbc, name: productName(cbc) || cname } : null,
        lines: R.lines.map((l, i) => ({ lineId: opId + '-' + i, barcode: l.barcode, name: l.name, qty: l.qty, mode: l.mode === 'date' && !l.expiry ? 'later' : l.mode, expiry: l.expiry || '', solde: !!l.solde })) };
      const aid = R.aid, label = R.kind + ' ' + R.unit;
      R = null; saveRecv(); closeSheet();
      queueRecv('recvunit', body, label + ' enregistrée · ' + fmt(n) + ' article(s) dans l’Entrepôt');
      VIEW = { screen:'arrival', aid }; history.replaceState(VIEW, ''); render();
    };
  };
  draw();
}

function spotState(loc, zone, code){

// ══════════════════════════════════════════════════════════════════
//  📊 MAINTENANT (6 Nov 2026) — what is on each shelf now ≈ its last count
//  minus the till's sales (and transfers out) since that count. A product on
//  several shelves: sales are taken from the shelf that has the most
//  left (among shelves counted before the sale); a return goes back to the
//  biggest shelf. Sales come from getSorties (14 days), already used by
//  Sorties / Réassort. Colours: ≤ 25 % left red, ≤ 50 % orange, else green.
// ══════════════════════════════════════════════════════════════════
let NOW_ON = ls('s1981_now') === '1', _nowC = {};
function _spotT(v){ if(!v) return 0; const sv = String(v); const t = /^\d{4}-\d{2}-\d{2}$/.test(sv) ? new Date(sv + 'T00:00:00').getTime() : new Date(sv).getTime(); return isNaN(t) ? 0 : t; }
function nowMap(loc){
  const c = SOR[loc]; if(!c || !DATA) return null;
  const key = c.at + '|' + (DATA.spots || []).length + '|' + (DATA.spots || []).reduce((a, r) => r[0] === loc && String(r[6]) > a ? String(r[6]) : a, '') + '|' + (DATA.generatedAt || '');
  if(_nowC[loc] && _nowC[loc].key === key) return _nowC[loc].map;
  const byP = {}, map = {};
  (DATA.spots || []).forEach(r => {
    if(r[0] !== loc) return;
    const q = Number(r[5]) || 0, e = { counted: q, left: q, sold: 0, t: _spotT(r[6]) };
    map[r[1] + '|' + r[2] + '|' + bkey(r[3])] = e;
    (byP[bkey(r[3])] = byP[bkey(r[3])] || []).push(e);
  });
  const ev = (c.sales || []).map(x => [x[0], Number(x[2]) || 0, x[3]])
    .concat((c.moves || []).filter(m => m.fromLoc === loc && m.toLoc !== loc).map(m => [bkey(m.bc), Number(m.qty) || 0, sorMoveT(m)]))
    .sort((a, b) => a[2] - b[2]);

    const L = (byP[bk] || []).filter(e => e.t && e.t <= t); if(!L.length || !q) return;
    if(q < 0){ const e = L.reduce((a, b) => b.counted > a.counted ? b : a); e.left = Math.min(e.counted, e.left - q); e.sold += q; return; }

function meShapeParts(s){ const o = parseShape(s); const uni = o.rows.length && o.rows.every(r => r === o.rows[0]); return { o, levels: o.rows.length, per: uni ? o.rows[0] : 0 }; }

function mePoint(ev){ const svg = $('#me-svg'), pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }

    const i = h ? ME.sel : +g.dataset.mi;
    // on a phone, a first touch only selects (the plan can still be scrolled); once something is selected, it can be dragged

    if(i !== ME.sel){ ME.sel = i; meDraw(); }

    else if(it.t === 'line'){ it.w = meSnap(d.ow + dx); it.h = meSnap(d.oh + dy); }

  field('me-sale', x => { it.sale = x.checked; });

    mePush();
    const o = parseShape(it.s), d = +b.dataset.d, k = b.dataset.ms;

function meAction(a){
  const it = ME.sel >= 0 ? ME.items[ME.sel] : null;
  const c = $('#me-canvas'), cx = c ? (c.scrollLeft + c.clientWidth / 2) / ME.zoom : ME.vw / 2, cy = c ? (c.scrollTop + Math.min(c.clientHeight, 400) / 2) / ME.zoom : ME.vh / 2;

  if(a === 'undo'){ if(ME.undo.length){ ME.items = JSON.parse(ME.undo.pop()); ME.sel = -1; ME.dirty = true; meDraw(); } return; }
  if(a === 'zo' || a === 'zi'){ ME.zoom = Math.max(0.3, Math.min(3, ME.zoom * (a === 'zi' ? 1.25 : 0.8))); meDraw(); return; }
  if(a === 'addz'){
    let n = 1, code; do { code = 'Z' + n++; } while(ME.items.some(o => o.t === 'zone' && o.code === code));
    mePush(); ME.items.push({ t:'zone', code, x: meSnap(cx - 40), y: meSnap(cy - 25), w: 80, h: 50, k:'', g:'', s:'1,1,1,1', sale:false });

  if(a === 'addline'){ mePush(); ME.items.push({ t:'line', x: meSnap(cx - 100), y: meSnap(cy), w: 200, h: 0 }); ME.sel = ME.items.length - 1; meDraw(); return; }
  if(!it) return;
  if(a === 'rot'){ mePush(); const mx = it.x + it.w / 2, my = it.y + it.h / 2, w = it.h, h = it.w; it.w = w; it.h = h; if(it.t !== 'line'){ it.x = meSnap(mx - w / 2); it.y = meSnap(my - h / 2); } meDraw(); }
  else if(a === 'dup'){ mePush(); const cp = JSON.parse(JSON.stringify(it)); cp.x += 20; cp.y += 20; if(cp.t === 'zone'){ let n = 2; while(ME.items.some(o => o.t === 'zone' && o.code === it.code + '-' + n)) n++; cp.code = it.code + '-' + n; } ME.items.push(cp); ME.sel = ME.items.length - 1; meDraw(); }
  else if(a === 'del'){ if(!confirm('Retirer « ' + (it.t === 'zone' ? it.code : (it.text || 'cet élément')) + ' » du plan ?' + (it.t === 'zone' ? '\n(Le stock enregistré sous ce code n’est pas touché.)' : ''))) return; mePush(); ME.items.splice(ME.sel, 1); ME.sel = -1; meDraw(); }
}
async function meSave(){

// ══════════════════════════════════════════════════════════════════
//  📦 BOÎTES (1 Nov 2026) — temporary holding boxes in a store (« Montres »,
//  « Maquillage à ranger ») while a department is rearranged. A box is a
//  zone flagged `box` in the store's plan (code BOX1, BOX2…, name in its
//  description): counted, sold from and moved like any zone. 📤 Ranger moves
//  its products to a real zone; an empty box can be closed.
// ══════════════════════════════════════════════════════════════════
function isBox(loc, code){ const z = zoneList(loc).find(q => q.c === code); return !!(z && z.b); }
function boxName(loc, code){ const z = zoneList(loc).find(q => q.c === code); return z && z.b ? (z.k || code) : code; }
function boxesOf(loc){ return zoneList(loc).filter(z => z.b); }
async function meSaveLayout(loc, items, vw, vh){
  const r = n => Math.round(n * 10) / 10;
  const out = items.map(i => i.t === 'zone'
    ? Object.assign({ t:'zone', code: i.code, x: r(i.x), y: r(i.y), w: r(i.w), h: r(i.h) }, i.k ? { k: i.k } : {}, i.g ? { g: i.g } : {}, i.s ? { s: i.s } : {}, i.sale ? { sale: true } : {}, i.box ? { box: true } : {})
    : Object.assign({ t: i.t, x: r(i.x), y: r(i.y), w: r(i.w), h: r(i.h) }, i.t !== 'line' ? { text: i.text || '' } : {}));
  const maxX = Math.max(vw, ...items.map(i => Math.max(i.x, i.x + i.w) + 20)), maxY = Math.max(vh, ...items.map(i => Math.max(i.y, i.y + i.h) + 20));
  const layout = { viewBox: `0 0 ${Math.round(maxX)} ${Math.round(maxY)}`, items: out, zonesDefined: true };
  const d = await post({ action:'setMapLayout', location: loc, layout, adminName: user.name, adminHash: user.hash });
  if(!d || !d.success) throw new Error((d && d.error) || 'Refusé');
  ls('s1981_maps', JSON.stringify(d.layouts)); applySheetMaps(d.layouts);
}
function boxCreate(loc){
  if(!meIsAdmin()){ toast('Réservé aux administrateurs.'); return; }

    <label class="f" for="bxn">Nom de la boîte</label><input class="t" id="bxn" placeholder="ex. Montres, Maquillage à ranger" maxlength="40">
    <label class="f" for="bxw">Où est-elle ? (facultatif)</label><input class="t" id="bxw" placeholder="ex. derrière la caisse" maxlength="60">
    <button class="go" id="bxgo">Créer la boîte</button><button class="ghost" id="bxno">Annuler</button>`);

}
async function boxMake(loc, name, where){
  const src = meItemsFromMap(loc);
  let n = 1; while(src.items.some(i => i.t === 'zone' && i.code === 'BOX' + n) || zoneList(loc).some(z => z.c === 'BOX' + n)) n++;
  const nb = src.items.filter(i => i.box).length;
  src.items.push({ t:'zone', code: 'BOX' + n, x: 20 + (nb % 6) * 90, y: Math.max(0, src.vh - 70), w: 80, h: 50, k: name, g: 'Boîtes' + (where ? ' · ' + where : ''), s: '', box: true });
  await meSaveLayout(loc, src.items, src.vw, src.vh + (nb ? 0 : 80));
  return 'BOX' + n;
}
// ── Import a ready list into a new box (2 Nov 2026): open Stock1981.html#import=<name>
//    → reads imports/<name>.json from the site {name, loc, where, items:[{barcode,name,count}]},
//    asks the admin, creates the box and opens its count already filled: check, then « Terminer ».
async function checkImport(){
  const m = /#import=([\w-]+)/.exec(location.hash || ''); if(!m || !user) return;
  history.replaceState(history.state, '', location.pathname + location.search);
  if(!meIsAdmin()){ toast('Import réservé aux administrateurs.'); return; }

  const items = (d.items || []).filter(i => i.barcode && Number(i.count) > 0);
  const n = items.reduce((a, i) => a + Number(i.count), 0);
  const ex = boxesOf(d.loc).find(z => z.k === d.name);
  openSheet(`<h3>📦 ${ex ? 'Remplir' : 'Créer'} la boîte « ${esc(d.name)} »</h3><div class="sub">${esc(locName(d.loc))}${d.where ? ' · ' + esc(d.where) : ''}</div>
    <div class="where"><div class="here"><span>${items.length} produit(s)</span><b class="num">${fmt(n)} article(s)</b></div></div>
    <div class="sub">Le comptage s'ouvre déjà rempli : vérifiez, puis « Terminer l'étagère ».</div>

      saveDraft(); go({ screen:'count', loc: d.loc, zone, spot: zone + '-W' });

// ══════════════════════════════════════════════════════════════════
//  4 NOV 2026 (soir) — zone actions, empty shelves, photo from the app,
//  boxes listed under Entrepôt, offline photos, shelf hints.
// ══════════════════════════════════════════════════════════════════
// ── where a product sits: the shelf (spot) holding most of it ──
function shelfOf(loc, bc, zone){
  const k = bkey(aliasOf(bc));
  const r = (DATA ? DATA.spots : []).filter(x => x[0] === loc && bkey(x[3]) === k && (Number(x[5]) || 0) > 0 && x[1] !== UNPLACED && !isBox(loc, x[1]) && (!zone || x[1] === zone))
    .sort((a, b) => (Number(b[5]) || 0) - (Number(a[5]) || 0))[0];
  return r ? r[2] : '';
}
// ── ∅ empty shelves ──
function emptyAt(loc, spot){ const r = (DATA && DATA.empty || []).find(x => x[0] === loc && x[2] === spot); return r ? (r[3] || 'x') : ''; }
async function setEmpty(loc, zone, spots, on){
  if(!meIsAdmin()){ toast('Réservé aux administrateurs.'); return; }

  DATA = DATA || { zones:[], spots:[], prices:{} };
  const before = (DATA.empty || []).slice();
  DATA.empty = (DATA.empty || []).filter(x => !(x[0] === loc && spots.includes(x[2])));
  if(on) spots.forEach(sp => DATA.empty.push([loc, zone, sp, new Date().toISOString(), user ? user.name : '']));
  ls('s1981_cache', JSON.stringify(DATA)); render();

async function offlineCache(urls, onStep){

}

// A US scanner on a French (AZERTY) keyboard types other characters: translated back.
const AZ_MAP = { '&':'1', 'é':'2', '"':'3', "'":'4', '(':'5', '§':'6', 'è':'7', '!':'8', 'ç':'9', 'à':'0', ')':'-', 'q':'a', 'a':'q', 'w':'z', 'z':'w', 'Q':'A', 'A':'Q', 'W':'Z', 'Z':'W' };
function parseShelf(raw){
  const tries = [String(raw || '').trim()];
  tries.push(tries[0].split('').map(ch => AZ_MAP[ch] || ch).join(''));
  for(const t of tries){
    const m = /^S([12])-(.+)$/i.exec(t); if(!m) continue;
    const loc = 'Store ' + m[1], rest = m[2].toLowerCase();
    const zs = zoneList(loc).filter(z => !z.b);
    for(const z of zs){ const sp = zoneSpots(z).find(x => x.code.toLowerCase() === rest); if(sp) return { loc, zone: z.c, spot: sp.code }; }
    let z = zs.find(q => q.c.toLowerCase() === rest);
    if(!z){ const pre = zs.filter(q => q.c.toLowerCase().startsWith(rest)); if(pre.length === 1) z = pre[0]; }
    if(z){ const sps = zoneSpots(z); return { loc, zone: z.c, spot: sps.length === 1 ? sps[0].code : '' }; }
  }
  return null;
}

// ── 🧺 à réassortir: last count minus what went out since (sales + transfers) ──
function restockList(loc){

  rowsAt(loc).forEach(r => {
    if(r[4] <= 0 || r[1] === UNPLACED || isBox(loc, r[1])) return;
    const k = bkey(r[2]), p = byP[k] || (byP[k] = { bk: k, bc: r[2], name: r[3] || productName(r[2]) || r[2], counted: 0, zones: [], from: Infinity });

  });
  const out = [];
  Object.values(byP).forEach(p => {
    const sold = c.sales.filter(x => x[0] === p.bk && x[3] >= p.from).reduce((a, x) => a + x[2], 0);
    const moved = (c.moves || []).filter(m => m.fromLoc === loc && m.toLoc !== loc && bkey(m.bc) === p.bk && sorMoveT(m) >= p.from).reduce((a, m) => a + m.qty, 0);

    if(left > lim) return;

    out.push({ zone: main, bk: p.bk, bc: p.bc, name: p.name, counted: p.counted, left: Math.max(0, left), w: sorWarehouse(p.bk), shelf: shelfOf(loc, p.bc, main), also: p.zones.slice(1).map(z => z[0]) });

}
